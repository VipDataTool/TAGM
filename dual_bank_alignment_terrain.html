function lerp3(a,b,t){return[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1]),a[2]+t*(b[2]-a[2])]}
function stops(t,s){
  t=Math.max(0,Math.min(1,t));
  for(let i=0;i<s.length-1;i++){
    if(t<=s[i+1][0]){const q=(t-s[i][0])/(s[i+1][0]-s[i][0]);return lerp3(s[i][1],s[i+1][1],q)}
  }
  return s[s.length-1][1].slice();
}

function mixColor(mag,mn,mx,klT,xAbs){
  const t=Math.max(0,Math.min(1,(mag-mn)/(mx-mn||1)));
  let [r,g,b]=BASE[curBase].fn(t);
  const ovFn=OVERLAY[curOv].fn;
  if(ovFn){
    const str=0.42*klT;
    const [or,og,ob]=ovFn(klT);
    r=Math.min(1,r+or*str);
    g=Math.min(1,g+og*str);
    b=Math.min(1,b+ob*str);
  }
  // Fade to background with distance from centre (x=0)
  // xAbs = |x|, ranges 0..X_MAX
  // Use a smooth curve: fade starts gently, accelerates near edge
  const fade = Math.pow(xAbs/X_MAX, 1.6);  // 0 at centre, 1 at edge
  r = r*(1-fade) + BG[0]*fade;
  g = g*(1-fade) + BG[1]*fade;
  b = b*(1-fade) + BG[2]*fade;
  return new THREE.Color(r,g,b);
}

      // Rank-slice lines (across X per token) — dim blue-grey
      const v0=vtx[t][c], v1=vtx[t][c+1];
      // Slightly brighter near centre (c=7→8 and c=8→9 cross the origin)
      const near=(c===7||c===8)?0.30:0.14;
      pushSeg(v0.x,v0.y,v0.z, v1.x,v1.y,v1.z, near*0.55,near*0.65,near);
    }
  }
  for(let c=0;c<COLS;c++){
    const isSpine=(c===8);
    for(let t=0;t<nT-1;t++){
      // Token-seq lines (along Z per column)
      const v0=vtx[t][c], v1=vtx[t+1][c];
      if(isSpine){
        // Centre spine — bright, warm white so valley path is legible
        pushSeg(v0.x,v0.y,v0.z, v1.x,v1.y,v1.z, 0.75,0.72,0.62);
      } else {
        const fade=1-Math.pow(Math.abs(c-8)/8,0.7); // bright near centre, dim at edges
        const r=fade*0.22, g=fade*0.26, b=fade*0.38;
        pushSeg(v0.x,v0.y,v0.z, v1.x,v1.y,v1.z, r,g,b);
      }
    }
  }

  const gridGeo=new THREE.BufferGeometry();
  gridGeo.setAttribute('position',new THREE.Float32BufferAttribute(gridP,3));
  gridGeo.setAttribute('color',   new THREE.Float32BufferAttribute(gridC,3));
  wir=new THREE.LineSegments(gridGeo,new THREE.LineBasicMaterial({
    vertexColors:true,transparent:true,opacity:0.82
  }));
  sc.add(wir);

  // ── Token labels at every grid point ─────────────────────────────────────
  // Each grid point (t, c) shows the token that belongs there:
  //   c = 0..7  → base bank, rank R(c+1)   → ctoks[c]
  //   c = 8     → valley spine             → actual input token toks[t]
  //   c = 9..16 → instruct bank, reversed  → ctoks[16-c]
  // Textures are cached by string so identical tokens share one canvas.
  const LW=96, LH=24;
  const LSCALE_X = SCX * 0.90;
  const LSCALE_Y = LSCALE_X * (LH/LW);
  const texCache = {};

  const getTexture=(str, klT)=>{
    // Cache key includes colour bucket so KL-tinted tokens don't bleed
    const bucket = Math.round(klT * 8);
    const key = str + '|' + bucket;
    if (texCache[key]) return texCache[key];

    const S=2;
    const lc=document.createElement('canvas');
    lc.width=LW*S; lc.height=LH*S;
    const lx=lc.getContext('2d');
    lx.scale(S,S);

    const [ar,ag,ab]=BASE[curBase].fn(Math.max(0.15, klT*0.75+0.18));
    const tR=Math.round(ar*255), tG=Math.round(ag*255), tB=Math.round(ab*255);

    lx.font='700 12px system-ui,sans-serif';
    lx.textAlign='center';
    lx.textBaseline='middle';
    lx.shadowBlur=0;
    // Dark outline
    lx.lineWidth=2.5;
    lx.strokeStyle='rgba(0,0,0,0.95)';
    lx.strokeText(str, LW/2, LH/2);
    // Bright white fill
    lx.fillStyle='rgba(240,237,228,1.0)';
    lx.fillText(str, LW/2, LH/2);
    // KL underline
    const ulLen=Math.max(4, Math.round((LW-10)*klT));
    lx.globalAlpha=0.7;
    lx.fillStyle=`rgb(${tR},${tG},${tB})`;
    lx.fillRect((LW-ulLen)/2, LH/2+8, ulLen, 2);
    lx.globalAlpha=1;

    texCache[key] = new THREE.CanvasTexture(lc);
    return texCache[key];
  };

  for(let t=0;t<nT;t++){
    const [,,kl,,ctoks]=rows[t];
    const klT=(kl-klMin)/(klMax-klMin||1);

    for(let c=0;c<COLS;c++){
      const {x,y,z}=vtx[t][c];

      // Resolve which token string belongs at this column
      let str;
      if      (c <  8) str = (ctoks[c]       || '').replace(/^[\s\u0120\u00c2ĠÂ]/,'').trim().slice(0,12);
      else if (c === 8) str = toks[t]              .replace(/^[\s\u0120\u00c2ĠÂ]/,'').trim().slice(0,12);
      else              str = (ctoks[16-c]    || '').replace(/^[\s\u0120\u00c2ĠÂ]/,'').trim().slice(0,12);
      if (!str) str = '·';

      const tex=getTexture(str, klT);
      const fade=Math.max(0.28, 1-Math.pow(Math.abs(c-8)/8, 1.2)*0.68);
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({
        map:tex, transparent:true, depthTest:false, opacity:fade
      }));
      sp.position.set(x, y+OFF+0.06, z);
      sp.scale.set(LSCALE_X, LSCALE_Y, 1);
      sc.add(sp); lbs.push(sp);
    }
  }

  // ── Axis domain labels — at x=0, flanking the spine ──────────────────────
  // Positioned just before the first token (z front) so they read as axis headers
  const frontZ = vtx[0][8].z + scZ*0.6;

  const makeAx=(txt,xp,align)=>{
    const ac=document.createElement('canvas'); ac.width=160; ac.height=22;
    const ax=ac.getContext('2d');
    ax.font='500 10px system-ui,sans-serif';
    ax.fillStyle='rgba(110,110,130,0.55)';
    ax.textAlign=align||'center';
    ax.fillText(txt, align==='right'?155:align==='left'?5:80, 14);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({
      map:new THREE.CanvasTexture(ac),transparent:true,depthTest:false
    }));
    sp.position.set(xp, FY+0.1, frontZ);
    sp.scale.set(1.3, 0.19, 1);
    sc.add(sp); lbs.push(sp);
  };
  makeAx('← base',   -2.2, 'right');
  makeAx('instruct →', 2.2, 'left');

  // ── Info bar ──────────────────────────────────────────────────────────────
  updatePromptSelect();
  document.getElementById('info').textContent=
    `${nT} tokens · peak KL ${Math.max(...klVals).toFixed(3)} · `+
    `tension [${(mn*1000).toFixed(2)},${(mx*1000).toFixed(2)}]×10⁻³`;

  updateLegends();
}

// ── Prompt select ─────────────────────────────────────────────────────────────
function updatePromptSelect(){
  const sel=document.getElementById('pSel');
  sel.innerHTML='';
  D[curCat].forEach((entry,i)=>{
    const opt=document.createElement('option');
    opt.value=i;
    opt.textContent=entry[0].slice(0,58);
    opt.selected=(i===curPromptIdx);
    sel.appendChild(opt);
  });
}
window.selectCat=function(c){
  curCat=c;curPromptIdx=0;
  document.querySelectorAll('#catRow .btn').forEach(b=>{
    b.className='btn'+(b.textContent===c?' on':'');
  });
  build();
};
window.selectPrompt=function(i){curPromptIdx=i;build();};

// ── Legends ───────────────────────────────────────────────────────────────────
function drawGrad(canvas,fn){
  canvas.width=160;
  const ctx=canvas.getContext('2d');
  const g=ctx.createLinearGradient(0,0,160,0);
  for(let i=0;i<=20;i++){
    const tt=i/20;
    const [r,gr,b]=fn(tt);
    g.addColorStop(tt,`rgb(${Math.round(r*255)},${Math.round(gr*255)},${Math.round(b*255)})`);
  }
  ctx.fillStyle=g;ctx.fillRect(0,0,160,7);
}
function updateLegends(){
  drawGrad(document.getElementById('legBase'),BASE[curBase].fn);
  const wrap=document.getElementById('legOvWrap');
  const fn=OVERLAY[curOv].fn;
  if(fn){wrap.style.display='inline-flex';drawGrad(document.getElementById('legOv'),fn);}
  else{wrap.style.display='none';}
}

// ── Color selector buttons ────────────────────────────────────────────────────
function makeSwatch(fn){
  const c=document.createElement('canvas');c.width=32;c.height=8;c.className='sw';
  const ctx=c.getContext('2d');
  if(fn){
    const g=ctx.createLinearGradient(0,0,32,0);
    for(let i=0;i<=8;i++){const tt=i/8;const[r,gr,b]=fn(tt);g.addColorStop(tt,`rgb(${Math.round(r*255)},${Math.round(gr*255)},${Math.round(b*255)})`);}
    ctx.fillStyle=g;ctx.fillRect(0,0,32,8);
  }else{ctx.fillStyle='#141420';ctx.fillRect(0,0,32,8);}
  return c;
}
function buildButtons(){
  const bd=document.getElementById('baseCtrl');
  Object.entries(BASE).forEach(([k,def])=>{
    const btn=document.createElement('button');
    btn.className='cs'+(k===curBase?' on':'');
    btn.appendChild(makeSwatch(def.fn));
    btn.appendChild(document.createTextNode(def.label));
    btn.onclick=()=>{
      curBase=k;
      document.querySelectorAll('#baseCtrl .cs').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      build();
    };
    bd.appendChild(btn);
  });

  const od=document.getElementById('ovCtrl');
  Object.entries(OVERLAY).forEach(([k,def])=>{
    const btn=document.createElement('button');
    btn.className='cs'+(k===curOv?' on':'');
    btn.appendChild(makeSwatch(def.fn));
    btn.appendChild(document.createTextNode(def.label));
    btn.onclick=()=>{
      curOv=k;
      document.querySelectorAll('#ovCtrl .cs').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      build();
    };
    od.appendChild(btn);
  });
}

// ── Camera — orbit (left drag) · pan (right/middle drag) · zoom (scroll) ─────
let th=0.55, ph=0.68, rad=14;
// Mutable look-at target — pan moves this
const target = new THREE.Vector3(0, FY+1.0, 0);

function updateCam(){
  cam.position.set(
    target.x + rad*Math.sin(ph)*Math.cos(th),
    target.y + rad*Math.cos(ph),
    target.z + rad*Math.sin(ph)*Math.sin(th)
  );
  cam.lookAt(target);
}

// Per-pointer state: button + last position
const ptrs={};

cv.addEventListener('contextmenu', e=>e.preventDefault());

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]={btn:e.button, x:e.clientX, y:e.clientY};
});

cv.addEventListener('pointerup',e=>{
  cv.releasePointerCapture(e.pointerId);
  delete ptrs[e.pointerId];
});

cv.addEventListener('pointermove',e=>{
  const p=ptrs[e.pointerId];
  if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;

  if(p.btn===0){
    // Left drag → orbit
    th += dx*0.008;
    ph = Math.max(0.08, Math.min(1.55, ph - dy*0.008));
  } else {
    // Right or middle drag → pan in camera-space XY plane
    // Scale pan speed with distance so it feels consistent at any zoom
    const speed = rad * 0.0012;
    // Camera right vector
    const right = new THREE.Vector3();
    right.crossVectors(
      new THREE.Vector3(0,1,0),
      new THREE.Vector3(Math.sin(ph)*Math.cos(th), Math.cos(ph), Math.sin(ph)*Math.sin(th))
    ).normalize();
    // Camera up vector (cross of forward and right)
    const fwd = new THREE.Vector3(Math.sin(ph)*Math.cos(th), Math.cos(ph), Math.sin(ph)*Math.sin(th)).normalize();
    const up  = new THREE.Vector3().crossVectors(right, fwd).normalize();
    target.addScaledVector(right, -dx*speed);
    target.addScaledVector(up,     dy*speed);
  }
  updateCam();
});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  rad=Math.max(4,Math.min(30,rad+e.deltaY*0.012));
  updateCam();
},{passive:false});

// ── Boot ──────────────────────────────────────────────────────────────────────
buildButtons();
updateCam();
build();
(function loop(){requestAnimationFrame(loop);ren.render(sc,cam)})();
</script>
