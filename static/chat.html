<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAGM Chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0:#121212;--bg-1:#1E1E1E;--bg-2:#252525;--bg-3:#2d2d2d;
  --border:#333333;--text-0:#DEE2E6;--text-1:#9CA3AF;--text-2:#6B7280;--text-3:#4B5563;
  --blue:#58a6ff;--green:#009E73;--orange:#E69F00;--red:#D55E00;--cyan:#56B4E9;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-0);color:var(--text-0);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
header h1{font-size:16px;font-weight:500;color:var(--text-0)}
header a{color:var(--text-2);font-size:12px;text-decoration:none}
header a:hover{color:var(--text-0)}
.controls{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:12px;color:var(--text-1);flex-wrap:wrap}
.controls label{display:flex;align-items:center;gap:4px;cursor:pointer}
.controls input[type=checkbox]{accent-color:var(--cyan)}
.hdr-btn{background:none;border:1px solid var(--border);color:var(--text-2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:var(--sans)}
.hdr-btn:hover{color:var(--text-0);border-color:var(--text-2)}
.model-info{font-size:10px;color:var(--text-2);font-family:var(--mono);padding:2px 16px;background:var(--bg-1);border-bottom:1px solid var(--border);flex-shrink:0}
.model-info .active-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:600;margin-left:6px}
.model-info .active-badge.instruct{background:var(--cyan);color:#000}
.model-info .active-badge.base{background:var(--orange);color:#000}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:8px;line-height:1.5;font-size:14px;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--bg-3);color:var(--text-0);border:1px solid var(--border)}
.msg.assistant{align-self:flex-start;background:var(--bg-2);color:var(--text-0)}
.msg.error{align-self:center;color:var(--red);font-size:12px}
.msg.system{align-self:center;color:var(--text-2);font-size:12px;font-style:italic}
.msg .analyzed{font-size:10px;color:var(--text-3);margin-top:4px}
.model-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin-bottom:4px;font-family:var(--mono);font-weight:500}
.model-badge.instruct{background:var(--cyan);color:#000}
.model-badge.base{background:var(--orange);color:#000}
.ecm-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin-bottom:4px;font-family:var(--mono);font-weight:500;background:var(--green);color:#000}
.input-row{padding:12px 16px;background:var(--bg-1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.input-row textarea{flex:1;background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--sans);font-size:14px;resize:none;min-height:44px;max-height:120px;outline:none}
.input-row textarea:focus{border-color:var(--cyan)}
.input-row button{background:var(--bg-3);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:8px 16px;cursor:pointer;font-family:var(--sans);font-size:13px;white-space:nowrap}
.input-row button:hover{background:var(--border)}
.input-row button:disabled{opacity:0.4;cursor:not-allowed}
.status{font-size:11px;color:var(--text-3);padding:4px 16px;flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>TAGM Chat</h1>
  <a href="/">← Analyzer</a>
  <div class="controls">
    <label><input type="checkbox" id="chkAnalyze" checked> Analyze prompts</label>
    <label><input type="checkbox" id="chkResponses"> Analyze responses</label>
    <label><input type="checkbox" id="chkLTP" checked> LTP</label>
    <label><input type="checkbox" id="chkSFD" checked> SFD</label>
    <label style="border-left:1px solid var(--border);padding-left:12px"><input type="checkbox" id="chkECM" onchange="toggleECM(this.checked)"> ECM</label>
    <select id="chatModelClass" onchange="setChatModelClass(this.value)" style="background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;font-family:var(--sans)">
      <option value="instruct" selected>Instruct</option>
      <option value="base">Base</option>
    </select>
    <button class="hdr-btn" onclick="resetChat()">Reset</button>
  </div>
</header>
<div class="model-info" id="modelInfo">Loading model info...</div>
<div class="messages" id="messages"></div>
<div class="status" id="status"></div>
<div class="input-row">
  <textarea id="input" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="sendBtn" onclick="send()">Send</button>
</div>
<script>
const chatMessages=[];
let busy=false;
let turnCount=0;
let chatCfg={max_tokens:128,temperature:0.7,top_p:0.9,analyze_prompts:true,analyze_responses:false,compute_ltp:true,compute_sfd:true};

function $(id){return document.getElementById(id)}

function setStatus(msg){$('status').textContent=msg}

function addMsg(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  $('messages').appendChild(d);
  $('messages').scrollTop=$('messages').scrollHeight;
  return d;
}

// Load config and model info on startup
async function initChat(){
  try{
    const [cfgResp,statusResp]=await Promise.all([
      fetch('/api/chat/config').then(r=>r.json()),
      fetch('/api/status').then(r=>r.json())
    ]);
    if(cfgResp.ok&&cfgResp.config){
      chatCfg=Object.assign(chatCfg,cfgResp.config);
      $('chkAnalyze').checked=!!chatCfg.analyze_prompts;
      $('chkResponses').checked=!!chatCfg.analyze_responses;
      $('chkLTP').checked=chatCfg.compute_ltp!==false;
      $('chkSFD').checked=chatCfg.compute_sfd!==false;
    }
    var info='';
    if(statusResp.model_loaded){
      var pair=statusResp.model_pair||'';
      var name=statusResp.model_name||pair;
      info=name||'Model loaded';
      var cls=statusResp.inference_class||'instruct';
      info+=' <span class="active-badge '+cls+'">'+cls+'</span>';
      $('chatModelClass').value=cls;
    }else{
      info='<span style="color:var(--red)">No model loaded</span>';
    }
    $('modelInfo').innerHTML=info;
    setStatus('Ready — temp='+chatCfg.temperature+' top_p='+chatCfg.top_p+' max_tokens='+chatCfg.max_tokens);
    // Sync ECM toggle with server state
    fetch('/api/engine_config').then(r=>r.json()).then(d=>{
      if(d.ok&&d.config) $('chkECM').checked=!!d.config.ecm_active;
    }).catch(()=>{});
  }catch(e){
    $('modelInfo').textContent='Failed to load config';
  }
}
initChat();

async function send(){
  if(busy)return;
  const input=$('input');
  const text=input.value.trim();
  if(!text)return;

  input.value='';
  input.style.height='44px';
  chatMessages.push({role:'user',content:text});
  addMsg('user',text);

  const doAnalyze=$('chkAnalyze').checked;
  const doAnalyzeResp=$('chkResponses').checked;
  busy=true;
  $('sendBtn').disabled=true;
  turnCount++;

  // Create the assistant message element for streaming into
  const msgEl=document.createElement('div');
  msgEl.className='msg assistant';
  $('messages').appendChild(msgEl);
  setStatus('Generating...');

  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:chatMessages,
        max_tokens:chatCfg.max_tokens,
        analyze:doAnalyze,
        analyze_response:doAnalyzeResp,
        compute_ltp:$('chkLTP').checked,
        compute_sfd:$('chkSFD').checked,
      })
    });

    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    let responseText='';
    let statusParts=[];
    let textSpan=document.createElement('span');
    msgEl.appendChild(textSpan);

    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buffer+=decoder.decode(value,{stream:true});

      // Parse SSE lines from buffer
      let lines=buffer.split('\n');
      buffer=lines.pop(); // keep incomplete line in buffer
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        let evt;
        try{ evt=JSON.parse(line.slice(6)); }catch(e){ continue; }

        if(evt.type==='token'){
          responseText+=evt.text;
          textSpan.textContent=responseText;
          $('messages').scrollTop=$('messages').scrollHeight;
        }
        else if(evt.type==='done'){
          chatMessages.push({role:'assistant',content:evt.response||responseText});
          // Model class badge
          if(evt.model_class){
            const badge=document.createElement('div');
            badge.className='model-badge '+evt.model_class;
            badge.textContent=evt.model_class;
            msgEl.insertBefore(badge,msgEl.firstChild);
          }
          // ECM badge
          if(evt.ecm_active&&evt.ecm_diagnostics){
            const eb=document.createElement('span');
            eb.className='ecm-badge';
            const d=evt.ecm_diagnostics;
            eb.textContent='ECM '+d.n_interventions+'/'+d.n_tokens+' · max='+d.max_cascade_signal.toFixed(3);
            msgEl.insertBefore(eb,msgEl.children[1]||null);
          }
          if(evt.n_input_tokens) statusParts.push(evt.n_input_tokens+' in');
          if(evt.n_output_tokens) statusParts.push(evt.n_output_tokens+' out');
          setStatus('Turn '+turnCount+'. '+(statusParts.length?statusParts.join(', '):''));
        }
        else if(evt.type==='analyzed'){
          statusParts.push(evt.target+' analyzed');
          setStatus('Turn '+turnCount+'. '+statusParts.join(', '));
        }
        else if(evt.type==='error'){
          msgEl.remove();
          addMsg('error',evt.error||'Unknown error');
          setStatus('Error: '+(evt.error||'unknown'));
        }
      }
    }
    // Show analysis tag if any analysis happened
    if(statusParts.some(s=>s.includes('analyzed'))){
      const tag=document.createElement('div');
      tag.className='analyzed';
      tag.textContent='✓ '+statusParts.join(', ')+' — see Data tab in Analyzer';
      msgEl.appendChild(tag);
    }
  }catch(e){
    if(!msgEl.querySelector('span')||!msgEl.querySelector('span').textContent){
      msgEl.remove();
    }
    addMsg('error','Network error: '+e.message);
    setStatus('Network error');
  }
  busy=false;
  $('sendBtn').disabled=false;
  input.focus();
}

function toggleECM(active){
  fetch('/api/engine_config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ecm_active:active})
  }).then(r=>r.json()).then(d=>{
    if(d.ok) setStatus('ECM '+(active?'enabled':'disabled'));
    else setStatus('ECM toggle failed');
  }).catch(()=>setStatus('ECM toggle failed'));
}

function resetChat(){
  chatMessages.length=0;
  turnCount=0;
  $('messages').innerHTML='';
  setStatus('Chat reset. Session data preserved in Analyzer.');
}

async function setChatModelClass(cls){
  const sel=$('chatModelClass');sel.disabled=true;
  setStatus('Switching to '+cls+'...');
  try{
    const fd=new FormData();fd.append('model_class',cls);
    const r=await(await fetch('/api/set_inference_model',{method:'POST',body:fd})).json();
    if(!r.ok){
      addMsg('error',r.error||'Failed to switch');
      sel.value=(cls==='base'?'instruct':'base');
    } else {
      addMsg('system','Switched to '+cls+' model');
      // Update model info bar
      var badge=$('modelInfo').querySelector('.active-badge');
      if(badge){badge.className='active-badge '+cls;badge.textContent=cls}
    }
    setStatus('Active model: '+sel.value);
  }catch(e){addMsg('error','Switch error: '+e.message);sel.value=(cls==='base'?'instruct':'base')}
  sel.disabled=false;
}

$('input').addEventListener('input',function(){
  this.style.height='44px';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
</script>
</body>
</html>
