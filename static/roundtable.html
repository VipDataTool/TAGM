<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAGM Roundtable</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/static/js/common/esc.js?v=1"></script>
<script src="/static/js/common/api.js?v=1"></script>
<script src="/static/js/common/download.js?v=1"></script>
<style>
:root {
  --bg-0:#121212; --bg-1:#1E1E1E; --bg-2:#252525; --bg-3:#2d2d2d; --bg-4:#363636;
  --border:#333; --border-h:#555;
  --text-0:#DEE2E6; --text-1:#9CA3AF; --text-2:#6B7280; --text-3:#4B5563;
  --blue:#58a6ff; --green:#009E73; --orange:#E69F00; --red:#D55E00; --cyan:#56B4E9;
  --purple:#bc8cff; --amber:#f0883e;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg-0); color:var(--text-0); font-family:var(--sans); font-size:14px; height:100vh; display:flex; flex-direction:column; }

/* Header */
header { padding:8px 16px; background:var(--bg-1); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-shrink:0; }
header h1 { font-size:15px; font-weight:600; }
header a { color:var(--text-2); font-size:12px; text-decoration:none; }
header a:hover { color:var(--text-0); }
.pill { font-family:var(--mono); font-size:10px; padding:3px 10px; border-radius:10px; font-weight:600; }
.pill-panel { background:#58a6ff18; color:var(--blue); border:1px solid #58a6ff40; }
.pill-analysis { background:#bc8cff18; color:var(--purple); border:1px solid #bc8cff40; }
.pill-tool { background:#f0883e18; color:var(--amber); border:1px solid #f0883e40; }
.hdr-actions { margin-left:auto; display:flex; gap:6px; align-items:center; }
.hdr-btn { padding:4px 10px; font-size:11px; font-family:var(--sans); border:1px solid var(--border); background:var(--bg-3); color:var(--text-1); border-radius:4px; cursor:pointer; }
.hdr-btn:hover { background:var(--bg-4); color:var(--text-0); }
.hdr-btn.danger { color:var(--red); border-color:#D55E0050; }
.hdr-btn.danger:hover { background:#D55E0020; }
.file-label { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; font-size:11px; border:1px solid var(--border); border-radius:4px; cursor:pointer; color:var(--text-1); background:var(--bg-3); }
.file-label:hover { color:var(--text-0); background:var(--bg-4); }
.file-label input { display:none; }

/* Layout */
.layout { flex:1; display:flex; overflow:hidden; }

/* Sidebar */
.sidebar { width:280px; background:var(--bg-1); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; flex-shrink:0; }
.sb-section { padding:12px 14px; border-bottom:1px solid var(--border); }
.sb-label { font-size:10px; font-family:var(--mono); font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-2); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
.sb-label button { font-size:10px; font-family:var(--sans); border:1px solid var(--border); background:var(--bg-3); color:var(--cyan); border-radius:3px; padding:2px 8px; cursor:pointer; }
.sb-label button:hover { background:var(--bg-4); }
.participant-list { display:flex; flex-direction:column; gap:4px; }
.p-row { padding:6px 8px; background:var(--bg-2); border:1px solid var(--border); border-radius:4px; display:flex; align-items:center; gap:8px; font-size:12px; }
.p-row .p-info { flex:1; min-width:0; }
.p-row .p-name { font-weight:500; color:var(--text-0); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-row .p-role { font-size:10px; color:var(--text-2); font-family:var(--mono); }
.p-row .p-del { color:var(--text-3); cursor:pointer; font-size:16px; line-height:1; padding:0 2px; flex-shrink:0; }
.p-row .p-del:hover { color:var(--red); }
.p-empty { font-size:11px; color:var(--text-3); font-style:italic; }
.sb-input { width:100%; background:var(--bg-2); color:var(--text-0); border:1px solid var(--border); border-radius:4px; padding:5px 8px; font-size:12px; font-family:var(--sans); outline:none; margin-bottom:5px; }
.sb-input:focus { border-color:var(--cyan); }
.sb-textarea { width:100%; background:var(--bg-2); color:var(--text-0); border:1px solid var(--border); border-radius:4px; padding:5px 8px; font-size:11px; font-family:var(--mono); outline:none; resize:vertical; min-height:44px; margin-bottom:5px; }
.sb-textarea:focus { border-color:var(--cyan); }
.sb-btn { padding:4px 12px; font-size:11px; border:1px solid var(--cyan); background:transparent; color:var(--cyan); border-radius:3px; cursor:pointer; font-family:var(--sans); }
.sb-btn:hover { background:#56B4E915; }
.sb-row { display:flex; gap:8px; align-items:flex-end; }
.sb-row > div { flex:1; }
.sb-row label { display:block; font-size:10px; color:var(--text-2); margin-bottom:3px; }
.sb-topic { font-size:12px; color:var(--text-1); line-height:1.5; word-wrap:break-word; }

/* Chat column */
.chat-col { flex:1; display:flex; flex-direction:column; min-width:0; }

/* Messages */
.messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }

.msg { max-width:80%; padding:10px 14px; border-radius:8px; line-height:1.55; font-size:13px; word-wrap:break-word; white-space:pre-wrap; }
.msg-user { align-self:flex-end; background:var(--bg-3); border:1px solid var(--border); }
.msg-user .msg-tag { color:var(--text-3); }
.msg-persona { align-self:flex-start; background:var(--bg-2); border-left:3px solid var(--blue); }
.msg-persona .msg-tag { color:var(--blue); }
.msg-analysis { align-self:stretch; max-width:100%; background:var(--bg-2); border-left:3px solid var(--purple); }
.msg-analysis .msg-tag { color:var(--purple); }
.msg-tool { align-self:stretch; max-width:100%; background:var(--bg-2); border-left:3px solid var(--amber); }
.msg-tool .msg-tag { color:var(--amber); }
.msg-system { align-self:center; color:var(--text-3); font-size:11px; font-style:italic; padding:4px 8px; }
.msg-error { align-self:center; color:var(--red); font-size:12px; }
.msg-tag { font-family:var(--mono); font-size:10px; font-weight:600; margin-bottom:4px; letter-spacing:.3px; }

.stage-divider { display:flex; align-items:center; gap:10px; padding:4px 0; }
.stage-divider::before, .stage-divider::after { content:''; flex:1; border-top:1px solid var(--border); }
.stage-divider span { font-family:var(--mono); font-size:10px; color:var(--text-3); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }

/* Control bar */
.control-bar { padding:8px 16px; background:var(--bg-1); border-top:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-shrink:0; }
.mode-btn { padding:5px 14px; font-size:11px; font-family:var(--mono); font-weight:600; border:1px solid var(--border); background:var(--bg-2); color:var(--text-2); border-radius:4px; cursor:pointer; letter-spacing:.4px; transition:all .15s; }
.mode-btn:hover { color:var(--text-0); background:var(--bg-3); }
.mode-btn.active-panel { color:var(--blue); border-color:var(--blue); background:#58a6ff12; }
.mode-btn.active-analysis { color:var(--purple); border-color:var(--purple); background:#bc8cff12; }
.mode-btn.active-tool { color:var(--amber); border-color:var(--amber); background:#f0883e12; }
.ctl-area { flex:1; display:flex; align-items:center; gap:8px; }
.ctl-select { flex:1; background:var(--bg-2); color:var(--text-0); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-family:var(--sans); font-size:13px; outline:none; }
.ctl-select:focus { border-color:var(--cyan); }
.ctl-btn { padding:6px 18px; border-radius:4px; font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer; border:none; }
.ctl-btn-panel { background:var(--blue); color:#000; }
.ctl-btn-panel:hover { background:#79bbff; }
.ctl-btn-analysis { background:var(--purple); color:#000; }
.ctl-btn-analysis:hover { background:#d4b3ff; }
.ctl-btn-tool { background:var(--amber); color:#000; }
.ctl-btn-tool:hover { background:#f4ab55; }
.ctl-btn:disabled { opacity:.35; cursor:not-allowed; }

/* Input */
.input-row { padding:8px 16px; background:var(--bg-1); border-top:1px solid var(--border); display:flex; gap:8px; flex-shrink:0; }
.input-row textarea { flex:1; background:var(--bg-2); color:var(--text-0); border:1px solid var(--border); border-radius:6px; padding:9px 12px; font-family:var(--sans); font-size:13px; resize:none; min-height:40px; max-height:100px; outline:none; }
.input-row textarea:focus { border-color:var(--cyan); }
.input-row button { padding:8px 20px; }

.status { font-size:10px; color:var(--text-3); padding:3px 16px; font-family:var(--mono); flex-shrink:0; background:var(--bg-1); }
</style>
</head>
<body>

<header>
  <h1>TAGM Roundtable</h1>
  <a href="/">← Analyzer</a>
  <span class="pill pill-panel" id="stagePill">PANEL 1</span>
  <div class="hdr-actions">
    <label class="file-label">📄 Template<input type="file" accept=".csv,.json" onchange="loadTemplate(this)"></label>
    <button class="hdr-btn" onclick="exportSession()">Export</button>
    <button class="hdr-btn danger" onclick="resetSession()">Reset</button>
  </div>
</header>

<div class="layout">
  <!-- ─── Sidebar ──────────────────────────── -->
  <div class="sidebar">
    <div class="sb-section">
      <div class="sb-label">Participants <button onclick="toggleAddForm()">+ Add</button></div>
      <div style="margin-bottom:8px">
        <button class="sb-btn" onclick="resetToChampions()" style="width:100%;font-size:10px" title="Reset to all 30 default personas">Reset to Defaults</button>
      </div>
      <div class="participant-list" id="pList"><div class="p-empty">Loading…</div></div>
      <div id="addForm" style="display:none;margin-top:8px">
        <input class="sb-input" id="pName" placeholder="Name">
        <input class="sb-input" id="pRole" placeholder="Role (e.g. Historian)">
        <textarea class="sb-textarea" id="pPrompt" placeholder="System prompt — who is this persona?"></textarea>
        <div style="display:flex;gap:6px">
          <button class="sb-btn" onclick="saveParticipant()">Save</button>
          <button class="sb-btn" onclick="toggleAddForm()" style="border-color:var(--border);color:var(--text-2)">Cancel</button>
        </div>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">Topic</div>
      <div class="sb-topic" id="topicDisplay">(not set)</div>
    </div>

    <div class="sb-section">
      <div class="sb-label">Generation Settings</div>
      <div class="sb-row">
        <div>
          <label>Temperature</label>
          <input class="sb-input" id="cfgTemp" type="number" step="0.05" min="0.01" max="2" value="0.7" onchange="updateGenConfig()">
        </div>
        <div>
          <label>Max Tokens</label>
          <input class="sb-input" id="cfgMaxTok" type="number" step="32" min="32" max="2048" value="1024" onchange="updateGenConfig()">
        </div>
      </div>
    </div>

    <div class="sb-section" style="border:none">
      <div class="sb-label">Session</div>
      <div style="font-size:11px;color:var(--text-2)" id="sessionInfo">No active session</div>
    </div>
  </div>

  <!-- ─── Chat column ─────────────────────── -->
  <div class="chat-col">
    <div class="messages" id="messages"></div>
    <div class="status" id="status">Type your inquiry below to begin</div>

    <div class="control-bar">
      <button class="mode-btn active-panel" id="modePanel" onclick="setMode('PANEL')">PANEL</button>
      <button class="mode-btn" id="modeAnalysis" onclick="setMode('ANALYSIS')">ANALYSIS</button>
      <button class="mode-btn" id="modeTool" onclick="setMode('TOOL')">TOOL</button>
      <button class="mode-btn" onclick="newStage()" title="Seal current stage, start fresh" style="margin-left:4px;border-style:dashed">+ New Stage</button>
      <div class="ctl-area" id="ctlArea"></div>
    </div>

    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Type your inquiry…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="ctl-btn ctl-btn-panel" id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
/* ── State ──────────────────────────────── */
var busy = false, sessionActive = false;
var currentMode = 'PANEL';
var participants = [], methods = [], tools = [];

/* ── Init ───────────────────────────────── */
async function init() {
  await Promise.all([loadParticipants(), loadMethods()]);
  renderControls();
}
init();

async function loadParticipants() {
  try {
    var r = await (await fetch('/api/roundtable/participants')).json();
    if (!r.ok) return;
    participants = r.participants;
    var list = document.getElementById('pList');
    list.innerHTML = '';
    if (participants.length === 0) {
      list.innerHTML = '<div class="p-empty">No participants yet — add one above</div>';
    } else {
      participants.forEach(function(p) {
        if (!p.active) return;
        var row = document.createElement('div');
        row.className = 'p-row';
        row.innerHTML = '<div class="p-info"><div class="p-name">' + esc(p.name) + '</div>'
          + '<div class="p-role">' + esc(p.role || 'no role') + '</div></div>'
          // p.id lands inside a quoted JS string inside a quoted HTML
          // attribute; unescaped it can close both and run arbitrary code.
          + '<span class="p-del" onclick="deleteParticipant(\'' + esc(p.id) + '\')" title="Remove">×</span>';
        list.appendChild(row);
      });
    }
    // Rebuild dropdown if in PANEL mode
    if (currentMode === 'PANEL') renderControls();
  } catch(e) { console.error('loadParticipants', e); }
}

async function loadMethods() {
  try {
    var r = await (await fetch('/api/roundtable/methods')).json();
    if (!r.ok) return;
    methods = r.methods || [];
    tools = r.tools || [];
  } catch(e) {}
}

/* ── Participant CRUD ──────────────────── */
function toggleAddForm() {
  var f = document.getElementById('addForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'none') {
    document.getElementById('pName').value = '';
    document.getElementById('pRole').value = '';
    document.getElementById('pPrompt').value = '';
  }
}

async function saveParticipant() {
  var name = document.getElementById('pName').value.trim();
  var role = document.getElementById('pRole').value.trim();
  var prompt = document.getElementById('pPrompt').value.trim();
  if (!name) return;
  await fetch('/api/roundtable/participants', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name, role:role, system_prompt:prompt || 'You are ' + name + '.'})});
  toggleAddForm();
  loadParticipants();
}

async function deleteParticipant(id) {
  await fetch('/api/roundtable/participants/' + id, {method:'DELETE'});
  loadParticipants();
}

async function resetToChampions() {
  try {
    var r = await (await fetch('/api/roundtable/participants/reset', {method:'POST'})).json();
    if (r.ok) {
      setStatus('Reset to Panel of Champions — ' + r.participants.length + ' personas');
      loadParticipants();
    }
  } catch(e) { setStatus('Error: ' + e.message); }
}

/* ── Gen config ────────────────────────── */
async function updateGenConfig() {
  var temp = parseFloat(document.getElementById('cfgTemp').value) || 0.7;
  var maxt = parseInt(document.getElementById('cfgMaxTok').value) || 1024;
  if (sessionActive) {
    await fetch('/api/roundtable/interactive/config', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({temperature:temp, max_tokens:maxt})});
    setStatus('Config updated: temp=' + temp + ', max_tokens=' + maxt);
  }
}

/* ── Mode toggle ───────────────────────── */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modePanel').className = 'mode-btn' + (mode === 'PANEL' ? ' active-panel' : '');
  document.getElementById('modeAnalysis').className = 'mode-btn' + (mode === 'ANALYSIS' ? ' active-analysis' : '');
  document.getElementById('modeTool').className = 'mode-btn' + (mode === 'TOOL' ? ' active-tool' : '');
  renderControls();
}

function renderControls() {
  var area = document.getElementById('ctlArea');
  var h = '';

  if (currentMode === 'PANEL') {
    h += '<select class="ctl-select" id="personaSelect">';
    h += '<option value="">Select a participant…</option>';
    participants.forEach(function(p) {
      if (!p.active) return;
      h += '<option value="' + esc(p.id) + '">' + esc(p.name) + (p.role ? ' — ' + esc(p.role) : '') + '</option>';
    });
    h += '</select>';
    h += '<button class="ctl-btn ctl-btn-panel" onclick="applyPersona()">Apply</button>';

  } else if (currentMode === 'ANALYSIS') {
    h += '<select class="ctl-select" id="methodSelect">';
    h += '<option value="">Select a method…</option>';
    methods.forEach(function(m) {
      h += '<option value="' + esc(m.name) + '">' + esc(m.name) + ' — ' + esc(m.description) + '</option>';
    });
    h += '</select>';
    h += '<button class="ctl-btn ctl-btn-analysis" onclick="applyMethod()">Run</button>';

  } else if (currentMode === 'TOOL') {
    h += '<select class="ctl-select" id="toolSelect">';
    h += '<option value="">Select a tool…</option>';
    tools.forEach(function(t) {
      h += '<option value="' + esc(t.name) + '">' + esc(t.name) + ' — ' + esc(t.description) + '</option>';
    });
    h += '</select>';
    h += '<button class="ctl-btn ctl-btn-tool" onclick="applyTool()">Run</button>';
  }

  area.innerHTML = h;
}

/* ── Session ───────────────────────────── */
async function ensureSession(topic) {
  if (sessionActive) return true;
  var temp = parseFloat(document.getElementById('cfgTemp').value) || 0.7;
  var maxt = parseInt(document.getElementById('cfgMaxTok').value) || 1024;
  try {
    var r = await (await fetch('/api/roundtable/interactive/start', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic:topic, gen_config:{temperature:temp, max_tokens:maxt}})})).json();
    if (r.ok) {
      sessionActive = true;
      updatePill('PANEL','Panel 1');
      // Save topic
      await fetch('/api/roundtable/topic', {method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({topic:topic})});
      document.getElementById('topicDisplay').textContent = topic;
      document.getElementById('sessionInfo').textContent = 'Active — ' + r.session.session_id;
      return true;
    }
    addMsg('error', r.error); return false;
  } catch(e) { addMsg('error', e.message); return false; }
}

async function send() {
  if (busy) return;
  var t = document.getElementById('input').value.trim();
  if (!t) return;
  document.getElementById('input').value = '';

  if (!sessionActive) {
    if (!await ensureSession(t)) return;
    addMsg('user', t);
    setStatus('Session started — select a persona and click Apply');
    return;
  }

  busy = true;
  addMsg('user', t);
  // try/finally: a rejected fetch used to leave busy=true forever, which
  // permanently wedged send/applyPersona/applyMethod/applyTool (they all
  // early-return on `busy`) with no way back short of a page reload.
  try {
    var r = await TAGM.getJSON('/api/roundtable/interactive/send', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:t})});
    // The body-level ok was ignored, so {"ok":false,"error":"No session"} was
    // reported to the user as "Message added".
    if (r.ok) setStatus('Message added');
    else { addMsg('error', r.error || 'Send failed'); setStatus('Send failed'); }
  } catch(e) {
    addMsg('error', e.message); setStatus('Send failed');
  } finally {
    busy = false;
  }
}

async function applyPersona() {
  var sel = document.getElementById('personaSelect');
  if (!sel) return;
  var pid = sel.value;
  if (!pid || !sessionActive || busy) {
    if (!sessionActive) setStatus('Start a session first — type your inquiry below');
    return;
  }
  busy = true;
  var th = addMsg('system', 'Generating…');
  setStatus('Generating…');
  // busy is released in finally — see the comment in send().
  try {
    var r = await TAGM.getJSON('/api/roundtable/interactive/apply_persona', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({participant_id:pid})});
    th.remove();
    if (r.ok) {
      addMsg('persona', r.response, r.name, r.role);
      setStatus(r.name + ' responded — ' + r.n_turns + ' turns');
    } else { addMsg('error', r.error); setStatus('Failed'); }
  } catch(e) { th.remove(); addMsg('error', e.message); setStatus('Failed'); }
  finally { busy = false; }
}

async function applyMethod() {
  var sel = document.getElementById('methodSelect');
  if (!sel) return;
  var m = sel.value;
  if (!m || !sessionActive || busy) return;
  busy = true;
  var th = addMsg('system', 'Running ' + m + '…');
  try {
    var r = await TAGM.getJSON('/api/roundtable/interactive/apply_method', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({method:m})});
    th.remove();
    if (r.ok) { addMsg('analysis', r.output, m); setStatus(m + ' complete'); }
    else { addMsg('error', r.error); setStatus(m + ' failed'); }
  } catch(e) { th.remove(); addMsg('error', e.message); setStatus(m + ' failed'); }
  finally { busy = false; }
}

async function applyTool() {
  var sel = document.getElementById('toolSelect');
  if (!sel) return;
  var t = sel.value;
  if (!t || !sessionActive || busy) return;
  busy = true;
  var th = addMsg('system', 'Running ' + t + '…');
  try {
    var r = await TAGM.getJSON('/api/roundtable/interactive/apply_tool', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({tool:t})});
    th.remove();
    if (r.ok) {
      var out = typeof r.result === 'string' ? r.result : JSON.stringify(r.result, null, 2);
      addMsg('tool', out, 'tool: ' + t);
      setStatus(t + ' complete');
    } else { addMsg('error', r.error); setStatus(t + ' failed'); }
  } catch(e) { th.remove(); addMsg('error', e.message); setStatus(t + ' failed'); }
  finally { busy = false; }
}

function newStage() {
  if (!sessionActive) return;
  // Use current mode as the new stage type
  var nextType = currentMode;
  // Was .then().then() with neither an else branch nor a .catch: a rejected
  // request or an {ok:false} body produced no divider, no pill update and no
  // message — the click simply did nothing.
  TAGM.getJSON('/api/roundtable/interactive/new_stage', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stage_type:nextType})})
  .then(function(r) {
    if (r.ok) {
      addDivider(r.label);
      updatePill(nextType, r.label);
      setStatus('New stage: ' + r.label);
    } else {
      addMsg('error', r.error || 'Could not start a new stage');
      setStatus('New stage failed');
    }
  })
  .catch(function(e) { addMsg('error', e.message); setStatus('New stage failed'); });
}

// Wire the mode buttons' "New Stage" to a separate button in the control bar
// Actually, use the header button — let me add it to the mode bar
// The "New Stage" action is triggered by the header or by switching modes

async function exportSession() {
  if (!sessionActive) return;
  try {
    var r = await TAGM.getJSON('/api/roundtable/interactive/export');
    if (r.ok && r.export) {
      // Shared helper — this copy never called URL.revokeObjectURL, so every
      // export pinned its blob for the life of the tab.
      TAGM.downloadText(JSON.stringify(r.export, null, 2),
        'roundtable_' + r.export.session_id + '.json', 'application/json');
      setStatus('Exported');
    } else {
      addMsg('error', r.error || 'Nothing to export');
    }
  } catch(e) { addMsg('error', e.message); }
}

async function resetSession() {
  await fetch('/api/roundtable/interactive/reset', {method:'POST'});
  sessionActive = false;
  document.getElementById('messages').innerHTML = '';
  updatePill('PANEL', 'Panel 1');
  document.getElementById('sessionInfo').textContent = 'No active session';
  setStatus('Session reset — type a new inquiry to begin');
}

async function loadTemplate(input) {
  var file = input.files[0];
  if (!file) return;
  var text = await file.text();
  var topic = document.getElementById('topicDisplay').textContent;
  if (!topic || topic === '(not set)') topic = prompt('Discussion topic:', 'Roundtable discussion');
  if (!topic) return;
  addMsg('system', 'Running template: ' + file.name);
  setStatus('Running batch pipeline…');
  busy = true;
  try {
    var r = await (await fetch('/api/roundtable/batch', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({template_csv:text, topic:topic,
        temperature: parseFloat(document.getElementById('cfgTemp').value) || 0.7,
        max_tokens: parseInt(document.getElementById('cfgMaxTok').value) || 1024})})).json();
    if (r.ok && r.result) {
      var res = r.result;
      addMsg('system', '✓ Batch complete: ' + res.n_stages + ' stages, ' +
        res.n_total_generations + ' generations, ' + res.elapsed_seconds + 's');
      if (res.final_output) addMsg('analysis', res.final_output.substring(0, 3000), 'Batch Output');
      setStatus('Batch complete');
    } else addMsg('error', r.error || 'Batch failed');
  } catch(e) { addMsg('error', e.message); }
  busy = false;
  input.value = '';
}

/* ── Messages ──────────────────────────── */
function addMsg(type, text, name, role) {
  var d = document.createElement('div');
  var cls = {user:'msg-user', persona:'msg-persona', analysis:'msg-analysis',
             tool:'msg-tool', system:'msg-system', error:'msg-error'};
  d.className = 'msg ' + (cls[type] || 'msg-system');

  if (type !== 'system' && type !== 'error') {
    var tag = document.createElement('div');
    tag.className = 'msg-tag';
    if (type === 'user') tag.textContent = 'You';
    else if (type === 'persona') tag.textContent = (name || 'Agent') + (role ? ' — ' + role : '');
    else if (type === 'analysis') tag.textContent = '── ' + (name || 'analysis') + ' ──';
    else if (type === 'tool') tag.textContent = '⚙ ' + (name || 'tool');
    d.appendChild(tag);
  }

  var s = document.createElement('span');
  s.textContent = text;
  d.appendChild(s);

  document.getElementById('messages').appendChild(d);
  document.getElementById('messages').scrollTop = 999999;
  return d;
}

function addDivider(label) {
  var d = document.createElement('div');
  d.className = 'stage-divider';
  d.innerHTML = '<span>' + esc(label) + '</span>';
  document.getElementById('messages').appendChild(d);
}

function updatePill(type, label) {
  var p = document.getElementById('stagePill');
  p.textContent = label;
  p.className = 'pill pill-' + type.toLowerCase();
}

function setStatus(m) { document.getElementById('status').textContent = m; }
// Shared, quote-safe escaper (static/js/common/esc.js). The old local copy
// used textContent -> innerHTML, which does NOT escape quotes — unsound for
// the value="..." and onclick="…('…')" attribute uses above.
function esc(s) { return TAGM.esc(s); }

document.getElementById('input').addEventListener('input', function() {
  this.style.height = '40px';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
</script>
