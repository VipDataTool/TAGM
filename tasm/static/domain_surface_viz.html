<!DOCTYPE html>
<html>
<head>
<title>Domain Surface — TASM</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font-desc: 13px;
  --font-legend: 12px;
  --font-table: 12px;
  --bg: #1C2128;
  --text: #E8ECEF;
  --text2: #6B7280;
  --border: #444C56;
}
body { background: var(--bg); color: var(--text); font-family: "IBM Plex Mono", monospace; padding: 16px; margin: 0; font-size: var(--font-legend); }
button { font-family: inherit; font-size: var(--font-legend); padding: 2px 8px; border-radius: 3px; cursor: pointer; }
.ctrl-row { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.legend { display: flex; flex-wrap: wrap; font-size: var(--font-legend); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 3px; margin-right: 8px; }
.legend .swatch { width: 8px; height: 8px; border-radius: 1px; display: inline-block; }
#dsCanvas { display: block; cursor: crosshair; }
#dsTip { display: none; position: absolute; background: #2D333B; border: 1px solid #56B4E9; border-radius: 6px; padding: 8px 10px; pointer-events: none; min-width: 240px; max-width: 320px; z-index: 10; box-shadow: 0 4px 12px rgba(0,0,0,.5); font-size: var(--font-table); }
#dsErr { color: #D55E00; font-size: var(--font-desc); padding: 10px; white-space: pre-wrap; }
.btn-cat, .btn-size { border: 1px solid #444; background: transparent; }
.btn-cat.active { opacity: 1 !important; }
</style>
</head>
<body>
<div style="max-width:960px;margin:0 auto">
  <div style="font-size:var(--font-desc);font-weight:700;margin-bottom:4px">Token × Domain × Correction</div>
  <div id="dsSubtitle" style="font-size:var(--font-legend);color:var(--text2);margin-bottom:10px">Loading...</div>

  <div class="ctrl-row" id="catRow"></div>
  <div class="ctrl-row" id="sizeRow"></div>
  <div class="legend" id="subjLegend"></div>

  <div style="overflow-x:auto">
    <div style="position:relative;border:1px solid var(--border);border-radius:6px">
      <canvas id="dsCanvas"></canvas>
      <div id="dsTip"></div>
    </div>
  </div>
  <div id="dsErr"></div>
</div>

<script>
// ─── Load font config from opener if available ──────────
(function applyFonts() {
  try {
    if (window.opener) {
      var cs = window.opener.document.documentElement.style;
      var r = document.documentElement.style;
      ['--font-desc','--font-legend','--font-table'].forEach(function(p) {
        var v = window.opener.getComputedStyle(window.opener.document.documentElement).getPropertyValue(p);
        if (v) r.setProperty(p, v);
      });
    }
  } catch(e) { /* cross-origin or closed */ }
})();

// ─── Constants ──────────────────────────────────────────
var SCOL = ["#D55E00","#56B4E9","#CC79A7","#009E73","#0072B2","#E69F00","#F0E442","#882255","#44AA99","#AA4499"];
var CCOL = {b:"#009E73", m:"#E69F00", h:"#D55E00", j:"#56B4E9"};
var CNAME = {b:"benign", m:"mild", h:"harmful", j:"jailbreak"};

// ─── State ──────────────────────────────────────────────
var D, TOKS, TCV, SUBJ, ANC, O, PROMPTS, LNAME;
var selCat = "all", sizeMode = "repl", hover = null, ancHover = null;
var fD, fL, fT, colW, pd, W, H, plotH, yMin, yMax, lvM, cnv, ctx, curPts = [];

// ─── Fetch Data ─────────────────────────────────────────
fetch("/api/modules/domain_surface/results")
  .then(function(r) { return r.json(); })
  .then(function(resp) {
    if (!resp.ok || !resp.results) throw new Error(resp.error || "No results");
    D = resp.results;
    init();
  })
  .catch(function(err) {
    document.getElementById("dsErr").textContent = "Failed to load: " + err.message;
  });

// ─── Init ───────────────────────────────────────────────
function init() {
  TOKS = D.tokens; TCV = D.token_cv; SUBJ = D.subjects;
  ANC = D.anchors; O = D.observations; PROMPTS = D.prompts || [];
  LNAME = D.level_names || ["nouns","phrase","question","instruct","meta"];

  // Read font sizes from CSS
  var cs = getComputedStyle(document.documentElement);
  fD = parseInt(cs.getPropertyValue('--font-desc')) || 13;
  fL = parseInt(cs.getPropertyValue('--font-legend')) || 12;
  fT = parseInt(cs.getPropertyValue('--font-table')) || 12;

  // Layout
  colW = Math.max(36, fT * 3);
  pd = {t: fT*4+10, r: fT*5, b: fT*4+10, l: fT*6};
  W = pd.l + TOKS.length * colW + pd.r;
  H = 640;
  plotH = H - pd.t - pd.b;

  // Y range
  var allY = O.map(function(o){return o[2]}).concat(ANC.map(function(a){return a.y}));
  yMin = Math.min.apply(null, allY); yMax = Math.max.apply(null, allY);
  var yPd = (yMax - yMin) * 0.08; yMin -= yPd; yMax += yPd;

  // Level means
  lvM = {};
  for (var l = 0; l < 5; l++) {
    var ys = ANC.filter(function(a){return a.l===l}).map(function(a){return a.y});
    if (ys.length) lvM[l] = {
      mean: ys.reduce(function(s,v){return s+v},0)/ys.length,
      mn: Math.min.apply(null, ys), mx: Math.max.apply(null, ys)
    };
  }

  // Canvas
  cnv = document.getElementById("dsCanvas");
  var dp = window.devicePixelRatio || 1;
  cnv.width = W * dp; cnv.height = H * dp;
  cnv.style.width = W + "px"; cnv.style.height = H + "px";
  ctx = cnv.getContext("2d"); ctx.scale(dp, dp);

  buildControls();
  cnv.addEventListener("mousemove", onMouse);
  cnv.addEventListener("mouseleave", function(){ hover=null; ancHover=null; render(); });
  render();
}

// ─── Controls ───────────────────────────────────────────
function buildControls() {
  var catRow = document.getElementById("catRow");
  var h = '<span style="color:var(--text2)">Cat:</span> ';
  h += catBtn("all", "all", "#E8ECEF");
  ["b","m","h","j"].forEach(function(c){ h += catBtn(c, CNAME[c], CCOL[c]); });
  h += '<span style="width:1px;height:14px;background:var(--border);margin:0 5px"></span>';
  h += '<span style="color:var(--text2)">Size:</span> ';
  [["disp","RD disp","#56B4E9"],["repl","RD repl","#CC79A7"],["asm","ASM","#E69F00"],
   ["sfd_e","SFD eng","#009E73"],["sfd_d","SFD den","#F0E442"],["anch","subj prox","#888"]
  ].forEach(function(s){ h += sizeBtn(s[0], s[1], s[2]); });
  catRow.innerHTML = h;

  // Wire buttons
  catRow.querySelectorAll("[data-cat]").forEach(function(b) {
    b.addEventListener("click", function() {
      selCat = this.dataset.cat;
      catRow.querySelectorAll("[data-cat]").forEach(function(x){ x.style.opacity = "0.4"; });
      this.style.opacity = "1"; render();
    });
  });
  catRow.querySelectorAll("[data-size]").forEach(function(b) {
    b.addEventListener("click", function() {
      sizeMode = this.dataset.size;
      catRow.querySelectorAll("[data-size]").forEach(function(x){ x.style.opacity = "0.4"; x.style.borderColor = "#444"; });
      this.style.opacity = "1"; this.style.borderColor = this.dataset.col; render();
    });
  });

  // Subject legend
  var leg = document.getElementById("subjLegend");
  var lh = "";
  SUBJ.forEach(function(s, i) {
    lh += '<span><span class="swatch" style="background:'+SCOL[i%10]+'"></span>' +
          '<span style="color:'+SCOL[i%10]+'">'+s.replace(/_/g," ")+'</span></span>';
  });
  leg.innerHTML = lh;
}

function catBtn(key, label, col) {
  var active = key === "all";
  return '<button data-cat="'+key+'" class="btn-cat" style="opacity:'+(active?'1':'0.4')+
    ';border-color:'+(active?col:'#444')+';color:'+col+'">'+label+'</button>';
}
function sizeBtn(key, label, col) {
  var active = key === "repl";
  return '<button data-size="'+key+'" data-col="'+col+'" class="btn-size" style="opacity:'+(active?'1':'0.4')+
    ';border-color:'+(active?col:'#444')+';color:'+(active?col:'var(--text2)')+'">'+label+'</button>';
}

// ─── Coordinate transforms ──────────────────────────────
function toY(v) { return pd.t + (1 - (v - yMin)/(yMax - yMin)) * plotH; }
function toX(i) { return pd.l + i * colW + colW/2; }

// ─── Filtering + sizing ─────────────────────────────────
function getFiltered() {
  return selCat === "all" ? O : O.filter(function(o){ return o[1] === selCat; });
}
function getPts(filtered) {
  return filtered.map(function(o) {
    var ti = TOKS.indexOf(o[0]); if (ti < 0) return null;
    var r;
    if (sizeMode==="disp") r = Math.max(2, Math.min(9, o[3]*5));
    else if (sizeMode==="repl") r = Math.max(2, Math.min(9, o[4]*11));
    else if (sizeMode==="asm") r = Math.max(2, Math.min(9, (o[6]-1.6)/2.5*9));
    else if (sizeMode==="sfd_e") r = Math.max(2, Math.min(9, (o[7]-0.2)/1.5*9));
    else if (sizeMode==="sfd_d") r = Math.max(2, Math.min(9, (o[8]-0.3)/0.2*9));
    else r = Math.max(2, Math.min(9, (1 - Math.min(o[11]/0.15, 1))*9));
    return {o:o, sx:toX(ti), sy:toY(o[2]), r:r};
  }).filter(Boolean);
}

// ─── Render ─────────────────────────────────────────────
function render() {
  var filtered = getFiltered(), pts = getPts(filtered);
  curPts = pts;
  ctx.clearRect(0, 0, W, H);

  // Column backgrounds
  TOKS.forEach(function(_, i) {
    ctx.fillStyle = i%2===0 ? "#22272E" : "#262C34";
    ctx.fillRect(pd.l + i*colW, pd.t, colW, plotH);
  });

  // Grid
  ctx.strokeStyle = "#2D333B"; ctx.lineWidth = 1;
  for (var i = 0; i <= 8; i++) {
    var y = pd.t + (i/8)*plotH;
    ctx.beginPath(); ctx.moveTo(pd.l, y); ctx.lineTo(W-pd.r, y); ctx.stroke();
  }

  // Y-axis labels
  ctx.fillStyle = "#6B7280"; ctx.font = fL+"px monospace";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (var i = 0; i <= 8; i++) {
    var v = yMin + (1-i/8)*(yMax-yMin);
    ctx.fillText(v.toFixed(2), pd.l-6, pd.t + (i/8)*plotH);
  }

  // Level bands + labels
  for (var l = 0; l < 5; l++) {
    var lv = lvM[l]; if (!lv) continue;
    var y1 = toY(lv.mx+0.02), y2 = toY(lv.mn-0.02);
    ctx.fillStyle = "rgba(255,255,255,0.02)";
    ctx.fillRect(pd.l, y1, W-pd.l-pd.r, y2-y1);
    ctx.fillStyle = "#8B92A0"; ctx.font = "bold "+fL+"px monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(LNAME[l]||l, W-pd.r+4, toY(lv.mean));
  }

  // Anchor ticks
  ANC.forEach(function(a) {
    var y = toY(a.y), col = SCOL[a.s]||"#666", len = 3+a.l*2;
    ctx.beginPath(); ctx.moveTo(pd.l-len, y); ctx.lineTo(pd.l, y);
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
  });

  // Anchor hover guide
  if (ancHover) {
    var y = toY(ancHover.y), len = 3+ancHover.l*2;
    ctx.beginPath(); ctx.moveTo(pd.l, y); ctx.lineTo(W-pd.r, y);
    ctx.strokeStyle = (SCOL[ancHover.s]||"#666")+"44";
    ctx.lineWidth = 1; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(pd.l-len-4, y); ctx.lineTo(pd.l, y);
    ctx.strokeStyle = SCOL[ancHover.s]||"#fff"; ctx.lineWidth = 3; ctx.stroke();
  }

  // Token headers
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  TOKS.forEach(function(t, i) {
    var x = toX(i), cv = TCV[t]||0;
    ctx.fillStyle = cv<0.35 ? "#009E73" : cv<0.6 ? "#E69F00" : "#D55E00";
    ctx.font = "bold "+fT+"px monospace";
    ctx.fillText(t, x, pd.t - fT*3);
    ctx.fillStyle = "#555"; ctx.font = fL+"px monospace";
    ctx.fillText(cv.toFixed(2), x, pd.t - fL - 2);
  });

  // Token counts
  TOKS.forEach(function(t, i) {
    var n = filtered.filter(function(o){ return o[0]===t; }).length;
    ctx.fillStyle = "#6B7280"; ctx.font = fL+"px monospace";
    ctx.fillText("n="+n, toX(i), H-pd.b+4);
  });
  ctx.fillStyle = "#555"; ctx.font = fL+"px monospace";
  ctx.textAlign = "left"; ctx.fillText("stable", pd.l, H-pd.b+fL+6);
  ctx.textAlign = "right"; ctx.fillText("volatile", W-pd.r, H-pd.b+fL+6);

  // Y-axis title
  ctx.save(); ctx.translate(fL-2, pd.t+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle = "#6B7280"; ctx.font = fL+"px monospace"; ctx.textAlign = "center";
  ctx.fillText("PC2 (domain + discourse)", 0, 0); ctx.restore();

  // Observations
  pts.forEach(function(p) {
    var col = CCOL[p.o[1]];
    ctx.beginPath(); ctx.arc(p.sx, p.sy, p.r, 0, Math.PI*2);
    ctx.fillStyle = col+"55"; ctx.fill();
    if (sizeMode==="anch") { ctx.strokeStyle = SCOL[p.o[13]]||"#666"; ctx.lineWidth = 1.2; }
    else { ctx.strokeStyle = col+"AA"; ctx.lineWidth = 0.6; }
    ctx.stroke();
  });

  // Hover ring
  if (hover) {
    ctx.beginPath(); ctx.arc(hover.sx, hover.sy, hover.r+4, 0, Math.PI*2);
    ctx.strokeStyle = "#E8ECEF"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Tooltip
  updateTooltip(filtered);

  // Subtitle
  var sml = {disp:"RD displacement", repl:"RD replacement", asm:"ASM stress",
             sfd_e:"SFD energy", sfd_d:"SFD density", anch:"subject proximity"};
  document.getElementById("dsSubtitle").textContent =
    SUBJ.length+" subjects, "+ANC.length+" anchors, "+filtered.length+" obs. Size = "+(sml[sizeMode]||sizeMode)+".";
}

// ─── Tooltip ────────────────────────────────────────────
function esc(s) { return String(s).replace(/</g, "&lt;"); }

function updateTooltip(filtered) {
  var tip = document.getElementById("dsTip");
  if (hover) {
    var o = hover.o, ns = (SUBJ[o[13]]||"").replace(/_/g, " ");
    tip.innerHTML =
      '<div style="font-weight:700;color:'+CCOL[o[1]]+'">'+CNAME[o[1]]+': \u201c'+esc(o[0])+'\u201d '+
      '<span style="color:#6B7280;font-weight:400">pos '+o[10]+'</span></div>'+
      '<div style="color:#B8BFC6;line-height:1.6;margin-top:3px">'+
      '<span style="color:#56B4E9">RD</span> disp '+o[3].toFixed(3)+' repl '+o[4].toFixed(2)+
      '<br><span style="color:#E69F00">ASM</span> '+o[6].toFixed(2)+
      ' <span style="color:#009E73">SFD</span> e='+o[7].toFixed(3)+' d='+o[8].toFixed(3)+'</div>'+
      '<div style="color:#B8BFC6;margin-top:4px;border-top:1px solid #444;padding-top:4px">'+
      '<span style="color:#6B7280">nearest:</span> '+
      '<span style="color:'+(SCOL[o[13]]||"#888")+'">'+esc(ns)+'</span> '+
      '<span style="color:#999">'+(LNAME[o[12]]||"")+'</span> d='+o[11].toFixed(3)+'</div>'+
      '<div style="color:#888;margin-top:4px;line-height:1.4">'+esc(PROMPTS[o[9]]||"")+'</div>';
    tip.style.left = (hover.sx > W*0.5 ? hover.sx-320 : hover.sx+14)+"px";
    tip.style.top = Math.max(4, hover.sy-100)+"px";
    tip.style.display = "block"; tip.style.borderColor = CCOL[o[1]];
  } else if (ancHover) {
    var a = ancHover, col = SCOL[a.s]||"#888";
    tip.innerHTML =
      '<div style="font-weight:700;color:'+col+'">'+ esc((SUBJ[a.s]||"").replace(/_/g," "))+
      ' <span style="color:#B8BFC6">'+(LNAME[a.l]||"")+'</span></div>'+
      '<div style="color:#888;margin-top:4px">'+esc(a.t)+'</div>'+
      '<div style="color:#6B7280;margin-top:3px">PC2 = '+a.y.toFixed(4)+'</div>';
    tip.style.left = (pd.l+8)+"px";
    tip.style.top = Math.max(4, Math.min(toY(a.y)-40, H-80))+"px";
    tip.style.display = "block"; tip.style.borderColor = col;
  } else {
    tip.style.display = "none";
  }
}

// ─── Mouse ──────────────────────────────────────────────
function onMouse(e) {
  var rect = cnv.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (W / rect.width);
  var my = (e.clientY - rect.top) * (H / rect.height);

  // Anchor hover on left margin
  if (mx < pd.l + 10) {
    var ba = null, bad = 12;
    ANC.forEach(function(a) {
      var ay = toY(a.y), d = Math.abs(my - ay);
      if (d < bad) { bad = d; ba = a; }
    });
    if (ba) { ancHover = ba; hover = null; render(); return; }
  }
  ancHover = null;

  // Observation hover
  var b = null, bd = 14;
  curPts.forEach(function(p) {
    var d = Math.sqrt((mx-p.sx)*(mx-p.sx) + (my-p.sy)*(my-p.sy));
    if (d < bd) { bd = d; b = p; }
  });
  hover = b;
  render();
}
</script>
</body>
</html>
