<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASM Chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0:#121212;--bg-1:#1E1E1E;--bg-2:#252525;--bg-3:#2d2d2d;
  --border:#333333;--text-0:#DEE2E6;--text-1:#9CA3AF;--text-2:#6B7280;--text-3:#4B5563;
  --blue:#58a6ff;--green:#009E73;--orange:#E69F00;--red:#D55E00;--purple:#CC79A7;--cyan:#56B4E9;
  --cat-benign:#0072B2;--cat-mild:#E69F00;--cat-harmful:#D55E00;--cat-jailbreak:#CC79A7;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-0);color:var(--text-0);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:500;color:var(--text-0)}
header a{color:var(--text-2);font-size:12px;text-decoration:none}
header a:hover{color:var(--text-0)}
.controls{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:12px;color:var(--text-1)}
.controls label{display:flex;align-items:center;gap:4px;cursor:pointer}
.controls input[type=checkbox]{accent-color:var(--cyan)}
.main{flex:1;display:flex;overflow:hidden}
.chat-col{flex:1;display:flex;flex-direction:column;min-width:0}
.analysis-col{width:340px;border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:none;padding:12px;font-family:var(--mono);font-size:11px;color:var(--text-1)}
.analysis-col.visible{display:block}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:8px;line-height:1.5;font-size:14px;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--bg-3);color:var(--text-0);border:1px solid var(--border)}
.msg.assistant{align-self:flex-start;background:var(--bg-2);color:var(--text-0)}
.msg.error{align-self:center;color:var(--red);font-size:12px}
.msg.system{align-self:center;color:var(--text-2);font-size:12px;font-style:italic}
.input-row{padding:12px 16px;background:var(--bg-1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.input-row textarea{flex:1;background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--sans);font-size:14px;resize:none;min-height:44px;max-height:120px;outline:none}
.input-row textarea:focus{border-color:var(--cyan)}
.input-row button{background:var(--bg-3);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:8px 16px;cursor:pointer;font-family:var(--sans);font-size:13px;white-space:nowrap}
.input-row button:hover{background:var(--border)}
.input-row button:disabled{opacity:0.4;cursor:not-allowed}
.reading{margin-bottom:10px;padding:8px;background:var(--bg-1);border-radius:4px;border-left:2px solid var(--border)}
.reading-label{color:var(--text-2);font-size:10px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.reading-val{color:var(--text-0)}
.reading-row{display:flex;justify-content:space-between;padding:2px 0}
.cls-row{display:flex;justify-content:space-between;padding:1px 0}
.cls-pred{font-size:10px}
.analysis-header{font-size:12px;color:var(--text-0);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.analysis-prompt{font-size:11px;color:var(--text-2);margin-bottom:8px;font-style:italic;word-break:break-word}
</style>
</head>
<body>
<header>
  <h1>TASM Chat</h1>
  <a href="/">← Back to Analyzer</a>
  <div class="controls">
    <label><input type="checkbox" id="chkAnalyze" checked> Analyze prompts</label>
    <label><input type="checkbox" id="chkLTP" checked> LTP</label>
    <label><input type="checkbox" id="chkSFD" checked> SFD</label>
    <button onclick="clearChat()" style="background:none;border:1px solid var(--border);color:var(--text-2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px">Clear</button>
  </div>
</header>
<div class="main">
  <div class="chat-col">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>
  <div class="analysis-col" id="analysisCol">
    <div id="analysisContent"><div style="color:var(--text-3)">Send a message with analysis enabled to see readings here.</div></div>
  </div>
</div>
<script>
const messages=[];
let busy=false;

function $(id){return document.getElementById(id)}

function addMsg(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  $('messages').appendChild(d);
  $('messages').scrollTop=$('messages').scrollHeight;
  return d;
}

function updateAnalysisCol(){
  const on=$('chkAnalyze').checked;
  $('analysisCol').classList.toggle('visible',on);
}
$('chkAnalyze').addEventListener('change',updateAnalysisCol);
updateAnalysisCol();

function renderAnalysis(analysis,prompt){
  if(!analysis){$('analysisContent').innerHTML='<div style="color:var(--text-3)">No analysis data.</div>';return}
  let h='';
  h+=`<div class="analysis-header">Prompt Analysis</div>`;
  h+=`<div class="analysis-prompt">"${prompt.substring(0,120)}${prompt.length>120?'...':''}"</div>`;

  // ASM readings
  h+=`<div class="reading"><div class="reading-label">ASM</div>`;
  const asm=[['Stress',analysis.stress_score,'f3'],['Net Corr',analysis.net_correction,'f5'],
    ['Entropy',analysis.entropy,'f4'],['Int%',analysis.middle_share,'pct'],
    ['IntCV',analysis.interior_cv,'f4'],['KL',analysis.kl_divergence,'f4']];
  for(const[label,val,fmt]of asm){
    const fv=val==null?'--':fmt==='pct'?(val*100).toFixed(1)+'%':fmt==='f3'?val.toFixed(3):fmt==='f4'?val.toFixed(4):fmt==='f5'?val.toFixed(5):val;
    h+=`<div class="reading-row"><span>${label}</span><span class="reading-val">${fv}</span></div>`;
  }
  h+=`</div>`;

  // LTP readings
  if(analysis.ltp){
    h+=`<div class="reading" style="border-color:var(--cyan)"><div class="reading-label" style="color:var(--cyan)">LTP</div>`;
    for(const k of['mean_M','mean_C','mean_V','mean_L']){
      const v=analysis.ltp[k];
      h+=`<div class="reading-row"><span>${k}</span><span class="reading-val">${v!=null?v.toFixed(6):'--'}</span></div>`;
    }
    h+=`</div>`;
  }

  // Rank displacement
  if(analysis.rank_displacement){
    const rd=analysis.rank_displacement;
    h+=`<div class="reading" style="border-color:var(--orange)"><div class="reading-label" style="color:var(--orange)">Rank Displacement</div>`;
    h+=`<div class="reading-row"><span>Tau</span><span class="reading-val">${rd.mean_tau!=null?rd.mean_tau.toFixed(3):'--'}</span></div>`;
    h+=`<div class="reading-row"><span>Overlap</span><span class="reading-val">${rd.mean_overlap!=null?(rd.mean_overlap*100).toFixed(1)+'%':'--'}</span></div>`;
    h+=`</div>`;
  }

  // SFD readings
  if(analysis.sfd){
    const s=analysis.sfd;
    h+=`<div class="reading" style="border-color:var(--orange)"><div class="reading-label" style="color:var(--orange)">SFD</div>`;
    for(const[label,key]of[['Density','density_mean'],['Entropy','entropy_mean'],['Energy','energy_mean']]){
      const v=s[key];
      h+=`<div class="reading-row"><span>${label}</span><span class="reading-val">${v!=null?v.toFixed(4):'--'}</span></div>`;
    }
    h+=`</div>`;
  }

  // Classifier predictions
  if(analysis.classifiers&&Object.keys(analysis.classifiers).length){
    h+=`<div class="reading"><div class="reading-label">Classifiers</div>`;
    for(const[cid,cl]of Object.entries(analysis.classifiers)){
      h+=`<div class="cls-row"><span>${cid}</span><span class="cls-pred reading-val">${cl.predicted} ${Math.round(cl.confidence*100)}%</span></div>`;
    }
    h+=`</div>`;
  }

  $('analysisContent').innerHTML=h;
}

async function send(){
  if(busy)return;
  const input=$('input');
  const text=input.value.trim();
  if(!text)return;

  input.value='';
  input.style.height='44px';
  messages.push({role:'user',content:text});
  addMsg('user',text);

  const doAnalyze=$('chkAnalyze').checked;
  busy=true;
  $('sendBtn').disabled=true;

  const thinking=addMsg('system','...');

  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:messages,
        max_tokens:256,
        analyze:doAnalyze,
        compute_ltp:$('chkLTP').checked,
        compute_sfd:$('chkSFD').checked,
      })
    });
    const data=await resp.json();
    thinking.remove();

    if(data.ok){
      messages.push({role:'assistant',content:data.response});
      addMsg('assistant',data.response);
      if(doAnalyze&&data.analysis){
        renderAnalysis(data.analysis,text);
      }
    } else {
      addMsg('error',data.error||'Unknown error');
    }
  }catch(e){
    thinking.remove();
    addMsg('error','Network error: '+e.message);
  }
  busy=false;
  $('sendBtn').disabled=false;
  input.focus();
}

function clearChat(){
  messages.length=0;
  $('messages').innerHTML='';
  $('analysisContent').innerHTML='<div style="color:var(--text-3)">Send a message with analysis enabled to see readings here.</div>';
}

// Auto-resize textarea
$('input').addEventListener('input',function(){
  this.style.height='44px';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
</script>
</body>
</html>
