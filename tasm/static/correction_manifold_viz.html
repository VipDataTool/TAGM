<!DOCTYPE html>
<html>
<head>
<title>Correction Manifold — TASM</title>
<style>
:root { --bg:#0c1017; --text:#e0e6ed; --text2:#a0aab4; --border:#252b33; }
body { background:var(--bg); color:var(--text); font-family:"Courier New",monospace; padding:16px; margin:0; }
button { font-family:inherit; font-size:11px; padding:2px 9px; border-radius:3px; cursor:pointer; }
.ctrl { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
.cat-btn { transition:all .15s; }
#tip { display:none; position:absolute; background:#151a22f0; border:1px solid #303840; border-radius:5px; padding:10px 14px; pointer-events:none; max-width:420px; font-size:11px; line-height:1.6; z-index:10; }
#err { color:#ef4444; font-size:12px; padding:10px; }
</style>
</head>
<body>
<div style="max-width:940px;margin:0 auto">
  <h2 style="margin:0 0 4px;font-size:16px;font-weight:700;color:#f0f4f8;letter-spacing:.4px" id="title">Correction Manifold</h2>
  <p style="margin:0 0 10px;font-size:11px;color:#a0aab4" id="subtitle">Loading...</p>
  <div class="ctrl" id="catRow"></div>
  <div class="ctrl" id="legRow"></div>
  <div style="position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    <canvas id="cvs" style="width:100%;height:auto;cursor:grab;display:block"></canvas>
    <div id="tip"></div>
  </div>
  <div style="font-size:10px;color:#808890;margin-top:8px;text-align:center" id="footer">
    RD (center) = radial displacement. ASM / IntCV / SFD_d at 120° = angular pull. Scroll to zoom, drag to pan.
  </div>
  <div id="err"></div>
</div>
<script>
(function(){try{

var CAT={b:{l:"benign",c:"#0072B2"},m:{l:"mild",c:"#E69F00"},d:{l:"dual-use",c:"#009E73"},h:{l:"harmful",c:"#D55E00"},a:{l:"adversarial",c:"#882255"},j:{l:"jailbreak",c:"#CC79A7"}};
var W=900,H=900;
var cats={b:1,m:1,d:1,h:1,a:1,j:1};
var DATA=null;

// ─── Zoom / Pan state ───
var zoom=1, panX=0, panY=0;
var dragging=false, dragSX=0, dragSY=0, dragPX=0, dragPY=0;

fetch("/api/modules/correction_manifold/results").then(function(r){return r.json()}).then(function(resp){
  if(!resp.ok||!resp.results){document.getElementById("err").textContent="No results: "+(resp.error||"run the module first");return}
  DATA=resp.results;
  init();
}).catch(function(e){document.getElementById("err").textContent="Fetch error: "+e.message});

function init(){
  var sub=document.getElementById("subtitle");
  var cls=DATA.classification||{};
  var binAcc=cls.binary?cls.binary.best_accuracy:0;
  var nRings=(DATA.rings||[]).length;
  var nSubj=(DATA.subj_short||[]).length;
  sub.textContent=DATA.n_prompts+" prompts · "+nRings+" rings · "+nSubj+" subjects · binary "+(binAcc*100).toFixed(1)+"%";

  // Category toggle buttons
  var cr=document.getElementById("catRow");
  var h="";
  for(var k in CAT){
    var sty=cats[k]?"border:1px solid "+CAT[k].c+";background:"+CAT[k].c+"20;color:"+CAT[k].c
                    :"border:1px solid #30363d;background:transparent;color:#606870";
    h+='<button class="cat-btn" data-cat="'+k+'" style="'+sty+'">'+CAT[k].l+'</button>';
  }
  h+='<span style="color:#30363d">|</span>';
  h+='<button style="border:1px solid #404850;color:#a0aab4;background:transparent" id="resetBtn">Reset view</button>';
  cr.innerHTML=h;

  cr.addEventListener("click",function(e){
    var btn=e.target.closest("button[data-cat]");
    if(btn){
      var c=btn.dataset.cat;
      cats[c]=cats[c]?0:1;
      btn.style.borderColor=cats[c]?CAT[c].c:"#30363d";
      btn.style.background=cats[c]?CAT[c].c+"20":"transparent";
      btn.style.color=cats[c]?CAT[c].c:"#606870";
      draw();
    }
  });
  document.getElementById("resetBtn").addEventListener("click",function(){zoom=1;panX=0;panY=0;draw()});

  // Legend
  var lr=document.getElementById("legRow");
  var rays=DATA.corner_rays||[];
  var cs=DATA.center_signal;
  var lh="";
  if(cs) lh+='<span style="font-size:10px;display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:50%;background:'+cs.color+';display:inline-block"></span><span style="color:#a0aab4">'+cs.name+' (radial)</span></span>';
  for(var i=0;i<rays.length;i++){
    lh+='<span style="font-size:10px;display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:'+rays[i].color+';display:inline-block"></span><span style="color:#a0aab4">'+rays[i].name+' (angular)</span></span>';
  }
  lr.innerHTML=lh;

  // Zoom/pan events
  var cvs=document.getElementById("cvs");
  cvs.addEventListener("wheel",function(e){
    e.preventDefault();
    var rect=cvs.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(W/rect.width);
    var my=(e.clientY-rect.top)*(H/rect.height);
    var factor=e.deltaY<0?1.12:1/1.12;
    var nz=Math.max(0.4,Math.min(12,zoom*factor));
    panX=mx-(mx-panX)*(nz/zoom);
    panY=my-(my-panY)*(nz/zoom);
    zoom=nz;
    draw();
  },{passive:false});
  cvs.addEventListener("mousedown",function(e){
    dragging=true;dragSX=e.clientX;dragSY=e.clientY;dragPX=panX;dragPY=panY;
    cvs.style.cursor="grabbing";
  });
  window.addEventListener("mousemove",function(e){
    if(!dragging) return;
    var rect=cvs.getBoundingClientRect();
    panX=dragPX+(e.clientX-dragSX)*(W/rect.width);
    panY=dragPY+(e.clientY-dragSY)*(H/rect.height);
    draw();
  });
  window.addEventListener("mouseup",function(){dragging=false;document.getElementById("cvs").style.cursor="grab"});
  cvs.addEventListener("mousemove",onMove);
  cvs.addEventListener("mouseleave",function(){document.getElementById("tip").style.display="none"});

  draw();
}

// ─── Coordinate transform (manifold → canvas) ───
function tx(v){return W/2+v*390*zoom+panX}
function ty(v){return H/2+v*390*zoom+panY}
function R(){return 390*zoom}

function draw(){
  var c=document.getElementById("cvs");
  var dpr=devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+"px";c.style.height=H+"px";
  var g=c.getContext("2d");g.scale(dpr,dpr);
  g.fillStyle="#0c1017";g.fillRect(0,0,W,H);

  var ox=tx(0),oy=ty(0),r=R();
  var rings=DATA.rings||[];
  var sa=DATA.subj_angles||[];
  var ss=DATA.subj_short||[];
  var outerR=rings.length?rings[rings.length-1].outer:0.92;
  var innerR=rings.length?rings[0].inner:0.10;
  var fontSize=Math.max(7,Math.min(13,10*zoom));

  // ── Ring bands ──
  for(var ri=0;ri<rings.length;ri++){
    var ring=rings[ri];
    g.beginPath();g.arc(ox,oy,ring.outer*r,0,Math.PI*2);
    g.arc(ox,oy,ring.inner*r,0,Math.PI*2,true);
    g.fillStyle="rgba(255,255,255,"+(0.015+ri*0.006)+")";g.fill();
    g.strokeStyle="#ffffff10";g.lineWidth=0.5;
    g.beginPath();g.arc(ox,oy,ring.inner*r,0,Math.PI*2);g.stroke();
    g.beginPath();g.arc(ox,oy,ring.outer*r,0,Math.PI*2);g.stroke();
  }

  // ── Ring labels (rotated vertically, left side) ──
  g.font="600 "+fontSize+"px monospace";
  g.textAlign="center";g.textBaseline="middle";
  for(var ri=0;ri<rings.length;ri++){
    var ring=rings[ri];
    var mid=(ring.inner+ring.outer)/2;
    g.save();
    g.translate(ox-mid*r, oy);
    g.rotate(-Math.PI/2);
    g.fillStyle="#ffffff50";
    g.fillText(ring.label,0,0);
    g.restore();
  }

  // ── Subject centerlines from vertex ──
  for(var si=0;si<sa.length;si++){
    var a=sa[si];
    var ca=Math.cos(a), sn=Math.sin(a);
    // Line from center to outer edge
    g.strokeStyle="#ffffff14";g.lineWidth=0.7;g.setLineDash([]);
    g.beginPath();
    g.moveTo(ox,oy);
    g.lineTo(ox+ca*(outerR+0.02)*r, oy-sn*(outerR+0.02)*r);
    g.stroke();
    // Subject label (rotated along radial)
    var lr=(outerR+0.06)*r;
    var lx=ox+ca*lr, ly=oy-sn*lr;
    g.fillStyle="#ffffffb0";
    g.font="600 "+fontSize+"px monospace";
    g.save();g.translate(lx,ly);
    var ta=-a+Math.PI/2;
    if(a>Math.PI/2||a<-Math.PI/2) ta+=Math.PI;
    g.rotate(ta);g.textAlign="center";g.textBaseline="middle";
    g.fillText(ss[si]||"",0,0);
    g.restore();
  }

  // ── 3 attractor rays from center (half-lines, not through-lines) ──
  var rays=DATA.corner_rays||[];
  g.setLineDash([4,4]);
  for(var i=0;i<rays.length;i++){
    var a=rays[i].angle*Math.PI/180;
    var ca=Math.cos(a),sn=Math.sin(a);
    var rLen=(outerR+0.02)*r;
    g.strokeStyle=rays[i].color+"30";g.lineWidth=1.5;
    g.beginPath();
    g.moveTo(ox,oy);
    g.lineTo(ox+ca*rLen, oy-sn*rLen);
    g.stroke();
    // Label beyond outer ring
    var llr=(outerR+0.12)*r;
    g.fillStyle=rays[i].color+"cc";g.font="700 "+Math.max(10,12*zoom)+"px monospace";
    g.textAlign="center";g.textBaseline="middle";
    g.fillText(rays[i].name, ox+ca*llr, oy-sn*llr);
  }
  g.setLineDash([]);

  // ── RD indicator at center ──
  var cs=DATA.center_signal;
  if(cs){
    g.beginPath();g.arc(ox,oy,Math.max(3,5*zoom),0,Math.PI*2);
    g.fillStyle=cs.color+"30";g.fill();
    g.strokeStyle=cs.color+"70";g.lineWidth=1;g.stroke();
    g.fillStyle=cs.color+"90";g.font="700 "+Math.max(9,11*zoom)+"px monospace";
    g.textAlign="center";g.textBaseline="middle";
    g.fillText(cs.name, ox, oy-Math.max(10,14*zoom));
  }

  // ── Prompt dots ──
  var ps=DATA.prompts||[];
  var dotR=Math.max(2.5,4*Math.sqrt(zoom));
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(!cats[p[1]]) continue;
    var px=tx(p[2]),py=ty(p[3]);
    // Skip if off-screen
    if(px<-20||px>W+20||py<-20||py>H+20) continue;
    g.beginPath();g.arc(px,py,dotR,0,Math.PI*2);
    var ci=CAT[p[1]];
    g.fillStyle=ci?ci.c:"#888";
    g.globalAlpha=0.85;
    g.fill();g.globalAlpha=1;
  }
}

function onMove(e){
  if(dragging) return;
  var cvs=document.getElementById("cvs");
  var rect=cvs.getBoundingClientRect();
  var mx=(e.clientX-rect.left)*(W/rect.width);
  var my=(e.clientY-rect.top)*(H/rect.height);

  var best=null,bd=15;
  var ps=DATA.prompts||[];
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(!cats[p[1]]) continue;
    var dx=tx(p[2])-mx, dy=ty(p[3])-my, d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=p}
  }

  var tip=document.getElementById("tip");
  if(!best){tip.style.display="none";return}

  var fnames=DATA.all_signal_keys||[];
  var ci=CAT[best[1]]||{l:"?",c:"#888"};
  var h='<div style="margin-bottom:4px">';
  h+='<span style="color:'+ci.c+';font-weight:700">'+ci.l+'</span> ';
  h+='<span style="color:#f0f4f8;font-weight:600">'+(DATA.subj_short[best[4]]||"")+'</span>';
  h+=' <span style="color:#a0aab4">ring '+best[5]+'</span></div>';
  h+='<div style="color:#a0aab4;font-size:10px;margin-bottom:6px;word-break:break-word">'+best[0]+'</div>';
  h+='<div style="color:#808890;font-size:10px;border-top:1px solid #252b33;padding-top:4px">';
  h+='<span style="color:#a78bfa">RD='+best[8].toFixed(2)+'</span> (radial) &nbsp;';
  h+='<span style="color:#ef4444">ASM='+best[6].toFixed(2)+'</span> ';
  h+='<span style="color:#22d3ee">IntCV='+best[7].toFixed(2)+'</span> ';
  h+='<span style="color:#4ade80">SFD_d='+best[9].toFixed(2)+'</span></div>';
  if(fnames.length){
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:10px;margin-top:4px">';
    for(var i=0;i<fnames.length&&i<8;i++){
      h+='<span style="color:#a0aab4">'+fnames[i]+': <b style="color:#f0f4f8">'+best[11+i].toFixed(4)+'</b></span>';
    }
    h+='</div>';
  }

  tip.innerHTML=h;
  tip.style.display="block";
  tip.style.left="16px";tip.style.top="16px";
}

}catch(e){document.getElementById("err").textContent="Error: "+e.message+"\n"+e.stack}})();
</script>
</body>
</html>
