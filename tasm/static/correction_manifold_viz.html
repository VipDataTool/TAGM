<!DOCTYPE html>
<html>
<head>
<title>Correction Manifold — TASM</title>
<style>
:root { --bg:#0c1017; --text:#e0e6ed; --text2:#a0aab4; --border:#252b33; }
body { background:var(--bg); color:var(--text); font-family:"Courier New",monospace; padding:16px; margin:0; }
button { font-family:inherit; font-size:11px; padding:2px 9px; border-radius:3px; cursor:pointer; }
.ctrl { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
#tip { display:none; position:absolute; background:#151a22f0; border:1px solid #303840; border-radius:5px; padding:10px 14px; pointer-events:none; max-width:420px; font-size:11px; line-height:1.6; z-index:10; }
#err { color:#ef4444; font-size:12px; padding:10px; }
</style>
</head>
<body>
<div style="max-width:940px;margin:0 auto">
  <h2 style="margin:0 0 4px;font-size:16px;font-weight:700;color:#f0f4f8;letter-spacing:.4px" id="title">6D Correction Manifold</h2>
  <p style="margin:0 0 10px;font-size:11px;color:#a0aab4" id="subtitle">Loading...</p>
  <div class="ctrl" id="catRow"></div>
  <div class="ctrl" id="legRow"></div>
  <div style="position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    <canvas id="cvs" style="width:100%;height:auto;cursor:crosshair;display:block"></canvas>
    <div id="tip"></div>
  </div>
  <div style="font-size:10px;color:#808890;margin-top:8px;text-align:center" id="footer"></div>
  <div id="err"></div>
</div>
<script>
(function(){try{

var CAT={b:{l:"benign",c:"#0072B2"},m:{l:"mild",c:"#E69F00"},d:{l:"dual-use",c:"#009E73"},h:{l:"harmful",c:"#D55E00"},a:{l:"adversarial",c:"#882255"},j:{l:"jailbreak",c:"#CC79A7"}};
var W=900,H=900,CX=W/2,CY=H/2,R=390;
var cats={b:1,m:1,d:1,h:1,a:1,j:1};
var showCat=false;
var DATA=null;

fetch("/api/modules/correction_manifold/results").then(function(r){return r.json()}).then(function(resp){
  if(!resp.ok||!resp.results){document.getElementById("err").textContent="No results: "+(resp.error||"run the module first");return}
  DATA=resp.results;
  init();
}).catch(function(e){document.getElementById("err").textContent="Fetch error: "+e.message});

function init(){
  var sub=document.getElementById("subtitle");
  var cls=DATA.classification||{};
  var binAcc=cls.binary?cls.binary.best_accuracy:0;
  sub.textContent=DATA.n_prompts+" prompts. Binary accuracy: "+(binAcc*100).toFixed(1)+"%. "+
    "Attractor power: "+DATA.attractor_power+". 6 intrinsic dimensions.";

  // Category buttons
  var cr=document.getElementById("catRow");
  var h="";
  for(var k in CAT){
    h+='<button data-cat="'+k+'" style="border:1px solid '+CAT[k].c+';background:'+CAT[k].c+'20;color:'+CAT[k].c+'">'+CAT[k].l+'</button>';
  }
  h+='<span style="color:#30363d">|</span>';
  h+='<label style="font-size:11px;color:#a0aab4;cursor:pointer;display:flex;align-items:center;gap:4px"><input type="checkbox" id="cbCat" style="accent-color:#58a6ff"> Category colors</label>';
  cr.innerHTML=h;

  cr.addEventListener("click",function(e){
    var btn=e.target.closest("button[data-cat]");
    if(btn){
      var c=btn.dataset.cat;
      cats[c]=cats[c]?0:1;
      btn.style.background=cats[c]?CAT[c].c+"20":"transparent";
      btn.style.color=cats[c]?CAT[c].c:"#606870";
      btn.style.borderColor=cats[c]?CAT[c].c:"#30363d";
      draw();
    }
  });
  document.getElementById("cbCat").addEventListener("change",function(e){showCat=e.target.checked;draw()});

  // Legend
  var lr=document.getElementById("legRow");
  var rays=DATA.corner_rays||[];
  var lh="";
  for(var i=0;i<rays.length;i++){
    lh+='<span style="font-size:10px;display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:'+rays[i].color+';display:inline-block"></span><span style="color:#a0aab4">'+rays[i].name+'</span></span>';
  }
  lr.innerHTML=lh;

  // Footer
  document.getElementById("footer").textContent=
    "Corner attractors: outer-right=ASM, outer-left=IntCV, inner-right=RD_repl, inner-left=SFD_d";

  draw();

  var cvs=document.getElementById("cvs");
  cvs.addEventListener("mousemove",onMove);
  cvs.addEventListener("mouseleave",function(){document.getElementById("tip").style.display="none"});
}

function draw(){
  var c=document.getElementById("cvs");
  var dpr=devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+"px";c.style.height=H+"px";
  var g=c.getContext("2d");g.scale(dpr,dpr);
  g.fillStyle="#0c1017";g.fillRect(0,0,W,H);

  var toX=function(v){return CX+v*R};
  var toY=function(v){return CY+v*R};

  // Ring bands
  var rings=DATA.rings||[];
  for(var ri=0;ri<rings.length;ri++){
    var ring=rings[ri];
    g.beginPath();g.arc(CX,CY,ring.outer*R,0,Math.PI*2);
    g.arc(CX,CY,ring.inner*R,0,Math.PI*2,true);
    g.fillStyle=["#ffffff02","#ffffff03","#ffffff05","#ffffff06","#ffffff08"][ri]||"#ffffff05";g.fill();
    g.beginPath();g.arc(CX,CY,ring.inner*R,0,Math.PI*2);
    g.strokeStyle="#ffffff10";g.lineWidth=.5;g.stroke();
    g.beginPath();g.arc(CX,CY,ring.outer*R,0,Math.PI*2);
    g.strokeStyle="#ffffff10";g.lineWidth=.5;g.stroke();
    g.fillStyle="#ffffff90";g.font="600 11px monospace";
    g.textAlign="right";g.textBaseline="middle";
    g.fillText(ring.label,CX-ring.inner*R-8,CY);
  }

  // Cell boundaries
  var cells=DATA.cells||[];
  for(var ci=0;ci<cells.length;ci++){
    var cc=cells[ci].corners;
    g.beginPath();
    g.moveTo(toX(cc[0][0]),toY(cc[0][1]));
    g.lineTo(toX(cc[1][0]),toY(cc[1][1]));
    g.lineTo(toX(cc[3][0]),toY(cc[3][1]));
    g.lineTo(toX(cc[2][0]),toY(cc[2][1]));
    g.closePath();
    g.strokeStyle="#ffffff0c";g.lineWidth=.5;g.stroke();
  }

  // Corner attractor rays
  var rays=DATA.corner_rays||[];
  for(var i=0;i<rays.length;i++){
    var a=rays[i].angle*Math.PI/180;
    var cos_a=Math.cos(a),sin_a=Math.sin(a);
    var rLen=(rings.length?rings[rings.length-1].outer:0.92)*R+6;
    g.strokeStyle=rays[i].color+"30";g.lineWidth=1.5;
    g.setLineDash([4,4]);
    g.beginPath();
    g.moveTo(CX-cos_a*rLen,CY+sin_a*rLen);
    g.lineTo(CX+cos_a*rLen,CY-sin_a*rLen);
    g.stroke();g.setLineDash([]);
    var lx=CX+cos_a*(rLen+14),ly=CY-sin_a*(rLen+14);
    g.fillStyle=rays[i].color+"cc";g.font="700 12px monospace";
    g.textAlign="center";g.textBaseline="middle";
    g.fillText(rays[i].name,lx,ly);
  }

  // Subject labels
  var sa=DATA.subj_angles||[];
  var ss=DATA.subj_short||[];
  g.font="600 10px monospace";
  for(var si=0;si<sa.length;si++){
    var a=sa[si];
    var cos_a=Math.cos(a),sin_a=Math.sin(a);
    var r1=(rings.length?rings[0].inner:0.18)*R-2;
    var r2=(rings.length?rings[rings.length-1].outer:0.92)*R+2;
    g.strokeStyle="#ffffff12";g.lineWidth=.5;
    g.beginPath();g.moveTo(CX+cos_a*r1,CY-sin_a*r1);g.lineTo(CX+cos_a*r2,CY-sin_a*r2);g.stroke();
    var lr2=(rings.length?rings[rings.length-1].outer:0.92)*R+22;
    var lx=CX+cos_a*lr2,ly=CY-sin_a*lr2;
    g.fillStyle="#ffffffb0";
    g.save();g.translate(lx,ly);
    var ta=-a+Math.PI/2;
    if(a>Math.PI/2||a<-Math.PI/2) ta+=Math.PI;
    g.rotate(ta);g.textAlign="center";g.textBaseline="middle";
    g.fillText(ss[si]||"",0,0);
    g.restore();
  }

  // Origin
  g.beginPath();g.arc(CX,CY,3,0,Math.PI*2);g.fillStyle="#ffffff20";g.fill();

  // Prompts
  var ps=DATA.prompts||[];
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(!cats[p[1]]) continue;
    var px=toX(p[2]),py=toY(p[3]);
    g.beginPath();g.arc(px,py,4,0,Math.PI*2);
    if(showCat){g.fillStyle=CAT[p[1]].c;g.globalAlpha=.8}
    else{g.fillStyle="#c8dce8";g.globalAlpha=.7}
    g.fill();g.globalAlpha=1;
  }
}

function onMove(e){
  var rect=document.getElementById("cvs").getBoundingClientRect();
  var mx=(e.clientX-rect.left)*(W/rect.width);
  var my=(e.clientY-rect.top)*(H/rect.height);
  var toX=function(v){return CX+v*R};
  var toY=function(v){return CY+v*R};

  var best=null,bd=15;
  var ps=DATA.prompts||[];
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(!cats[p[1]]) continue;
    var dx=toX(p[2])-mx,dy=toY(p[3])-my,d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=p}
  }

  var tip=document.getElementById("tip");
  if(!best){tip.style.display="none";return}

  var fnames=DATA.all_signal_keys||DATA.signal_keys||[];
  var h='<div style="margin-bottom:4px">';
  if(showCat) h+='<span style="color:'+CAT[best[1]].c+';font-weight:700">'+CAT[best[1]].l+'</span> ';
  h+='<span style="color:#f0f4f8;font-weight:600">'+(DATA.subj_short[best[4]]||"")+'</span>';
  h+=' <span style="color:#a0aab4">lvl '+best[10]+'</span></div>';
  h+='<div style="color:#a0aab4;font-size:10px;margin-bottom:6px;word-break:break-word">'+best[0]+'</div>';
  h+='<div style="color:#808890;font-size:10px;border-top:1px solid #252b33;padding-top:4px">';
  h+='Forces: ASM='+best[6].toFixed(2)+' IntCV='+best[7].toFixed(2)+' RD_r='+best[8].toFixed(2)+' SFD_d='+best[9].toFixed(2)+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:10px;margin-top:4px">';
  for(var i=0;i<fnames.length&&i<8;i++){
    h+='<span style="color:#a0aab4">'+fnames[i]+': <b style="color:#f0f4f8">'+best[11+i].toFixed(4)+'</b></span>';
  }
  h+='</div>';

  tip.innerHTML=h;
  tip.style.display="block";
  tip.style.left="16px";
  tip.style.top="16px";
}

}catch(e){document.getElementById("err").textContent="Error: "+e.message+"\n"+e.stack}})();
</script>
</body>
</html>
