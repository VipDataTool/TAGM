<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASM Chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0:#121212;--bg-1:#1E1E1E;--bg-2:#252525;--bg-3:#2d2d2d;
  --border:#333333;--text-0:#DEE2E6;--text-1:#9CA3AF;--text-2:#6B7280;--text-3:#4B5563;
  --blue:#58a6ff;--green:#009E73;--orange:#E69F00;--red:#D55E00;--cyan:#56B4E9;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-0);color:var(--text-0);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:500;color:var(--text-0)}
header a{color:var(--text-2);font-size:12px;text-decoration:none}
header a:hover{color:var(--text-0)}
.controls{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:12px;color:var(--text-1)}
.controls label{display:flex;align-items:center;gap:4px;cursor:pointer}
.controls input[type=checkbox]{accent-color:var(--cyan)}
.hdr-btn{background:none;border:1px solid var(--border);color:var(--text-2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:var(--sans)}
.hdr-btn:hover{color:var(--text-0);border-color:var(--text-2)}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:8px;line-height:1.5;font-size:14px;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--bg-3);color:var(--text-0);border:1px solid var(--border)}
.msg.assistant{align-self:flex-start;background:var(--bg-2);color:var(--text-0)}
.msg.error{align-self:center;color:var(--red);font-size:12px}
.msg.system{align-self:center;color:var(--text-2);font-size:12px;font-style:italic}
.msg .analyzed{font-size:10px;color:var(--text-3);margin-top:4px}
.model-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin-bottom:4px;font-family:var(--mono);font-weight:500}
.model-badge.instruct{background:var(--cyan);color:#000}
.model-badge.base{background:var(--orange);color:#000}
.input-row{padding:12px 16px;background:var(--bg-1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.input-row textarea{flex:1;background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--sans);font-size:14px;resize:none;min-height:44px;max-height:120px;outline:none}
.input-row textarea:focus{border-color:var(--cyan)}
.input-row button{background:var(--bg-3);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:8px 16px;cursor:pointer;font-family:var(--sans);font-size:13px;white-space:nowrap}
.input-row button:hover{background:var(--border)}
.input-row button:disabled{opacity:0.4;cursor:not-allowed}
.status{font-size:11px;color:var(--text-3);padding:4px 16px;flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>TASM Chat</h1>
  <a href="/">← Analyzer</a>
  <div class="controls">
    <label><input type="checkbox" id="chkAnalyze" checked> Analyze prompts</label>
    <label><input type="checkbox" id="chkResponses"> Analyze responses</label>
    <label><input type="checkbox" id="chkLTP" checked> LTP</label>
    <label><input type="checkbox" id="chkSFD" checked> SFD</label>
    <select id="chatModelClass" onchange="setChatModelClass(this.value)" style="background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;font-family:var(--sans)">
      <option value="instruct" selected>Instruct</option>
      <option value="base">Base</option>
    </select>
    <button class="hdr-btn" onclick="resetChat()">Reset</button>
  </div>
</header>
<div class="messages" id="messages"></div>
<div class="status" id="status"></div>
<div class="input-row">
  <textarea id="input" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="sendBtn" onclick="send()">Send</button>
</div>
<script>
const chatMessages=[];
let busy=false;
let turnCount=0;

function $(id){return document.getElementById(id)}

function setStatus(msg){$('status').textContent=msg}

function addMsg(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  $('messages').appendChild(d);
  $('messages').scrollTop=$('messages').scrollHeight;
  return d;
}

async function send(){
  if(busy)return;
  const input=$('input');
  const text=input.value.trim();
  if(!text)return;

  input.value='';
  input.style.height='44px';
  chatMessages.push({role:'user',content:text});
  addMsg('user',text);

  const doAnalyze=$('chkAnalyze').checked;
  const doAnalyzeResp=$('chkResponses').checked;
  busy=true;
  $('sendBtn').disabled=true;
  turnCount++;

  const thinking=addMsg('system','generating...');
  setStatus('Generating response...');

  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:chatMessages,
        max_tokens:256,
        analyze:doAnalyze,
        analyze_response:doAnalyzeResp,
        compute_ltp:$('chkLTP').checked,
        compute_sfd:$('chkSFD').checked,
      })
    });
    const data=await resp.json();
    thinking.remove();

    if(data.ok){
      chatMessages.push({role:'assistant',content:data.response});
      const msgEl=addMsg('assistant',data.response);
      if(data.model_class){
        const badge=document.createElement('div');
        badge.className='model-badge '+data.model_class;
        badge.textContent=data.model_class;
        msgEl.insertBefore(badge,msgEl.firstChild);
      }

      let statusParts=[];
      if(data.prompt_analyzed) statusParts.push('prompt analyzed');
      if(data.response_analyzed) statusParts.push('response analyzed');
      if(statusParts.length){
        const tag=document.createElement('div');
        tag.className='analyzed';
        tag.textContent='✓ '+statusParts.join(', ')+' — see Data tab in Analyzer';
        msgEl.appendChild(tag);
      }
      setStatus(`Turn ${turnCount}. ${statusParts.length?statusParts.join(', ')+'  →  results in session':''}`);
    } else {
      addMsg('error',data.error||'Unknown error');
      setStatus('Error: '+(data.error||'unknown'));
    }
  }catch(e){
    thinking.remove();
    addMsg('error','Network error: '+e.message);
    setStatus('Network error');
  }
  busy=false;
  $('sendBtn').disabled=false;
  input.focus();
}

function resetChat(){
  chatMessages.length=0;
  turnCount=0;
  $('messages').innerHTML='';
  setStatus('Chat reset. Session data preserved in Analyzer.');
}

async function setChatModelClass(cls){
  const sel=$('chatModelClass');sel.disabled=true;
  try{
    const fd=new FormData();fd.append('model_class',cls);
    const r=await(await fetch('/api/set_inference_model',{method:'POST',body:fd})).json();
    if(!r.ok){addMsg('error',r.message||'Failed to switch');sel.value=(cls==='base'?'instruct':'base')}
    else{addMsg('system','Switched to '+cls+' model')}
  }catch(e){addMsg('error','Switch error: '+e.message);sel.value=(cls==='base'?'instruct':'base')}
  sel.disabled=false;
}

$('input').addEventListener('input',function(){
  this.style.height='44px';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
</script>
</body>
</html>
