<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe-Basis Decomposition — TAGM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* aligned to the TAGM app shell */
  --bg-0:#121212;--bg-1:#1A1D21;--bg-2:#21262D;--bg-3:#2D333B;
  --border:#30363D;--border-soft:#262B31;--border-accent:#4A535C;
  --text-0:#E8ECEF;--text-1:#B8BFC6;--text-2:#8B939C;--text-3:#6B7280;
  --blue:#58A6FF;--cyan:#56B4E9;--green:#009E73;--orange:#E69F00;--red:#D55E00;--purple:#CC79A7;
  /* legacy names the visualization engine references inline — keep defined */
  --bg:var(--bg-0);--bg2:var(--bg-2);--text:var(--text-0);--text2:var(--text-2);--text3:var(--text-3);
  --aligned:#FF6B5E;--anti-aligned:#6FA8FF;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-0);color:var(--text-1);font-family:var(--sans);font-size:13px;line-height:1.5;
  padding:20px;max-width:1320px;margin:0 auto;-webkit-font-smoothing:antialiased}
h3{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text-0);letter-spacing:.2px}
.mono{font-family:var(--mono)}

/* ── Header / parameter readout ───────────────────────────── */
#prism-header{border:1px solid var(--border);border-radius:8px;background:
  linear-gradient(180deg,var(--bg-1),var(--bg-0));padding:0 0 14px;margin-bottom:16px;overflow:hidden}
.ph-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--border-soft);
  background:linear-gradient(180deg,rgba(88,166,255,.05),transparent)}
.ph-name{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text-0);
  letter-spacing:.3px;display:flex;align-items:baseline;gap:12px}
.ph-kicker{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--text-3);
  text-transform:uppercase;letter-spacing:1.6px}
.ph-run{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px}
.ph-model{color:var(--text-1);padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2)}
.ph-graft{color:#000;background:var(--orange);font-weight:600;font-size:10.5px;letter-spacing:1px;
  padding:3px 9px;border-radius:6px}
.ph-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:0;
  padding:14px 18px 2px}
.ph-group{padding:0 18px 10px 0;border-right:1px solid var(--border-soft)}
.ph-group:last-child{border-right:none}
.ph-glabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--text-3);margin-bottom:9px}
.ph-chips{display:flex;flex-wrap:wrap;gap:7px}
.pchip{display:inline-flex;align-items:baseline;gap:7px;background:var(--bg-2);
  border:1px solid var(--border-soft);border-radius:6px;padding:4px 9px;line-height:1.4}
.pchip .k{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.pchip .v{font-family:var(--mono);font-size:12px;color:var(--text-1);font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip.accent{border-color:var(--border-accent)}
.pchip.accent .v{color:var(--cyan)}
.pchip.warn .v{color:var(--orange)}
.ph-prov{margin:6px 18px 0}
.ph-prov summary{cursor:pointer;font-size:11px;color:var(--text-3);list-style:none;
  display:inline-flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
.ph-prov summary::-webkit-details-marker{display:none}
.ph-prov summary::before{content:"▸";color:var(--text-3);transition:transform .12s}
.ph-prov[open] summary::before{transform:rotate(90deg)}
.ph-prov summary:hover{color:var(--text-1)}
.ph-provgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:6px 0 2px;
  font-size:11px;max-width:560px}
.ph-provgrid .ppk{color:var(--text-3)}
.ph-provgrid .ppv{font-family:var(--mono);color:var(--text-2);word-break:break-all}

/* ── Controls ─────────────────────────────────────────────── */
.viewbar{display:inline-flex;gap:0;margin-bottom:12px;border:1px solid var(--border);
  border-radius:7px;overflow:hidden;background:var(--bg-1)}
.viewbar button{padding:6px 14px;background:transparent;color:var(--text-2);border:none;
  border-right:1px solid var(--border);cursor:pointer;font-family:var(--mono);font-size:11.5px;transition:background .12s,color .12s}
.viewbar button:last-child{border-right:none}
.viewbar button.active{background:var(--cyan);color:#04121E;font-weight:600}
.viewbar button:hover:not(.active){background:var(--bg-3);color:var(--text-0)}
.promptbar{display:flex;gap:8px;margin-bottom:12px;font-size:11.5px;align-items:center;flex-wrap:wrap;
  padding:9px 11px;background:var(--bg-1);border:1px solid var(--border);border-radius:7px}
.promptbar label{color:var(--text-3);font-size:11px}
.promptbar select{background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:5px;
  padding:4px 9px;font-family:var(--mono);font-size:11.5px;max-width:420px}
.promptbar select:focus{outline:none;border-color:var(--blue)}
.promptbar button{background:var(--bg-2);color:var(--text-1);border:1px solid var(--border);border-radius:5px;
  padding:4px 9px;cursor:pointer;font-family:var(--mono);font-size:11.5px;transition:background .12s}
.promptbar button:hover{background:var(--bg-3)}
.promptbar button.playing{color:var(--orange);border-color:var(--orange)}
.promptbar .counter{font-size:10.5px;color:var(--text-3);min-width:54px;font-variant-numeric:tabular-nums}
.prompt-text{padding:11px 14px;margin-bottom:12px;background:var(--bg-1);border:1px solid var(--border);
  border-radius:7px;font-size:12px;line-height:1.6;display:none}
.prompt-text.active{display:block}
.prompt-text .pmeta{color:var(--text-3);font-size:10.5px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.prompt-text .pmeta .cat{display:inline-block;padding:2px 8px;border-radius:4px;color:#04121E;font-weight:600}
.prompt-text .ptext{color:var(--text-0);white-space:pre-wrap;word-break:break-word;font-family:var(--mono)}

/* ── Legend ───────────────────────────────────────────────── */
.legend{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:10.5px;color:var(--text-3);max-width:520px}
.legend .bar{display:flex;height:11px;flex:1;border-radius:3px;overflow:hidden;border:1px solid var(--border-soft)}
.legend .lbl{white-space:nowrap;font-family:var(--mono);color:var(--text-2)}

/* ── Heatmap ──────────────────────────────────────────────── */
.heatmap-wrap{margin-bottom:18px;overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:0;font-size:11.5px;font-family:var(--mono)}
table.hm th,table.hm td{padding:8px 13px;text-align:center;border:1px solid var(--bg-0);
  font-variant-numeric:tabular-nums}
table.hm th{color:var(--text-2);font-weight:500;background:var(--bg-2)}
table.hm th:first-child{background:transparent}
table.hm td.cell{cursor:pointer;transition:outline .1s}
table.hm td.cell:hover{outline:2px solid var(--text-1);outline-offset:-2px}
table.hm td.cell.sel{outline:2px solid var(--cyan);outline-offset:-2px;z-index:1;position:relative}

/* ── Tabs ─────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;margin-bottom:0;border-bottom:1px solid var(--border)}
.tabs button{padding:9px 16px;background:transparent;color:var(--text-2);border:none;
  border-bottom:2px solid transparent;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:500}
.tabs button.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tabs button:hover:not(.active){color:var(--text-0)}
.tab-panel{padding:16px 0;display:none}
.tab-panel.active{display:block}

/* ── Probe / cell tables ──────────────────────────────────── */
table.tok{width:100%;border-collapse:collapse;font-size:11.5px}
table.tok th{text-align:left;color:var(--text-3);font-weight:600;padding:7px 11px;border-bottom:1px solid var(--border);
  background:var(--bg-1);position:sticky;top:0;cursor:default;user-select:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
table.tok th.sortable{cursor:pointer}
table.tok th.sortable:hover{color:var(--text-0)}
table.tok th .sort-arrow{display:inline-block;margin-left:5px;color:var(--cyan);width:8px}
table.tok td{padding:6px 11px;border-bottom:1px solid var(--border-soft);font-family:var(--mono)}
table.tok td.num,table.tok th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tok tr:hover td{background:#FFFFFF07}
.cell-info{font-size:11.5px;color:var(--text-2);margin-bottom:12px;line-height:1.75}
.cell-info b{color:var(--text-0);font-weight:600}
.cell-empty{color:var(--text-3);font-style:italic;padding:26px;text-align:center;background:var(--bg-1);
  border:1px dashed var(--border);border-radius:7px}

/* ── All-probes section + exports ─────────────────────────── */
.probes-section{margin-top:26px;border-top:1px solid var(--border);padding-top:18px}
.section-head{margin-bottom:12px}
.section-head h3{margin-bottom:3px}
.section-sub{font-size:11px;color:var(--text-3)}
.section-sub .scope{color:var(--cyan);font-family:var(--mono)}
.probe-toolbar{margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.probe-toolbar .probe-filter{flex:1 1 240px}
.pagesize-lbl{font-size:11px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pagesize{background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:6px;
  font-family:var(--mono);font-size:11.5px;padding:5px 8px}
.pagesize:focus{outline:none;border-color:var(--blue)}
.probe-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:9px;font-size:11px;color:var(--text-3)}
.pager-info{font-family:var(--mono)}
.pager-btns{display:flex;align-items:center;gap:8px}
.pager-page{font-family:var(--mono);color:var(--text-2);min-width:78px;text-align:center}
.pager-btn{font-family:var(--mono);font-size:11.5px;color:var(--text-1);background:var(--bg-2);
  border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer;transition:background .12s}
.pager-btn:hover:not(:disabled){background:var(--bg-3);border-color:var(--border-accent);color:var(--text-0)}
.pager-btn:disabled{opacity:.4;cursor:default}
.probe-filter{width:100%;max-width:380px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-0);font-family:var(--mono);font-size:11.5px;padding:7px 11px}
.probe-filter:focus{outline:none;border-color:var(--blue)}
.probe-filter::placeholder{color:var(--text-3)}
.probe-table-wrap{border:1px solid var(--border);border-radius:7px;overflow:auto;max-height:460px;background:var(--bg-0)}
.probe-table td.ptext-cell{color:var(--text-0);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.probe-table td.subj,.probe-table td.lvl{color:var(--text-1)}
.probe-table td.absval{color:var(--text-2)}
.export-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;
  background:var(--bg-1);border:1px solid var(--border);border-radius:7px}
.export-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-3)}
.export-btns{display:flex;gap:8px;flex-wrap:wrap}
.exp{font-family:var(--mono);font-size:11.5px;color:var(--text-1);background:var(--bg-2);
  border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;text-decoration:none;
  display:inline-block;transition:background .12s,border-color .12s}
.exp:hover{background:var(--bg-3);border-color:var(--border-accent);color:var(--text-0)}

#err{color:var(--red);padding:11px 13px;white-space:pre-wrap;background:var(--bg-1);border:1px solid var(--red);
  border-radius:7px;margin-top:10px;font-family:var(--mono);font-size:12px}
#err:empty{display:none}
.empty{color:var(--text-3);font-style:italic;padding:22px;text-align:center}

/* ── Glossary ─────────────────────────────────────────────── */
.glossary{display:flex;flex-direction:column;gap:15px;max-width:780px}
.glossary dt{font-family:var(--mono);font-weight:600;color:var(--cyan);font-size:12.5px;margin-bottom:4px}
.glossary dd{font-size:11.5px;color:var(--text-2);line-height:1.65;margin-left:0}
.glossary dd code{background:var(--bg-2);padding:1px 6px;border-radius:3px;color:var(--text-0);font-family:var(--mono);font-size:10.5px}

/* ── Print ────────────────────────────────────────────────── */
@media print{
  body{background:#fff;color:#111;max-width:none;padding:0;font-size:11px}
  .viewbar,.promptbar,.tabs,.probe-toolbar,.probe-pager,.export-bar,#err{display:none !important}
  #prism-header{background:#fff;border-color:#bbb}
  .ph-title{background:#fff;border-color:#ddd}
  .ph-name,.cell-info b,.glossary dt{color:#000}
  .ph-kicker,.ph-glabel,.pchip .k,.section-sub,.ph-provgrid .ppk{color:#555}
  .pchip,.ph-model{background:#f4f4f4;border-color:#ccc}
  .pchip .v,.ph-provgrid .ppv,.section-sub .scope{color:#111}
  .ph-prov summary{display:none}
  .ph-prov,.ph-prov[open]{display:block}
  #tab-cell{display:block !important}
  #tab-probe,#tab-glossary{display:none !important}
  .cell-info{color:#333}
  .cell-info b{color:#000}
  .probes-section{border-top-color:#bbb}
  .probe-table-wrap{max-height:none;overflow:visible;border-color:#ccc}
  .probe-table td.ptext-cell{color:#000;max-width:none;white-space:normal}
  .probe-table-wrap{background:#fff}
  .probe-table td.subj,.probe-table td.lvl,.probe-table td.absval{color:#111}
  table.tok th{background:#eee;color:#333}
  table.tok td{color:#111;border-bottom-color:#ddd}
  table.hm td,table.hm th,.legend .bar div,.legend .bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.hm th{color:#222}
  a.exp{display:none}
}

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width:760px){
  body{padding:12px}
  .ph-group{border-right:none;border-bottom:1px solid var(--border-soft);padding:0 0 10px}
  .ph-group:last-child{border-bottom:none}
  .promptbar select{max-width:100%;flex:1 1 100%}
}
</style>
</head>
<body>
<div id="prism-header">Loading…</div>

<div class="viewbar" id="viewbar"></div>
<div class="promptbar" id="promptbar"></div>
<div class="legend" id="legend"></div>
<div class="prompt-text" id="prompt-text"></div>
<div class="heatmap-wrap" id="heatmap"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="probe">Probe Activity</button>
  <button class="tab-btn" data-tab="cell">Cell Composition</button>
  <button class="tab-btn" data-tab="glossary">Glossary</button>
</div>

<div class="tab-panel active" id="tab-probe"></div>
<div class="tab-panel" id="tab-cell"></div>
<div class="tab-panel" id="tab-glossary"></div>

<div id="err"></div>

<script>

(function(){
  // ── State ──────────────────────────────────────────────────
  var D = null;            // results JSON
  var SUBJ = [], LEVELS = [], SUBJ_SHORT = [];
  var CELLS = {};          // cell_details
  var DECOMP = {};         // per-circuit decomposition
  var CIRC_LABELS = {};
  var PRIMARY = "full";
  var HAS_BASELINE = false;

  var view = "primary";    // primary | baseline | diff
  var selCell = null;      // "si_li"
  var sortKey = "abs";     // "abs" | "signed" | "name"
  var sortDir = -1;        // -1 desc, +1 asc

  // Slideshow state.
  // selPrompt = "all" shows the session-aggregated heatmap (default).
  // selPrompt = "<idx>" shows that one prompt's per-cell response.
  var selPrompt = "all";
  var selClass = null;   // null = all classes; else a category key (scopes whole view)
  var slideTimer = null, slideSpeed = 2000, slidePlaying = false;
  var PROMPTS = [];        // [{idx, category, text, projected}, ...]
  var CAT_NAMES = {};      // { "h": "harmful", ... }
  var CELL_AGG = "sum";    // matches module's cell_aggregation config
  var DIR_PCT = 10;        // directional_threshold_pct from module config
  var PROBE_CELL_MAP = {}; // { "si_li": [probe_idx, probe_idx, ...] }

  // ── Boot ───────────────────────────────────────────────────
  function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}

  fetch("/api/modules/correction_prism/results")
    .then(function(r){return r.json()})
    .then(function(resp){
      if(!resp.ok || !resp.results) throw new Error(resp.error || "No results");
      D = resp.results;
      init();
    })
    .catch(function(e){
      document.getElementById("err").textContent = "Failed to load: " + e.message;
    });

  function init(){
    SUBJ = D.subjects || [];
    LEVELS = D.levels || [];
    SUBJ_SHORT = D.subj_short || SUBJ;
    CELLS = D.cell_details || {};
    DECOMP = D.decomposition || {};
    CIRC_LABELS = D.circuit_labels || {};
    PRIMARY = D.primary_circuit || "full";
    HAS_BASELINE = !!(DECOMP._baseline && DECOMP._baseline.aggregate);
    PROMPTS = D.prompts || [];
    CAT_NAMES = D.categories || {};
    CELL_AGG = (D.config || {}).cell_aggregation || "sum";
    DIR_PCT = (D.config || {}).directional_threshold_pct;
    if (DIR_PCT == null) DIR_PCT = 10;

    // Build the cell → [probe_idx, ...] map by reading cell_details.
    // We need this to derive per-prompt cell values from
    // per_prompt_response without re-running the module.
    PROBE_CELL_MAP = {};
    Object.keys(CELLS).forEach(function(k){
      var probes = (CELLS[k] && CELLS[k].probes) || [];
      PROBE_CELL_MAP[k] = probes.map(function(p){ return p.probe_idx; });
    });

    var cfg = D.config || {};
    buildHeader(cfg);

    buildViewbar();
    buildPromptbar();
    buildTabs();
    render();
  }

  // ── View bar (Correction / Baseline / Diff) ────────────────
  function buildViewbar(){
    var bar = document.getElementById("viewbar");
    if (!HAS_BASELINE){
      bar.innerHTML = '<div style="color:var(--text2);font-size:11px;font-style:italic">Baseline not computed (enable "Include Baseline" in module parameters to access view toggle)</div>';
      return;
    }
    function btn(v, label){
      var active = (view === v) ? " active" : "";
      return '<button class="vb' + active + '" data-v="' + v + '">' + esc(label) + '</button>';
    }
    bar.innerHTML =
      btn("primary", "Correction") +
      btn("baseline", "Baseline (ΔW = I)") +
      btn("diff", "Correction − Baseline");
    var btns = bar.querySelectorAll("button");
    for (var i=0; i<btns.length; i++){
      btns[i].addEventListener("click", function(e){
        view = e.currentTarget.getAttribute("data-v");
        stopSlideshow();
        buildViewbar();
        render();
      });
    }
  }


  // ── Prompt picker + slideshow controls ─────────────────────
  // Slideshow controls: dropdown to
  // pick a specific prompt or "All", with prev/play/next buttons and a
  // speed selector. Selecting a prompt switches the heatmap to that
  // prompt's per-cell response derived from per_prompt_response.
  var CAT_COLORS = {b:"#009E73",m:"#E69F00",h:"#D55E00",j:"#56B4E9",a:"#882255",d:"#4ade80",u:"#888"};

  function projectedPrompts(){
    return PROMPTS.filter(function(p){ return p.projected; });
  }

  function buildPromptbar(){
    var bar = document.getElementById("promptbar");
    var allf = projectedPrompts();
    if (!allf.length){ bar.innerHTML = ''; return; }

    // Reflexive class list: only categories present in this run's prompts.
    var counts = {}, order = [];
    allf.forEach(function(p){
      if (counts[p.category] == null){ counts[p.category] = 0; order.push(p.category); }
      counts[p.category]++;
    });
    if (selClass && counts[selClass] == null) selClass = null;  // class vanished -> all

    var fps = scopePrompts();

    var html = '<label>Class:</label><select id="classSel">';
    html += '<option value=""' + (selClass ? '' : ' selected') + '>All classes (' + allf.length + ')</option>';
    order.forEach(function(k){
      html += '<option value="' + esc(k) + '"' + (selClass === k ? ' selected' : '') +
              '>' + esc(CAT_NAMES[k] || k) + ' (' + counts[k] + ')</option>';
    });
    html += '</select>';

    html += '<label>Prompt:</label><select id="promptSel">';
    var allLbl = selClass
        ? ('All ' + (CAT_NAMES[selClass] || selClass) + ' (' + fps.length + ', class aggregate)')
        : ('All (' + fps.length + ' prompts, session aggregate)');
    html += '<option value="all"' + (selPrompt === "all" ? ' selected' : '') + '>' + esc(allLbl) + '</option>';
    fps.forEach(function(p){
      var lbl = '#' + (p.idx + 1) + ' [' + (CAT_NAMES[p.category] || p.category) + '] ' + (p.text || '');
      if (lbl.length > 90) lbl = lbl.slice(0, 90) + '\u2026';
      html += '<option value="' + p.idx + '"' + (selPrompt == String(p.idx) ? ' selected' : '') +
              '>' + esc(lbl) + '</option>';
    });
    html += '</select>';

    html += '<button id="prevBtn" title="Previous prompt">\u25C0</button>';
    html += '<button id="playBtn" class="' + (slidePlaying ? 'playing' : '') +
            '" title="Play/pause slideshow">' + (slidePlaying ? '\u23F8 Pause' : '\u25B6 Play') + '</button>';
    html += '<button id="nextBtn" title="Next prompt">\u25B6</button>';
    html += '<label style="margin-left:4px">Speed:</label>';
    html += '<select id="speedSel">';
    [["500","0.5s"],["1000","1s"],["2000","2s"],["3000","3s"],["5000","5s"]].forEach(function(s){
      html += '<option value="' + s[0] + '"' + (slideSpeed == parseInt(s[0]) ? ' selected' : '') + '>' + s[1] + '</option>';
    });
    html += '</select>';
    html += '<span id="slideCounter" class="counter"></span>';

    bar.innerHTML = html;

    document.getElementById("classSel").addEventListener("change", function(e){
      selClass = e.currentTarget.value || null;
      selPrompt = "all";          // picking a class scopes the whole view to its aggregate
      stopSlideshow();
      buildPromptbar();
      render();
    });
    document.getElementById("promptSel").addEventListener("change", function(e){
      selPrompt = e.currentTarget.value;
      stopSlideshow();
      render();
    });
    document.getElementById("prevBtn").addEventListener("click", function(){ stopSlideshow(); advanceSlide(-1); });
    document.getElementById("nextBtn").addEventListener("click", function(){ stopSlideshow(); advanceSlide(1); });
    document.getElementById("playBtn").addEventListener("click", playPause);
    document.getElementById("speedSel").addEventListener("change", function(e){
      slideSpeed = parseInt(e.currentTarget.value);
      if (slidePlaying){ stopSlideshow(); playPause(); }
    });

    updateSlideCounter();
  }

  function updateSlideCounter(){
    var el = document.getElementById("slideCounter");
    if (!el) return;
    if (selPrompt === "all"){ el.textContent = ""; return; }
    var fps = scopePrompts();
    var pi = parseInt(selPrompt);
    var idx = -1;
    for (var i=0; i<fps.length; i++){
      if (fps[i].idx === pi){ idx = i; break; }
    }
    el.textContent = (idx >= 0) ? ((idx + 1) + "/" + fps.length) : "";
  }

  function stopSlideshow(){
    slidePlaying = false;
    if (slideTimer){ clearInterval(slideTimer); slideTimer = null; }
    var btn = document.getElementById("playBtn");
    if (btn){ btn.textContent = "▶ Play"; btn.classList.remove("playing"); }
  }

  function advanceSlide(dir){
    var fps = scopePrompts();
    if (!fps.length) return;
    var curIdx = -1;
    if (selPrompt !== "all"){
      var pi = parseInt(selPrompt);
      for (var i=0; i<fps.length; i++){
        if (fps[i].idx === pi){ curIdx = i; break; }
      }
    }
    var nextIdx = curIdx + dir;
    if (nextIdx < 0) nextIdx = fps.length - 1;
    if (nextIdx >= fps.length) nextIdx = 0;
    selPrompt = String(fps[nextIdx].idx);
    buildPromptbar();
    render();
  }

  function playPause(){
    if (slidePlaying){ stopSlideshow(); return; }
    slidePlaying = true;
    var btn = document.getElementById("playBtn");
    if (btn){ btn.textContent = "⏸ Pause"; btn.classList.add("playing"); }
    if (selPrompt === "all") advanceSlide(1);
    slideTimer = setInterval(function(){ advanceSlide(1); }, slideSpeed);
  }

  // ── Prompt-text panel ──────────────────────────────────────
  // Visible only when a single prompt is selected. Shows the prompt
  // that's casting the beam right now, with category coloring consistent
  // with the rest of the UI.
  function renderPromptText(){
    var el = document.getElementById("prompt-text");
    if (selPrompt === "all"){
      el.classList.remove("active");
      el.innerHTML = "";
      return;
    }
    var pi = parseInt(selPrompt);
    var p = PROMPTS[pi];
    if (!p){
      el.classList.remove("active");
      el.innerHTML = "";
      return;
    }
    var catColor = CAT_COLORS[p.category] || "#888";
    var catName = CAT_NAMES[p.category] || p.category || "—";
    var html = '<div class="pmeta">';
    html += '<span class="cat" style="background:' + catColor + '">' +
            esc(catName) + '</span>';
    html += 'Prompt #' + (p.idx + 1);
    html += '</div>';
    html += '<div class="ptext">' + esc(p.text || "") + '</div>';
    el.innerHTML = html;
    el.classList.add("active");
  }

  // ── Per-prompt grid derivation ─────────────────────────────
  // For a single prompt, the cell value is the aggregation of the
  // per-probe responses for the probes assigned to that cell. Cell
  // aggregation mode (sum / mean / median) matches the module config
  // so per-prompt views are directly comparable to the session
  // aggregate.
  function aggregate(values){
    if (!values.length) return 0;
    if (CELL_AGG === "mean"){
      var s = 0;
      for (var i=0; i<values.length; i++) s += values[i];
      return s / values.length;
    }
    if (CELL_AGG === "median"){
      var sorted = values.slice().sort(function(a,b){ return a-b; });
      var m = Math.floor(sorted.length / 2);
      return (sorted.length % 2) ? sorted[m] : 0.5 * (sorted[m-1] + sorted[m]);
    }
    // sum (default)
    var t = 0;
    for (var j=0; j<values.length; j++) t += values[j];
    return t;
  }

  // Orthogonality band for a given scope: DIR_PCT% of the mean |response|
  // over active probes, mirroring the module's gross-mean threshold so the
  // single-prompt / class recompute matches the module's aggregate scope.
  // scopeIdxs is the list of prompt indices in scope (one for a single
  // prompt, the class members for a class).
  function scopeThreshold(scopeIdxs){
    var ppr = (DECOMP[PRIMARY] && DECOMP[PRIMARY].per_prompt_response) || null;
    if (!ppr || !scopeIdxs || !scopeIdxs.length) return 0;
    var activeIdx = [];
    Object.keys(PROBE_CELL_MAP).forEach(function(k){
      var arr = PROBE_CELL_MAP[k] || [];
      for (var i=0; i<arr.length; i++) activeIdx.push(arr[i]);
    });
    if (!activeIdx.length) return 0;
    var sumAbs = 0, n = 0;
    for (var a=0; a<activeIdx.length; a++){
      var pi = activeIdx[a], s = 0, c = 0;
      for (var z=0; z<scopeIdxs.length; z++){
        var rr = ppr[scopeIdxs[z]];
        if (rr){ s += (rr[pi] || 0); c++; }
      }
      sumAbs += Math.abs(c ? (s / c) : 0); n++;
    }
    return (DIR_PCT / 100) * (n ? (sumAbs / n) : 0);
  }

  function gridForPrompt(view, circuit, promptIdx){
    circuit = circuit || PRIMARY;
    function gridFromCircuit(ck){
      var ppr = (DECOMP[ck] && DECOMP[ck].per_prompt_response) || null;
      if (!ppr || !ppr[promptIdx]) return null;
      var probeResps = ppr[promptIdx];
      var grid = [];
      for (var si=0; si<SUBJ.length; si++){
        var row = [];
        for (var li=0; li<LEVELS.length; li++){
          var key = si + "_" + li;
          var probeIdxs = PROBE_CELL_MAP[key] || [];
          var vals = probeIdxs.map(function(pi){ return probeResps[pi] || 0; });
          row.push(aggregate(vals));
        }
        grid.push(row);
      }
      return grid;
    }
    if (view === "baseline" && HAS_BASELINE){
      return gridFromCircuit("_baseline");
    }
    if (view === "diff" && HAS_BASELINE){
      var p = gridFromCircuit(circuit);
      var b = gridFromCircuit("_baseline");
      if (!p || !b) return p || b || [];
      var out = [];
      for (var si=0; si<p.length; si++){
        var row = [];
        for (var li=0; li<(p[si]||[]).length; li++){
          row.push((p[si][li] || 0) - ((b[si] || [])[li] || 0));
        }
        out.push(row);
      }
      return out;
    }
    return gridFromCircuit(circuit) || [];
  }

  // ── Tab strip ──────────────────────────────────────────────
  function buildTabs(){
    var btns = document.querySelectorAll(".tab-btn");
    for (var i=0; i<btns.length; i++){
      btns[i].addEventListener("click", function(e){
        var tab = e.currentTarget.getAttribute("data-tab");
        var all = document.querySelectorAll(".tab-btn");
        for (var j=0; j<all.length; j++) all[j].classList.remove("active");
        e.currentTarget.classList.add("active");
        var panels = document.querySelectorAll(".tab-panel");
        for (var k=0; k<panels.length; k++) panels[k].classList.remove("active");
        document.getElementById("tab-" + tab).classList.add("active");
      });
    }
  }

  // ── Relative-intensity colormap ──────────────────────────────
  // Sign → hue (positive=red, negative=blue).
  // Intensity → relative position within the positive or negative
  // subset of displayed values. The least extreme value in each
  // sign group gets the lightest shade; the most extreme gets full
  // saturation. This ensures the heatmap always shows internal
  // structure even when all values share the same sign.
  function scale(grid){
    var posVals = [], negVals = [], vmax = 0;
    for (var si=0; si<grid.length; si++){
      var row = grid[si] || [];
      for (var li=0; li<row.length; li++){
        var v = row[li] || 0;
        var a = Math.abs(v);
        if (a > vmax) vmax = a;
        if (v > 1e-10) posVals.push(v);
        else if (v < -1e-10) negVals.push(v);
      }
    }
    if (vmax < 1e-10) vmax = 1e-10;
    var posMin = null, posMax = null, negMin = null, negMax = null;
    if (posVals.length > 0){
      posMin = Math.min.apply(null, posVals);
      posMax = Math.max.apply(null, posVals);
    }
    if (negVals.length > 0){
      negMin = Math.min.apply(null, negVals);  // most negative
      negMax = Math.max.apply(null, negVals);   // closest to zero
    }
    return {vmax: vmax, posMin: posMin, posMax: posMax,
            negMin: negMin, negMax: negMax,
            mixed: (posVals.length > 0 && negVals.length > 0)};
  }
  function color(val, sc){
    if (Math.abs(val) < 1e-10) return 'rgb(30,30,36)';

    // Relative intensity: 0 = lightest, 1 = most saturated
    var t;
    if (val > 0){
      var range = (sc.posMax !== null && sc.posMax !== sc.posMin)
                ? (sc.posMax - sc.posMin) : 1;
      t = (sc.posMin !== null && range > 1e-10)
        ? (val - sc.posMin) / range : 1;
      t = Math.max(0, Math.min(1, t));
      return 'rgb(' + Math.round(30 + t*200) + ',' +
                      Math.round(30 + t*30)  + ',' +
                      Math.round(36 + t*20)  + ')';
    } else {
      var absVal = Math.abs(val);
      var absNegMax = sc.negMax !== null ? Math.abs(sc.negMax) : 0;  // closest to zero
      var absNegMin = sc.negMin !== null ? Math.abs(sc.negMin) : 0;  // most negative
      var nRange = absNegMin - absNegMax;
      t = (nRange > 1e-10)
        ? (absVal - absNegMax) / nRange : 1;
      t = Math.max(0, Math.min(1, t));
      return 'rgb(' + Math.round(30 + t*30)  + ',' +
                      Math.round(30 + t*80)  + ',' +
                      Math.round(36 + t*200) + ')';
    }
  }
  function textColor(val, sc){
    if (Math.abs(val) < 1e-10) return 'var(--text2)';
    var t;
    if (val > 0){
      var range = (sc.posMax !== null && sc.posMax !== sc.posMin)
                ? (sc.posMax - sc.posMin) : 1;
      t = (sc.posMin !== null && range > 1e-10)
        ? (val - sc.posMin) / range : 1;
    } else {
      var absVal = Math.abs(val);
      var absNegMax = sc.negMax !== null ? Math.abs(sc.negMax) : 0;
      var absNegMin = sc.negMin !== null ? Math.abs(sc.negMin) : 0;
      var nRange = absNegMin - absNegMax;
      t = (nRange > 1e-10) ? (absVal - absNegMax) / nRange : 1;
    }
    return t > 0.3 ? '#fff' : 'var(--text2)';
  }

  // ── Grid for current view ──────────────────────────────────
  // Routes to per-prompt derivation when a single prompt is selected.
  function gridFor(view, circuit){
    circuit = circuit || PRIMARY;
    if (selPrompt !== "all"){
      return gridForPrompt(view, circuit, parseInt(selPrompt));
    }
    if (selClass){
      return gridForPromptSet(view, circuit, scopePrompts().map(function(p){ return p.idx; }));
    }
    var prim = (DECOMP[circuit] && DECOMP[circuit].aggregate) || [];
    if (view === "baseline" && HAS_BASELINE){
      return DECOMP._baseline.aggregate;
    }
    if (view === "diff" && HAS_BASELINE){
      var b = DECOMP._baseline.aggregate;
      var out = [];
      for (var si=0; si<prim.length; si++){
        var row = [];
        for (var li=0; li<(prim[si]||[]).length; li++){
          row.push((prim[si][li] || 0) - ((b[si] || [])[li] || 0));
        }
        out.push(row);
      }
      return out;
    }
    return prim;
  }

  // ── Heatmap renderer ───────────────────────────────────────
  // makeCellId: function(si,li) -> id string, or null for non-clickable
  function renderHeatmap(grid, sc, makeCellId, digits){
    digits = (digits == null) ? 3 : digits;
    var html = '<table class="hm"><tr><th></th>';
    for (var li=0; li<LEVELS.length; li++){
      html += '<th>' + esc(LEVELS[li]) + '</th>';
    }
    html += '</tr>';
    for (var si=0; si<SUBJ.length; si++){
      html += '<tr><th>' + esc(SUBJ_SHORT[si] || SUBJ[si]) + '</th>';
      for (var li2=0; li2<LEVELS.length; li2++){
        var v = (grid[si] && grid[si][li2] != null) ? grid[si][li2] : 0;
        var id = makeCellId ? makeCellId(si, li2) : null;
        var cls = id ? "cell" : "";
        if (id && id === selCell) cls += " sel";
        var attrs = id ? ' data-cell="' + id + '"' : '';
        html += '<td class="' + cls + '"' + attrs +
                ' style="background:' + color(v, sc) +
                ';color:' + textColor(v, sc) + '">' +
                (v >= 0 ? '+' : '') + v.toFixed(digits) + '</td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    return html;
  }

  function renderLegendBar(sc, label){
    // Build gradient from actual data range
    var lo, hi;
    if (sc.mixed) {
      lo = sc.negMin || 0;
      hi = sc.posMax || 0;
    } else if (sc.posMax !== null) {
      lo = sc.posMin || 0;
      hi = sc.posMax || 0;
    } else if (sc.negMin !== null) {
      lo = sc.negMin || 0;
      hi = sc.negMax || 0;
    } else {
      lo = 0; hi = 0;
    }
    var stops = '';
    for (var i=0; i<13; i++){
      var v = lo + (hi - lo) * i / 12;
      stops += '<div style="flex:1;background:' + color(v, sc) + '"></div>';
    }
    var html = '<span class="lbl">' + esc((lo >= 0 ? '+' : '') + lo.toFixed(3)) + '</span>';
    html += '<div class="bar">' + stops + '</div>';
    html += '<span class="lbl">' + esc((hi >= 0 ? '+' : '') + hi.toFixed(3)) + '</span>';
    if (label) html += '<span class="lbl" style="margin-left:12px;color:var(--text3)">' + esc(label) + '</span>';
    return html;
  }

  function bindCellClicks(rootEl){
    var cells = rootEl.querySelectorAll("td.cell[data-cell]");
    for (var i=0; i<cells.length; i++){
      cells[i].addEventListener("click", function(e){
        var id = e.currentTarget.getAttribute("data-cell");
        selCell = id;
        renderCellPanel();
        renderProbeActivity();
        // Highlight on whichever heatmap is showing
        var prev = document.querySelectorAll("td.cell.sel");
        for (var j=0; j<prev.length; j++) prev[j].classList.remove("sel");
        e.currentTarget.classList.add("sel");
        // Reveal a panel that responds to the selection. If the user is
        // already on Cell Composition or Probe Activity, stay put (the
        // selection just filters in place); otherwise show Cell Composition.
        var active = document.querySelector(".tab-btn.active");
        var activeTab = active ? active.getAttribute("data-tab") : null;
        if (activeTab !== "cell" && activeTab !== "probe"){
          var cellBtn = document.querySelector('.tab-btn[data-tab="cell"]');
          if (cellBtn) cellBtn.click();
        }
      });
    }
  }

  // ── Top render ─────────────────────────────────────────────
  function render(){
    var grid = gridFor(view);
    var sc = scale(grid);

    // Legend
    var label = (view === "baseline") ? "no correction lens"
              : (view === "diff") ? "correction-induced response"
              : (CIRC_LABELS[PRIMARY] || PRIMARY);
    if (selPrompt !== "all"){
      label += " · single prompt";
    } else if (selClass){
      label += " · class: " + (CAT_NAMES[selClass] || selClass) + " (" + scopePrompts().length + ")";
    }
    document.getElementById("legend").innerHTML = renderLegendBar(sc, label);

    // Prompt text panel (shows the active prompt; hidden when "All")
    renderPromptText();

    // Main heatmap
    var hm = document.getElementById("heatmap");
    hm.innerHTML = renderHeatmap(grid, sc, function(si, li){ return si + "_" + li; }, 3);
    bindCellClicks(hm);

    // Probe Activity tab
    renderProbeActivity();
    // Cell tab
    renderCellPanel();
    // Glossary tab (static; render once is fine but cheap to redo)
    renderGlossary();
    updateSlideCounter();
  }

  // ── Decomposition tab ──────────────────────────────────────
  // ── Probe Activity tab ─────────────────────────────────────
  // Inverts Cell Composition: instead of one cell's probes, rank every
  // probe term by how connected it is across the dataset — mean |response|
  // over the current scope. A selected cell filters the ranking to that
  // cell's members (same click wiring as Cell Composition); the stopword
  // toggle hides filler terms via the is_stopword flag the module attached
  // from the shared stoplist. No new computation — all from the payload.
  var paHideStopwords = true;

  function probeScopeIdxs(){
    if (selPrompt !== "all") return [parseInt(selPrompt, 10)];
    if (selClass) return scopePrompts().map(function(p){ return p.idx; });
    return projectedPrompts().map(function(p){ return p.idx; });
  }

  function renderProbeActivity(){
    var panel = document.getElementById("tab-probe");
    var ppr = (DECOMP[PRIMARY] && DECOMP[PRIMARY].per_prompt_response) || null;
    if (!ppr){
      panel.innerHTML = '<div class="cell-empty">No per-prompt responses in this run\'s payload.</div>';
      return;
    }
    var idxs = probeScopeIdxs();
    if (!idxs || !idxs.length){
      panel.innerHTML = '<div class="cell-empty">No projected prompts in scope.</div>';
      return;
    }

    // Probe set: a selected cell filters to its members; otherwise every
    // active probe (flattened from cell_details — each appears once).
    var src = [];
    if (selCell && CELLS[selCell]){
      src = (CELLS[selCell].probes || []);
    } else {
      Object.keys(CELLS).forEach(function(cid){
        var ps = (CELLS[cid] && CELLS[cid].probes) || [];
        for (var i=0; i<ps.length; i++) src.push(ps[i]);
      });
    }

    var band = scopeThreshold(idxs);
    var rows = [], hidden = 0;
    for (var i=0; i<src.length; i++){
      var p = src[i];
      if (paHideStopwords && p.is_stopword){ hidden++; continue; }
      var sum = 0, asum = 0, cnt = 0;
      for (var z=0; z<idxs.length; z++){
        var rr = ppr[idxs[z]];
        if (rr){ var v = rr[p.probe_idx] || 0; sum += v; asum += Math.abs(v); cnt++; }
      }
      var meanAbs = cnt ? (asum / cnt) : 0;
      var meanSigned = cnt ? (sum / cnt) : 0;
      var dir = (meanSigned > band) ? "aligned" : (meanSigned < -band) ? "anti-aligned" : "orthogonal";
      rows.push({ text: p.text, meanAbs: meanAbs, meanSigned: meanSigned, dir: dir, sw: !!p.is_stopword });
    }
    rows.sort(function(a, b){ return b.meanAbs - a.meanAbs; });

    // Scope label
    var scopeLabel;
    if (idxs.length === 1){
      var pinfo = PROMPTS[idxs[0]];
      scopeLabel = "prompt #" + (idxs[0] + 1) +
        (pinfo ? " [" + (CAT_NAMES[pinfo.category] || pinfo.category) + "]" : "");
    } else if (selClass){
      scopeLabel = "class: " + (CAT_NAMES[selClass] || selClass) + " · " + idxs.length + " prompts";
    } else {
      scopeLabel = "session aggregate · " + idxs.length + " prompts";
    }

    var h = '<div style="font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.6">' +
            'Probe terms ranked by mean <code>|response|</code> across the dataset — how connected each ' +
            'concept is to the correction field, anywhere it appears. Scope: <b>' + esc(scopeLabel) + '</b>.</div>';

    h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px">';
    if (selCell && CELLS[selCell]){
      var pr = selCell.split("_");
      var sName = SUBJ[parseInt(pr[0], 10)] || ("subject " + pr[0]);
      var lName = LEVELS[parseInt(pr[1], 10)] || ("level " + pr[1]);
      h += '<span style="color:var(--text)">Filtered to cell <b>' + esc(sName) + ' / ' + esc(lName) + '</b></span>';
      h += '<a id="pa-clear" href="#" style="color:var(--cyan);text-decoration:none">show all probes ✕</a>';
    } else {
      h += '<span style="color:var(--text3)">All active probes — click a cell to filter</span>';
    }
    h += '<label style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text2)">' +
         '<input type="checkbox" id="pa-sw"' + (paHideStopwords ? ' checked' : '') + '> hide stopwords' +
         (hidden ? ' <span style="color:var(--text3)">(' + hidden + ' hidden)</span>' : '') + '</label>';
    h += '</div>';

    if (!rows.length){
      h += '<div class="cell-empty">No probes to show' +
           (paHideStopwords ? ' (all filtered as stopwords).' : '.') + '</div>';
      panel.innerHTML = h;
      wirePA();
      return;
    }

    h += '<div class="probe-table-wrap"><table class="tok probe-table"><thead><tr>';
    h += '<th class="num" style="width:38px">#</th><th>Term</th>';
    h += '<th class="num">|response|</th><th class="num">response</th><th>Direction</th>';
    h += '</tr></thead><tbody>';
    for (var r=0; r<rows.length; r++){
      var row = rows[r];
      var c = (row.dir === "aligned") ? "var(--aligned)"
            : (row.dir === "anti-aligned") ? "var(--anti-aligned)" : "var(--text3)";
      h += '<tr>';
      h += '<td class="num" style="color:var(--text3)">' + (r + 1) + '</td>';
      h += '<td style="color:var(--text)">' + esc(row.text) +
           (row.sw ? ' <span style="color:var(--text3);font-size:10px">·stop</span>' : '') + '</td>';
      h += '<td class="num" style="color:var(--text)">' + row.meanAbs.toFixed(4) + '</td>';
      h += '<td class="num" style="color:' + c + '">' + (row.meanSigned >= 0 ? '+' : '') + row.meanSigned.toFixed(4) + '</td>';
      h += '<td style="color:' + c + '">' + row.dir + '</td>';
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    panel.innerHTML = h;
    wirePA();
  }

  function wirePA(){
    var sw = document.getElementById("pa-sw");
    if (sw) sw.addEventListener("change", function(e){
      paHideStopwords = e.target.checked; renderProbeActivity();
    });
    var clr = document.getElementById("pa-clear");
    if (clr) clr.addEventListener("click", function(e){
      e.preventDefault();
      selCell = null;
      var prev = document.querySelectorAll("td.cell.sel");
      for (var j=0; j<prev.length; j++) prev[j].classList.remove("sel");
      renderProbeActivity();
      renderCellPanel();
    });
  }

  // ── Cell composition tab ───────────────────────────────────
  function renderCellPanel(){
    var panel = document.getElementById("tab-cell");
    if (!selCell){
      panel.innerHTML = '<div class="cell-empty">Click any cell in the heatmap to inspect its probes.</div>';
      cpRows = []; return;
    }
    var cell = CELLS[selCell];
    if (!cell){
      panel.innerHTML = '<div class="cell-empty">No data for cell ' + esc(selCell) + '.</div>';
      cpRows = []; return;
    }

    var parts = selCell.split("_");
    var si = parseInt(parts[0], 10);
    var li = parseInt(parts[1], 10);
    var subj = SUBJ[si] || ("subject " + si);
    var lvl = LEVELS[li] || ("level " + li);

    // Scope: single prompt, a class (mean over that class's prompts), or
    // global. For single/class we recompute each probe's response from
    // per_prompt_response so the table matches the heatmap's scope.
    var probes = (cell.probes || []).map(function(p){ return Object.assign({}, p); });
    var displayedCellValue = cell.cell_value || 0;
    var scopeLabel = "session aggregate";
    var scopeIdxs = null;
    if (selPrompt !== "all"){ scopeIdxs = [parseInt(selPrompt)]; }
    else if (selClass){ scopeIdxs = scopePrompts().map(function(p){ return p.idx; }); }

    if (scopeIdxs && scopeIdxs.length){
      var ppr = (DECOMP[PRIMARY] && DECOMP[PRIMARY].per_prompt_response) || null;
      if (ppr){
        var thresh = scopeThreshold(scopeIdxs);
        var nE = 0, nO = 0, nN = 0, vmin = Infinity, vmax = -Infinity, vals = [];
        probes = probes.map(function(p){
          var sum = 0, cnt = 0;
          for (var z=0; z<scopeIdxs.length; z++){
            var rr = ppr[scopeIdxs[z]];
            if (rr){ sum += (rr[p.probe_idx] || 0); cnt++; }
          }
          var vv = cnt ? (sum / cnt) : 0;
          var dir = (vv > thresh) ? "aligned" : (vv < -thresh) ? "anti-aligned" : "orthogonal";
          if (vv > thresh) nE++; else if (vv < -thresh) nO++; else nN++;
          if (vv < vmin) vmin = vv;
          if (vv > vmax) vmax = vv;
          vals.push(vv);
          return Object.assign({}, p, { response: vv, direction: dir });
        });
        var sgrid = gridForPromptSet(view, PRIMARY, scopeIdxs);
        displayedCellValue = (sgrid[si] && sgrid[si][li] != null) ? sgrid[si][li] : 0;
        if (scopeIdxs.length === 1){
          var pInfo = PROMPTS[scopeIdxs[0]];
          scopeLabel = "prompt #" + (scopeIdxs[0] + 1) +
            (pInfo ? " [" + (CAT_NAMES[pInfo.category] || pInfo.category) + "]" : "");
        } else {
          scopeLabel = "class: " + (CAT_NAMES[selClass] || selClass) + " · " + scopeIdxs.length + " prompts";
        }
        cell = Object.assign({}, cell, {
          n_aligned: nE, n_anti_aligned: nO, n_orthogonal: nN,
          probe_response_min: (probes.length ? vmin : 0),
          probe_response_max: (probes.length ? vmax : 0),
          probe_response_median: (function(){
            if (!vals.length) return 0;
            var s = vals.slice().sort(function(a,b){return a-b;});
            var m = Math.floor(s.length/2);
            return (s.length % 2) ? s[m] : 0.5*(s[m-1]+s[m]);
          })(),
        });
      }
    }
    sortProbes(probes);

    var scopeKey = selCell + "|" + selPrompt + "|" + selClass + "|" + view;
    if (scopeKey !== cpLastKey){ cpPage = 1; cpLastKey = scopeKey; }

    cpRows = probes; cpSubj = subj; cpLvl = lvl;

    var nP = probes.length;
    var pages = Math.max(1, Math.ceil(nP / cpPageSize));
    if (cpPage > pages) cpPage = pages;
    if (cpPage < 1) cpPage = 1;
    var start = cpPrintAll ? 0 : (cpPage - 1) * cpPageSize;
    var end   = cpPrintAll ? nP : Math.min(nP, start + cpPageSize);
    var pageProbes = probes.slice(start, end);

    var v = displayedCellValue;
    var html = '<div class="cell-info">';
    html += '<div style="margin-bottom:8px"><b>' + esc(subj.replace(/_/g, " ")) +
            '</b> / <b>' + esc(lvl) + '</b> · ';
    html += 'cell value <span style="color:' +
            (v > 0 ? 'var(--aligned)' : v < 0 ? 'var(--anti-aligned)' : 'var(--text2)') +
            ';font-weight:600">' + (v >= 0 ? '+' : '') + v.toFixed(4) + '</span>';
    html += ' <span style="color:var(--text3)">(' + esc(scopeLabel) + ')</span></div>';
    html += 'Probes: <b>' + (cell.n_probes || 0) + '</b> active';
    if (cell.n_probes_degenerate){
      html += ' <span style="color:var(--text3)">(' + cell.n_probes_degenerate + ' degenerate filtered)</span>';
    }
    html += ' · <span style="color:var(--aligned)">' + (cell.n_aligned || 0) + ' aligned</span>';
    html += ' · <span style="color:var(--anti-aligned)">' + (cell.n_anti_aligned || 0) + ' anti-aligned</span>';
    html += ' · <span style="color:var(--text3)">' + (cell.n_orthogonal || 0) + ' orthogonal</span>';
    html += '<br>response range [' + (cell.probe_response_min || 0).toFixed(4) +
            ', ' + (cell.probe_response_max || 0).toFixed(4) + ']';
    html += ' · median ' + (cell.probe_response_median || 0).toFixed(4);
    if (selPrompt === "all" && !selClass){ html += ' · variance ' + (cell.cell_variance || 0).toFixed(6); }
    html += '</div>';

    if (!cpPrintAll){
      html += '<div class="probe-toolbar" style="justify-content:flex-end">';
      html += '<label class="pagesize-lbl">Rows <select id="cpPageSize" class="pagesize">';
      [10,25,50,100].forEach(function(s){ html += '<option value="'+s+'"'+(cpPageSize===s?' selected':'')+'>'+s+'</option>'; });
      html += '</select></label></div>';
    }

    function arrow(k){ if (sortKey !== k) return ''; return '<span class="sort-arrow">' + (sortDir < 0 ? '▼' : '▲') + '</span>'; }
    html += '<div class="probe-table-wrap"><table class="tok probe-table"><thead><tr>';
    html += '<th class="sortable" data-sort="name">Probe' + arrow("name") + '</th>';
    html += '<th class="sortable num" data-sort="signed">Response' + arrow("signed") + '</th>';
    html += '<th class="sortable num" data-sort="abs">|Response|' + arrow("abs") + '</th>';
    html += '<th>Direction</th>';
    html += '</tr></thead><tbody>';
    for (var pi=0; pi<pageProbes.length; pi++){
      var p = pageProbes[pi];
      var resp = p.response || 0;
      var dir = p.direction || "—";
      var c = (dir === "aligned") ? "var(--aligned)" : (dir === "anti-aligned") ? "var(--anti-aligned)" : "var(--text3)";
      html += '<tr>';
      html += '<td class="ptext-cell" title="' + esc(p.text || ("#" + p.probe_idx)) + '">' + esc(p.text || ("#" + p.probe_idx)) + '</td>';
      html += '<td class="num resp" style="color:' + c + '">' + (resp >= 0 ? '+' : '') + resp.toFixed(4) + '</td>';
      html += '<td class="num absval">' + Math.abs(resp).toFixed(4) + '</td>';
      html += '<td class="dir" style="color:' + c + '">' + esc(dir) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div>';

    if (!cpPrintAll){
      var from = nP ? (start + 1) : 0;
      html += '<div class="probe-pager">';
      html += '<span class="pager-info">' + from + '–' + end + ' of ' + nP + ' probes</span>';
      html += '<div class="pager-btns">';
      html += '<button class="pager-btn" data-pg="prev"' + (cpPage<=1?' disabled':'') + '>‹ Prev</button>';
      html += '<span class="pager-page">page ' + cpPage + ' / ' + pages + '</span>';
      html += '<button class="pager-btn" data-pg="next"' + (cpPage>=pages?' disabled':'') + '>Next ›</button>';
      html += '</div></div>';
    }

    html += '<div class="export-bar"><div class="export-label">Export</div><div class="export-btns">';
    html += '<button class="exp" data-exp="probes">Probes CSV</button>';
    html += '<button class="exp" data-exp="grid">Grid CSV</button>';
    html += '<button class="exp" data-exp="json">Results JSON</button>';
    html += '<a class="exp" href="/api/modules/correction_prism/download_log" target="_blank" rel="noopener">Run log</a>';
    html += '<button class="exp" data-exp="print">Print / PDF</button>';
    html += '</div></div>';

    panel.innerHTML = html;
    if (cpPrintAll) return;

    var headers = panel.querySelectorAll("th.sortable");
    for (var i=0; i<headers.length; i++){
      headers[i].addEventListener("click", function(e){
        var k = e.currentTarget.getAttribute("data-sort");
        if (sortKey === k){ sortDir = -sortDir; } else { sortKey = k; sortDir = (k === "name") ? 1 : -1; }
        cpPage = 1;
        renderCellPanel();
      });
    }
    var psel = document.getElementById("cpPageSize");
    if (psel) psel.addEventListener("change", function(e){ cpPageSize = parseInt(e.target.value); cpPage = 1; renderCellPanel(); });
    var pbtns = panel.querySelectorAll(".pager-btn");
    for (var b=0; b<pbtns.length; b++){
      pbtns[b].addEventListener("click", function(e){
        var d = e.currentTarget.getAttribute("data-pg");
        if (d==="prev") cpPage--; else if (d==="next") cpPage++;
        renderCellPanel();
      });
    }
    var exps = panel.querySelectorAll("button.exp");
    for (var x=0; x<exps.length; x++){
      exps[x].addEventListener("click", function(e){
        var w = e.currentTarget.getAttribute("data-exp");
        if (w==="probes") exportProbesCSV();
        else if (w==="grid") exportGridCSV();
        else if (w==="json") exportJSON();
        else if (w==="print") doPrint();
      });
    }
  }

  function sortProbes(arr){
    arr.sort(function(a, b){
      var av, bv;
      if (sortKey === "abs"){
        av = Math.abs(a.response || 0); bv = Math.abs(b.response || 0);
      } else if (sortKey === "signed"){
        av = a.response || 0; bv = b.response || 0;
      } else {
        av = (a.text || "").toLowerCase(); bv = (b.text || "").toLowerCase();
        if (av < bv) return -1 * sortDir;
        if (av > bv) return  1 * sortDir;
        return 0;
      }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return  1 * sortDir;
      return 0;
    });
  }

  // ── Glossary tab ───────────────────────────────────────────
  function renderGlossary(){
    var panel = document.getElementById("tab-glossary");
    if (panel.dataset.rendered) return;
    panel.dataset.rendered = "1";
    panel.innerHTML =
      '<dl class="glossary">' +

      '<div><dt>Probe basis</dt>' +
      '<dd>The probe lattice acts as a structured basis for decomposing the prompt\'s ' +
      'correction-induced field. Each probe contributes one direction to the basis: ' +
      '<code>Δp_i = p_i^{L_high} − p_i^{L_low}</code>, the L2-normalized difference between the probe\'s ' +
      'embeddings at two depths. The cell value at <i>(subject, level)</i> is the aggregated ' +
      'response of the probes assigned there, so the heatmap reads as "which subject-matter ' +
      'regions of the lattice does the prompt\'s correction-field align with or run against?"</dd></div>' +

      '<div><dt>Beam</dt>' +
      '<dd>The prompt\'s contextualized field, captured by re-forwarding the prompt through ' +
      'the instruct model up to the probe\'s lower depth (<code>L_low</code>) and reducing the ' +
      'resulting <code>T × d_model</code> residual to a single vector. Default reduction is ' +
      '<code>mean</code> across token positions; <code>last</code> takes the final token; ' +
      '<code>rowspace</code> keeps the full subspace (richer for context-mixed prompts).</dd></div>' +

      '<div><dt>Circuit</dt>' +
      '<dd>Which sub-component of the model-side weight delta <code>ΔW</code> the beam is projected ' +
      'through. <code>full</code> is the sum across Q+K+V+O; <code>q/k/v/o</code> isolate a single ' +
      'projection; <code>qk</code> and <code>vo</code> are first-order operators for the routing ' +
      'and content-flow circuits respectively (computed as ' +
      '<code>ΔW_Q · W_K^{instr,T} + W_Q^{base} · ΔW_K^T</code> for QK, and analogously for VO).</dd></div>' +

      '<div><dt>Signed cosine</dt>' +
      '<dd>The default decomposition metric. For each probe, the signed cosine of the angle between ' +
      'its probe-basis direction <code>Δp_i</code> and the beam-through-circuit <code>b · ΔW</code>. ' +
      'Range <code>[−1, +1]</code>. ' +
      '<span style="color:var(--aligned)">Positive</span> = the correction pushed the prompt\'s ' +
      'field along this concept\'s natural depth-trajectory (aligned). ' +
      '<span style="color:var(--anti-aligned)">Negative</span> = the correction pushed against it ' +
      '(anti-aligned). Zero = orthogonal.</dd></div>' +

      '<div><dt>Cell aggregation</dt>' +
      '<dd>How the per-probe responses within a cell collapse to one cell value. ' +
      '<code>sum</code> (default) treats each probe as an independent detector — cells with more ' +
      'probes firing read brighter. <code>mean</code> normalizes by cell size; useful when the lattice ' +
      'has uneven cell counts. <code>median</code> is robust to outlier probes within a cell.</dd></div>' +

      '<div><dt>Baseline (ΔW = I)</dt>' +
      '<dd>Same prompt, same lattice, but with the correction lens replaced by the identity. ' +
      'This shows what the prompt\'s field already looked like in concept-space before fine-tuning ' +
      'had any say. Subtracting <code>baseline</code> from <code>correction</code> isolates the ' +
      'cell-by-cell signal that is uniquely attributable to fine-tuning, with the prompt\'s ' +
      'pre-existing geometry removed.</dd></div>' +

      '<div><dt>Aligned / anti-aligned / orthogonal</dt>' +
      '<dd>Directional labels for individual probes, set by the ' +
      '<b>Directional Threshold</b> parameter. A probe is <span style="color:var(--aligned)">aligned</span> ' +
      'if its response exceeds <code>+band</code>, <span style="color:var(--anti-aligned)">anti-aligned</span> ' +
      'if below <code>−band</code>, and <i>orthogonal</i> if it falls within the band ' +
      '(<code>|response| ≤ band</code>). The band is <code>pct%</code> of the mean <code>|response|</code> ' +
      'over active probes in scope, so it self-calibrates to the run\'s magnitudes instead of using a fixed ' +
      'cutoff. At <code>pct = 0</code> the band collapses to zero — a pure sign classifier where any nonzero ' +
      'response is directional; larger <code>pct</code> widens the orthogonal class. A cell with mixed signs ' +
      'has internal disagreement that the cell value averages over.</dd></div>' +

      '<div><dt>Degenerate probes</dt>' +
      '<dd>Probes whose <code>Δp_i = p_i^{L_high} − p_i^{L_low}</code> has near-zero norm — ' +
      'i.e. the model\'s representation of that concept barely changed between the two cached depths. ' +
      'These probes can\'t serve as a basis direction, so they\'re excluded from the decomposition. The ' +
      'count is reported per-cell.</dd></div>' +

      '<div><dt>L_low / L_high</dt>' +
      '<dd>The two layer fractions at which the probe lattice was embedded (default 0.50 and 0.75). ' +
      'L_low is where the prompt\'s beam is captured (concept-space, before output-prediction). ' +
      'L_high is the further depth used to form the probe-side delta. The pair is recorded in ' +
      '<code>probe_config.json</code> at apply time.</dd></div>' +

      '</dl>';
  }

  // ── Header / parameter readout ─────────────────────────────
  function chip(label, value, opts){
    opts = opts || {};
    var cls = "pchip" + (opts.accent ? " accent" : "") + (opts.warn ? " warn" : "");
    return '<div class="'+cls+'"><span class="k">'+esc(label)+'</span><span class="v">'+esc(value)+'</span></div>';
  }
  function buildHeader(cfg){
    cfg = cfg || {};
    var circ = function(c){ return CIRC_LABELS[c] || c || "—"; };
    var pc = cfg.prompt_circuit, prc = cfg.probe_circuit;
    var grafting = (cfg.grafting != null) ? !!cfg.grafting
        : (pc != null && prc != null && pc !== prc);
    var hasGraftFields = (pc != null || prc != null || cfg.grafting != null);
    var model = cfg.active_probe_model_id || "—";

    var h = '';
    h += '<div class="ph-title">';
    h += '<div class="ph-name">Probe-Basis Decomposition<span class="ph-kicker">Interactive Explorer</span></div>';
    h += '<div class="ph-run"><span class="ph-model" title="Active probe model">'+esc(model)+'</span>';
    if (grafting) h += '<span class="ph-graft" title="Prompt and probe sides projected through different circuits">GRAFTED</span>';
    h += '</div></div>';

    h += '<div class="ph-groups">';
    h += '<div class="ph-group"><div class="ph-glabel">Lattice</div><div class="ph-chips">';
    h += chip("subjects × levels", SUBJ.length + " × " + LEVELS.length);
    h += chip("prompts", (D.n_prompts_projected||0) + (D.n_prompts ? " / "+D.n_prompts : ""));
    h += chip("probes active", (D.n_probes_active||0) + " / " + (D.n_probes||0));
    if (cfg.n_probes_degenerate != null)
      h += chip("degenerate", String(cfg.n_probes_degenerate), {warn: cfg.n_probes_degenerate>0});
    h += '</div></div>';

    h += '<div class="ph-group"><div class="ph-glabel">Circuit geometry</div><div class="ph-chips">';
    h += chip("circuit", circ(cfg.circuit || PRIMARY), {accent:true});
    if (hasGraftFields){
      h += chip("prompt circuit", pc!=null ? circ(pc) : "(same)", {accent:grafting});
      h += chip("probe circuit",  prc!=null ? circ(prc) : "(same)", {accent:grafting});
    }
    h += chip("decomposition metric", cfg.prism_metric || "signed_cosine");
    if (cfg.L_low != null || cfg.L_high != null)
      h += chip("L_low / L_high", (cfg.L_low!=null?cfg.L_low:"—") + " / " + (cfg.L_high!=null?cfg.L_high:"—"));
    h += '</div></div>';

    h += '<div class="ph-group"><div class="ph-glabel">Reduction &amp; aggregation</div><div class="ph-chips">';
    h += chip("beam", cfg.beam_reduction || "mean");
    h += chip("layer agg", cfg.layer_aggregation || "mean");
    h += chip("cell agg", cfg.cell_aggregation || "sum");
    h += chip("prompt agg", cfg.prompt_aggregation || "mean");
    h += chip("baseline", cfg.include_baseline ? "included" : "off", {accent: !!cfg.include_baseline});
    h += '</div></div></div>';

    var prov = [];
    if (cfg.model_dim != null) prov.push(["model dim", String(cfg.model_dim)]);
    if (cfg.n_signal_layers != null) prov.push(["signal layers", String(cfg.n_signal_layers)]);
    if (D.probe_file) prov.push(["probe file", D.probe_file]);
    if (cfg.probe_cache_used){
      if (cfg.probe_cache_used.L_low)  prov.push(["cache L_low", cfg.probe_cache_used.L_low]);
      if (cfg.probe_cache_used.L_high) prov.push(["cache L_high", cfg.probe_cache_used.L_high]);
    }
    if (D.version) prov.push(["module version", String(D.version)]);
    if (prov.length){
      h += '<details class="ph-prov"><summary>Run provenance</summary><div class="ph-provgrid">';
      prov.forEach(function(p){ h += '<div class="ppk">'+esc(p[0])+'</div><div class="ppv">'+esc(p[1])+'</div>'; });
      h += '</div></details>';
    }
    document.getElementById("prism-header").innerHTML = h;
  }

  // ── Cell-table pagination state + module exports ───────────
  // These drive the existing selection-driven probe table only.
  var cpPage = 1, cpPageSize = 25, cpPrintAll = false, cpLastKey = null;
  var cpRows = [], cpSubj = "", cpLvl = "";

  function csvCell(v){ v = String(v==null?"":v); if (/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }
  function downloadBlob(name, text, mime){
    var blob = new Blob([text], {type: mime||"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }
  function scopeTag(){
    if (selPrompt !== "all") return "prompt"+(parseInt(selPrompt)+1);
    if (selClass) return "class_"+selClass;
    return "aggregate";
  }
  // Prompts in scope for the current class filter (null class = all).
  function scopePrompts(){
    var fps = projectedPrompts();
    if (selClass){ fps = fps.filter(function(p){ return p.category === selClass; }); }
    return fps;
  }
  // Mean of per-prompt view-grids over a set of prompt indices.
  function gridForPromptSet(view, circuit, idxs){
    if (!idxs || !idxs.length) return [];
    if (idxs.length === 1) return gridForPrompt(view, circuit, idxs[0]);
    var acc = null, n = 0;
    for (var k=0; k<idxs.length; k++){
      var g = gridForPrompt(view, circuit, idxs[k]);
      if (!g || !g.length) continue;
      if (!acc){ acc = g.map(function(r){ return r.slice(); }); }
      else {
        for (var si=0; si<g.length; si++)
          for (var li=0; li<(g[si]||[]).length; li++)
            acc[si][li] += (g[si][li] || 0);
      }
      n++;
    }
    if (!acc || !n) return [];
    for (var a=0; a<acc.length; a++)
      for (var b=0; b<acc[a].length; b++)
        acc[a][b] /= n;
    return acc;
  }
  function exportProbesCSV(){
    if (!cpRows.length) return;  // full selected-cell set for the current scope, not just the visible page
    var out = ["probe_idx,probe_text,subject,level,response,abs_response,direction"];
    cpRows.forEach(function(r){
      out.push([r.probe_idx, csvCell(r.text), csvCell(cpSubj), csvCell(cpLvl),
                (r.response||0).toFixed(6), Math.abs(r.response||0).toFixed(6), (r.direction||"")].join(","));
    });
    downloadBlob("probe_basis_decomp_cell_"+(selCell||"")+"_"+scopeTag()+".csv", out.join("\n"), "text/csv");
  }
  function exportGridCSV(){
    var grid = gridFor(view);
    var out = [["subject"].concat(LEVELS).map(csvCell).join(",")];
    for (var si=0; si<SUBJ.length; si++){
      var rrow = [csvCell(SUBJ[si])];
      for (var li=0; li<LEVELS.length; li++){
        var x = (grid[si] && grid[si][li]!=null) ? grid[si][li] : 0;
        rrow.push(x.toFixed(6));
      }
      out.push(rrow.join(","));
    }
    var tag = (view==="baseline"?"baseline":view==="diff"?"diff":"correction")+"_"+scopeTag();
    downloadBlob("probe_basis_decomp_grid_"+tag+".csv", out.join("\n"), "text/csv");
  }
  function exportJSON(){ downloadBlob("probe_basis_decomp_results.json", JSON.stringify(D, null, 2), "application/json"); }

  // Expand the full selected-cell probe list for printing, then restore.
  function doPrint(){ var prev = cpPrintAll; cpPrintAll = true; renderCellPanel(); window.print(); cpPrintAll = prev; renderCellPanel(); }
  window.addEventListener("beforeprint", function(){ if (selCell && !cpPrintAll){ cpPrintAll = true; renderCellPanel(); } });
  window.addEventListener("afterprint",  function(){ if (cpPrintAll){ cpPrintAll = false; renderCellPanel(); } });

})();
</script>
