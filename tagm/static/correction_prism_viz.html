<!DOCTYPE html>
<html>
<head>
<title>Correction Prism — TAGM</title>
<style>
:root{--bg:#1C2128;--bg2:#262C34;--text:#E8ECEF;--text2:#6B7280;--text3:#5A6068;--border:#444C56;--red:#DC3025;--blue:#268BD2;--cyan:#56B4E9;--orange:#E69F00;--mono:"IBM Plex Mono",ui-monospace,monospace;--excited:#ff6060;--opposed:#6090ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;padding:16px}
h2{font-size:14px;font-weight:600;margin-bottom:4px}
h3{font-size:12px;font-weight:600;color:var(--cyan);margin-bottom:6px}
.sub{font-size:11px;color:var(--text2);margin-bottom:12px}
.viewbar{display:flex;gap:6px;margin-bottom:8px;font-size:11px}
.viewbar button{padding:4px 12px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:3px;cursor:pointer;font-family:var(--mono)}
.viewbar button.active{background:var(--cyan);color:#000;border-color:var(--cyan)}
.viewbar button:hover:not(.active){background:#2D333B}
.promptbar{display:flex;gap:6px;margin-bottom:10px;font-size:11px;align-items:center;flex-wrap:wrap}
.promptbar label{color:var(--text2)}
.promptbar select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:3px 8px;font-family:var(--mono);font-size:11px;max-width:380px}
.promptbar button{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:2px 8px;cursor:pointer;font-family:var(--mono);font-size:11px}
.promptbar button:hover{background:#2D333B}
.promptbar button.playing{color:var(--orange)}
.promptbar .counter{font-size:10px;color:var(--text2);min-width:60px;font-variant-numeric:tabular-nums}
.prompt-text{padding:10px 12px;margin-bottom:10px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-size:11px;line-height:1.5;display:none}
.prompt-text.active{display:block}
.prompt-text .pmeta{color:var(--text2);font-size:10px;margin-bottom:4px}
.prompt-text .pmeta .cat{display:inline-block;padding:1px 6px;border-radius:2px;color:#000;font-weight:600;margin-right:6px}
.prompt-text .ptext{color:var(--text);white-space:pre-wrap;word-break:break-word}
.heatmap-wrap{margin-bottom:16px}
table.hm{border-collapse:collapse;font-size:11px}
table.hm th,table.hm td{padding:7px 12px;text-align:center;border:1px solid #2D333B;font-variant-numeric:tabular-nums}
table.hm th{color:var(--text2);font-weight:500;background:var(--bg2)}
table.hm td.cell{cursor:pointer;transition:outline .1s}
table.hm td.cell:hover{outline:1px solid #888;outline-offset:-1px}
table.hm td.cell.sel{outline:2px solid var(--cyan);outline-offset:-2px;z-index:1;position:relative}
.legend{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:10px;color:var(--text2);max-width:380px}
.legend .bar{display:flex;height:10px;flex:1;border-radius:2px;overflow:hidden}
.legend .lbl{white-space:nowrap}
.tabs{display:flex;gap:0;margin-bottom:0;border-bottom:1px solid var(--border)}
.tabs button{padding:8px 16px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--mono);font-size:12px}
.tabs button.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tabs button:hover:not(.active){color:var(--text)}
.tab-panel{padding:16px 0;display:none}
.tab-panel.active{display:block}
.decomp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.decomp-tile{padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:4px}
.decomp-tile .label{font-size:11px;font-weight:600;color:var(--cyan);margin-bottom:6px}
.decomp-tile.baseline .label{color:var(--text2)}
.decomp-tile table.hm{margin-bottom:6px}
.decomp-tile table.hm th,.decomp-tile table.hm td{padding:4px 7px;font-size:10px}
.decomp-tile .mini-legend{font-size:9px;color:var(--text3);margin-top:4px}
table.tok{width:100%;border-collapse:collapse;font-size:11px}
table.tok th{text-align:left;color:var(--text2);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;cursor:pointer;user-select:none}
table.tok th.sortable:hover{color:var(--text)}
table.tok th .sort-arrow{display:inline-block;margin-left:4px;color:var(--cyan);width:8px}
table.tok td{padding:5px 10px;border-bottom:1px solid #2D333B}
table.tok tr:hover{background:#ffffff08}
.cell-info{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.7}
.cell-info b{color:var(--text);font-weight:600}
.cell-empty{color:var(--text3);font-style:italic;padding:24px;text-align:center;background:var(--bg2);border:1px dashed var(--border);border-radius:4px}
.glossary{display:flex;flex-direction:column;gap:14px;max-width:760px}
.glossary dt{font-weight:600;color:var(--cyan);font-size:12px;margin-bottom:3px}
.glossary dd{font-size:11px;color:var(--text2);line-height:1.6;margin-left:0}
.glossary dd code{background:var(--bg2);padding:1px 5px;border-radius:2px;color:var(--text);font-size:10px}
#err{color:var(--red);padding:10px;white-space:pre-wrap;background:var(--bg2);border-radius:4px;margin-top:8px}
.empty{color:var(--text2);font-style:italic;padding:20px;text-align:center}
</style>
</head>
<body>
<h2>Correction Prism — Interactive Explorer</h2>
<div class="sub" id="subtitle">Loading...</div>

<div class="viewbar" id="viewbar"></div>
<div class="promptbar" id="promptbar"></div>
<div class="legend" id="legend"></div>
<div class="prompt-text" id="prompt-text"></div>
<div class="heatmap-wrap" id="heatmap"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="decomp">Circuit Decomposition</button>
  <button class="tab-btn" data-tab="cell">Cell Composition</button>
  <button class="tab-btn" data-tab="glossary">Glossary</button>
</div>

<div class="tab-panel active" id="tab-decomp"></div>
<div class="tab-panel" id="tab-cell"></div>
<div class="tab-panel" id="tab-glossary"></div>

<div id="err"></div>

<script>
(function(){
  // ── State ──────────────────────────────────────────────────
  var D = null;            // results JSON
  var SUBJ = [], LEVELS = [], SUBJ_SHORT = [];
  var CELLS = {};          // cell_details
  var DECOMP = {};         // per-circuit decomposition
  var CIRC_ORDER = [];     // ordered circuit keys
  var CIRC_LABELS = {};
  var PRIMARY = "full";
  var HAS_BASELINE = false;

  var view = "primary";    // primary | baseline | diff
  var selCell = null;      // "si_li"
  var sortKey = "abs";     // "abs" | "signed" | "name"
  var sortDir = -1;        // -1 desc, +1 asc

  // Slideshow state — analogous to the backscatter popout.
  // selPrompt = "all" shows the session-aggregated heatmap (default).
  // selPrompt = "<idx>" shows that one prompt's per-cell response.
  var selPrompt = "all";
  var slideTimer = null, slideSpeed = 2000, slidePlaying = false;
  var PROMPTS = [];        // [{idx, category, text, projected}, ...]
  var CAT_NAMES = {};      // { "h": "harmful", ... }
  var CELL_AGG = "sum";    // matches module's cell_aggregation config
  var PROBE_CELL_MAP = {}; // { "si_li": [probe_idx, probe_idx, ...] }

  // ── Boot ───────────────────────────────────────────────────
  function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}

  fetch("/api/modules/correction_prism/results")
    .then(function(r){return r.json()})
    .then(function(resp){
      if(!resp.ok || !resp.results) throw new Error(resp.error || "No results");
      D = resp.results;
      init();
    })
    .catch(function(e){
      document.getElementById("err").textContent = "Failed to load: " + e.message;
    });

  function init(){
    SUBJ = D.subjects || [];
    LEVELS = D.levels || [];
    SUBJ_SHORT = D.subj_short || SUBJ;
    CELLS = D.cell_details || {};
    DECOMP = D.decomposition || {};
    CIRC_ORDER = D.circuit_order || [];
    CIRC_LABELS = D.circuit_labels || {};
    PRIMARY = D.primary_circuit || "full";
    HAS_BASELINE = !!(DECOMP._baseline && DECOMP._baseline.aggregate);
    PROMPTS = D.prompts || [];
    CAT_NAMES = D.categories || {};
    CELL_AGG = (D.config || {}).cell_aggregation || "sum";

    // Build the cell → [probe_idx, ...] map by reading cell_details.
    // We need this to derive per-prompt cell values from
    // per_prompt_response without re-running the module.
    PROBE_CELL_MAP = {};
    Object.keys(CELLS).forEach(function(k){
      var probes = (CELLS[k] && CELLS[k].probes) || [];
      PROBE_CELL_MAP[k] = probes.map(function(p){ return p.probe_idx; });
    });

    var cfg = D.config || {};
    document.getElementById("subtitle").textContent =
      SUBJ.length + " subjects × " + LEVELS.length + " levels · " +
      (D.n_prompts_projected || 0) + " prompts · " +
      (D.n_probes_active || 0) + "/" + (D.n_probes || 0) + " probes active · " +
      "primary " + (CIRC_LABELS[PRIMARY] || PRIMARY) + " · " +
      (cfg.beam_reduction || "mean") + " beam · " +
      (cfg.cell_aggregation || "sum") + " cell agg" +
      (cfg.active_probe_model_id ? " · " + cfg.active_probe_model_id : "");

    buildViewbar();
    buildPromptbar();
    buildTabs();
    render();
  }

  // ── View bar (Correction / Baseline / Diff) ────────────────
  function buildViewbar(){
    var bar = document.getElementById("viewbar");
    if (!HAS_BASELINE){
      bar.innerHTML = '<div style="color:var(--text2);font-size:11px;font-style:italic">Baseline not computed (enable "Include Baseline" in module parameters to access view toggle)</div>';
      return;
    }
    function btn(v, label){
      var active = (view === v) ? " active" : "";
      return '<button class="vb' + active + '" data-v="' + v + '">' + esc(label) + '</button>';
    }
    bar.innerHTML =
      btn("primary", "Correction") +
      btn("baseline", "Baseline (ΔW = I)") +
      btn("diff", "Correction − Baseline");
    var btns = bar.querySelectorAll("button");
    for (var i=0; i<btns.length; i++){
      btns[i].addEventListener("click", function(e){
        view = e.currentTarget.getAttribute("data-v");
        stopSlideshow();
        buildViewbar();
        render();
      });
    }
  }

  // ── Prompt picker + slideshow controls ─────────────────────
  // Mirrors the backscatter popout's slideshow convention: dropdown to
  // pick a specific prompt or "All", with prev/play/next buttons and a
  // speed selector. Selecting a prompt switches the heatmap to that
  // prompt's per-cell response derived from per_prompt_response.
  var CAT_COLORS = {b:"#009E73",m:"#E69F00",h:"#D55E00",j:"#56B4E9",a:"#882255",d:"#4ade80",u:"#888"};

  function projectedPrompts(){
    return PROMPTS.filter(function(p){ return p.projected; });
  }

  function buildPromptbar(){
    var bar = document.getElementById("promptbar");
    var fps = projectedPrompts();
    if (!fps.length){
      bar.innerHTML = '';
      return;
    }
    var html = '<label>Prompt:</label><select id="promptSel">';
    html += '<option value="all"' + (selPrompt === "all" ? ' selected' : '') +
            '>All (' + fps.length + ' prompts, session aggregate)</option>';
    fps.forEach(function(p){
      var lbl = '#' + (p.idx + 1) + ' [' + (CAT_NAMES[p.category] || p.category) +
                '] ' + (p.text || '');
      if (lbl.length > 90) lbl = lbl.slice(0, 90) + '…';
      html += '<option value="' + p.idx + '"' +
              (selPrompt == String(p.idx) ? ' selected' : '') +
              '>' + esc(lbl) + '</option>';
    });
    html += '</select>';

    html += '<button id="prevBtn" title="Previous prompt">◀</button>';
    html += '<button id="playBtn" class="' + (slidePlaying ? 'playing' : '') +
            '" title="Play/pause slideshow">' +
            (slidePlaying ? '⏸ Pause' : '▶ Play') + '</button>';
    html += '<button id="nextBtn" title="Next prompt">▶</button>';
    html += '<label style="margin-left:4px">Speed:</label>';
    html += '<select id="speedSel">';
    [["500","0.5s"],["1000","1s"],["2000","2s"],["3000","3s"],["5000","5s"]].forEach(function(s){
      html += '<option value="' + s[0] + '"' +
              (slideSpeed == parseInt(s[0]) ? ' selected' : '') +
              '>' + s[1] + '</option>';
    });
    html += '</select>';
    html += '<span id="slideCounter" class="counter"></span>';

    bar.innerHTML = html;

    document.getElementById("promptSel").addEventListener("change", function(e){
      selPrompt = e.currentTarget.value;
      stopSlideshow();
      render();
    });
    document.getElementById("prevBtn").addEventListener("click", function(){
      stopSlideshow();
      advanceSlide(-1);
    });
    document.getElementById("nextBtn").addEventListener("click", function(){
      stopSlideshow();
      advanceSlide(1);
    });
    document.getElementById("playBtn").addEventListener("click", playPause);
    document.getElementById("speedSel").addEventListener("change", function(e){
      slideSpeed = parseInt(e.currentTarget.value);
      if (slidePlaying){ stopSlideshow(); playPause(); }
    });

    updateSlideCounter();
  }

  function updateSlideCounter(){
    var el = document.getElementById("slideCounter");
    if (!el) return;
    if (selPrompt === "all"){ el.textContent = ""; return; }
    var fps = projectedPrompts();
    var pi = parseInt(selPrompt);
    var idx = -1;
    for (var i=0; i<fps.length; i++){
      if (fps[i].idx === pi){ idx = i; break; }
    }
    el.textContent = (idx >= 0) ? ((idx + 1) + "/" + fps.length) : "";
  }

  function stopSlideshow(){
    slidePlaying = false;
    if (slideTimer){ clearInterval(slideTimer); slideTimer = null; }
    var btn = document.getElementById("playBtn");
    if (btn){ btn.textContent = "▶ Play"; btn.classList.remove("playing"); }
  }

  function advanceSlide(dir){
    var fps = projectedPrompts();
    if (!fps.length) return;
    var curIdx = -1;
    if (selPrompt !== "all"){
      var pi = parseInt(selPrompt);
      for (var i=0; i<fps.length; i++){
        if (fps[i].idx === pi){ curIdx = i; break; }
      }
    }
    var nextIdx = curIdx + dir;
    if (nextIdx < 0) nextIdx = fps.length - 1;
    if (nextIdx >= fps.length) nextIdx = 0;
    selPrompt = String(fps[nextIdx].idx);
    buildPromptbar();
    render();
  }

  function playPause(){
    if (slidePlaying){ stopSlideshow(); return; }
    slidePlaying = true;
    var btn = document.getElementById("playBtn");
    if (btn){ btn.textContent = "⏸ Pause"; btn.classList.add("playing"); }
    if (selPrompt === "all") advanceSlide(1);
    slideTimer = setInterval(function(){ advanceSlide(1); }, slideSpeed);
  }

  // ── Prompt-text panel ──────────────────────────────────────
  // Visible only when a single prompt is selected. Shows the prompt
  // that's casting the beam right now, with category coloring matching
  // the backscatter popout's convention.
  function renderPromptText(){
    var el = document.getElementById("prompt-text");
    if (selPrompt === "all"){
      el.classList.remove("active");
      el.innerHTML = "";
      return;
    }
    var pi = parseInt(selPrompt);
    var p = PROMPTS[pi];
    if (!p){
      el.classList.remove("active");
      el.innerHTML = "";
      return;
    }
    var catColor = CAT_COLORS[p.category] || "#888";
    var catName = CAT_NAMES[p.category] || p.category || "—";
    var html = '<div class="pmeta">';
    html += '<span class="cat" style="background:' + catColor + '">' +
            esc(catName) + '</span>';
    html += 'Prompt #' + (p.idx + 1);
    html += '</div>';
    html += '<div class="ptext">' + esc(p.text || "") + '</div>';
    el.innerHTML = html;
    el.classList.add("active");
  }

  // ── Per-prompt grid derivation ─────────────────────────────
  // For a single prompt, the cell value is the aggregation of the
  // per-probe responses for the probes assigned to that cell. Cell
  // aggregation mode (sum / mean / median) matches the module config
  // so per-prompt views are directly comparable to the session
  // aggregate.
  function aggregate(values){
    if (!values.length) return 0;
    if (CELL_AGG === "mean"){
      var s = 0;
      for (var i=0; i<values.length; i++) s += values[i];
      return s / values.length;
    }
    if (CELL_AGG === "median"){
      var sorted = values.slice().sort(function(a,b){ return a-b; });
      var m = Math.floor(sorted.length / 2);
      return (sorted.length % 2) ? sorted[m] : 0.5 * (sorted[m-1] + sorted[m]);
    }
    // sum (default)
    var t = 0;
    for (var j=0; j<values.length; j++) t += values[j];
    return t;
  }

  function gridForPrompt(view, circuit, promptIdx){
    circuit = circuit || PRIMARY;
    function gridFromCircuit(ck){
      var ppr = (DECOMP[ck] && DECOMP[ck].per_prompt_response) || null;
      if (!ppr || !ppr[promptIdx]) return null;
      var probeResps = ppr[promptIdx];
      var grid = [];
      for (var si=0; si<SUBJ.length; si++){
        var row = [];
        for (var li=0; li<LEVELS.length; li++){
          var key = si + "_" + li;
          var probeIdxs = PROBE_CELL_MAP[key] || [];
          var vals = probeIdxs.map(function(pi){ return probeResps[pi] || 0; });
          row.push(aggregate(vals));
        }
        grid.push(row);
      }
      return grid;
    }
    if (view === "baseline" && HAS_BASELINE){
      return gridFromCircuit("_baseline");
    }
    if (view === "diff" && HAS_BASELINE){
      var p = gridFromCircuit(circuit);
      var b = gridFromCircuit("_baseline");
      if (!p || !b) return p || b || [];
      var out = [];
      for (var si=0; si<p.length; si++){
        var row = [];
        for (var li=0; li<(p[si]||[]).length; li++){
          row.push((p[si][li] || 0) - ((b[si] || [])[li] || 0));
        }
        out.push(row);
      }
      return out;
    }
    return gridFromCircuit(circuit) || [];
  }

  function buildTabs(){
    var btns = document.querySelectorAll(".tab-btn");
    for (var i=0; i<btns.length; i++){
      btns[i].addEventListener("click", function(e){
        var tab = e.currentTarget.getAttribute("data-tab");
        var all = document.querySelectorAll(".tab-btn");
        for (var j=0; j<all.length; j++) all[j].classList.remove("active");
        e.currentTarget.classList.add("active");
        var panels = document.querySelectorAll(".tab-panel");
        for (var k=0; k<panels.length; k++) panels[k].classList.remove("active");
        document.getElementById("tab-" + tab).classList.add("active");
      });
    }
  }

  // ── Diverging colormap ─────────────────────────────────────
  function scale(grid){
    var vmax = 0;
    for (var si=0; si<grid.length; si++){
      var row = grid[si] || [];
      for (var li=0; li<row.length; li++){
        var a = Math.abs(row[li] || 0);
        if (a > vmax) vmax = a;
      }
    }
    if (vmax < 1e-10) vmax = 1e-10;
    return {vmax: vmax};
  }
  function color(val, sc){
    var t = Math.max(-1, Math.min(1, val / sc.vmax));
    if (t > 0){
      return 'rgb(' + Math.round(30 + t*200) + ',' +
                      Math.round(30 + t*30)  + ',' +
                      Math.round(36 + t*20)  + ')';
    }
    if (t < 0){
      var s = -t;
      return 'rgb(' + Math.round(30 + s*30)  + ',' +
                      Math.round(30 + s*80)  + ',' +
                      Math.round(36 + s*200) + ')';
    }
    return 'rgb(30,30,36)';
  }
  function textColor(val, sc){
    return (Math.abs(val) / sc.vmax) > 0.45 ? '#fff' : 'var(--text2)';
  }

  // ── Grid for current view ──────────────────────────────────
  // Routes to per-prompt derivation when a single prompt is selected.
  function gridFor(view, circuit){
    circuit = circuit || PRIMARY;
    if (selPrompt !== "all"){
      return gridForPrompt(view, circuit, parseInt(selPrompt));
    }
    var prim = (DECOMP[circuit] && DECOMP[circuit].aggregate) || [];
    if (view === "baseline" && HAS_BASELINE){
      return DECOMP._baseline.aggregate;
    }
    if (view === "diff" && HAS_BASELINE){
      var b = DECOMP._baseline.aggregate;
      var out = [];
      for (var si=0; si<prim.length; si++){
        var row = [];
        for (var li=0; li<(prim[si]||[]).length; li++){
          row.push((prim[si][li] || 0) - ((b[si] || [])[li] || 0));
        }
        out.push(row);
      }
      return out;
    }
    return prim;
  }

  // ── Heatmap renderer ───────────────────────────────────────
  // makeCellId: function(si,li) -> id string, or null for non-clickable
  function renderHeatmap(grid, sc, makeCellId, digits){
    digits = (digits == null) ? 3 : digits;
    var html = '<table class="hm"><tr><th></th>';
    for (var li=0; li<LEVELS.length; li++){
      html += '<th>' + esc(LEVELS[li]) + '</th>';
    }
    html += '</tr>';
    for (var si=0; si<SUBJ.length; si++){
      html += '<tr><th>' + esc(SUBJ_SHORT[si] || SUBJ[si]) + '</th>';
      for (var li2=0; li2<LEVELS.length; li2++){
        var v = (grid[si] && grid[si][li2] != null) ? grid[si][li2] : 0;
        var id = makeCellId ? makeCellId(si, li2) : null;
        var cls = id ? "cell" : "";
        if (id && id === selCell) cls += " sel";
        var attrs = id ? ' data-cell="' + id + '"' : '';
        html += '<td class="' + cls + '"' + attrs +
                ' style="background:' + color(v, sc) +
                ';color:' + textColor(v, sc) + '">' +
                (v >= 0 ? '+' : '') + v.toFixed(digits) + '</td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    return html;
  }

  function renderLegendBar(sc, label){
    var stops = '';
    for (var i=0; i<13; i++){
      var v = -sc.vmax + (2 * sc.vmax * i / 12);
      stops += '<div style="flex:1;background:' + color(v, sc) + '"></div>';
    }
    var html = '<span class="lbl">' + esc('−' + sc.vmax.toFixed(3)) + ' opposed</span>';
    html += '<div class="bar">' + stops + '</div>';
    html += '<span class="lbl">+' + sc.vmax.toFixed(3) + ' excited</span>';
    if (label) html += '<span class="lbl" style="margin-left:12px;color:var(--text3)">' + esc(label) + '</span>';
    return html;
  }

  function bindCellClicks(rootEl){
    var cells = rootEl.querySelectorAll("td.cell[data-cell]");
    for (var i=0; i<cells.length; i++){
      cells[i].addEventListener("click", function(e){
        var id = e.currentTarget.getAttribute("data-cell");
        selCell = id;
        renderCellPanel();
        // Highlight on whichever heatmap is showing
        var prev = document.querySelectorAll("td.cell.sel");
        for (var j=0; j<prev.length; j++) prev[j].classList.remove("sel");
        e.currentTarget.classList.add("sel");
        // Switch to the Cell tab so the user sees the result
        var cellBtn = document.querySelector('.tab-btn[data-tab="cell"]');
        if (cellBtn) cellBtn.click();
      });
    }
  }

  // ── Top render ─────────────────────────────────────────────
  function render(){
    var grid = gridFor(view);
    var sc = scale(grid);

    // Legend
    var label = (view === "baseline") ? "no correction lens"
              : (view === "diff") ? "correction-induced response"
              : (CIRC_LABELS[PRIMARY] || PRIMARY);
    if (selPrompt !== "all"){
      label += " · single prompt";
    }
    document.getElementById("legend").innerHTML = renderLegendBar(sc, label);

    // Prompt text panel (shows the active prompt; hidden when "All")
    renderPromptText();

    // Main heatmap
    var hm = document.getElementById("heatmap");
    hm.innerHTML = renderHeatmap(grid, sc, function(si, li){ return si + "_" + li; }, 3);
    bindCellClicks(hm);

    // Decomposition tab
    renderDecomp();
    // Cell tab
    renderCellPanel();
    // Glossary tab (static; render once is fine but cheap to redo)
    renderGlossary();
    updateSlideCounter();
  }

  // ── Decomposition tab ──────────────────────────────────────
  function renderDecomp(){
    var panel = document.getElementById("tab-decomp");
    var html = '<div style="font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.6">' +
               'All circuits computed for this run, side-by-side. Each tile uses its own ' +
               'symmetric scale (so weak circuits aren\'t washed out by strong ones). Click a ' +
               'cell in any tile to inspect its probe composition.</div>';

    if (!CIRC_ORDER.length){
      html += '<div class="empty">No circuit decomposition available.</div>';
      panel.innerHTML = html;
      return;
    }

    html += '<div class="decomp-grid">';
    for (var i=0; i<CIRC_ORDER.length; i++){
      var ck = CIRC_ORDER[i];
      var d = DECOMP[ck];
      if (!d) continue;
      // Per-prompt: derive this circuit's grid for the current prompt.
      // Otherwise: session aggregate.
      var dAgg;
      if (selPrompt !== "all"){
        dAgg = gridForPrompt("primary", ck, parseInt(selPrompt));
      } else {
        dAgg = d.aggregate || [];
      }
      var dSc = scale(dAgg);
      var isBaseline = (ck === "_baseline");
      var label = isBaseline ? "Baseline (ΔW = I)" : (CIRC_LABELS[ck] || ck);
      html += '<div class="decomp-tile' + (isBaseline ? ' baseline' : '') + '">';
      html += '<div class="label">' + esc(label) + '</div>';
      html += renderHeatmap(dAgg, dSc, (function(circ){
        return function(si, li){ return si + "_" + li; };
      })(ck), 3);
      html += '<div class="mini-legend">scale: ±' + dSc.vmax.toFixed(3) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    panel.innerHTML = html;
    bindCellClicks(panel);
  }

  // ── Cell composition tab ───────────────────────────────────
  function renderCellPanel(){
    var panel = document.getElementById("tab-cell");
    if (!selCell){
      panel.innerHTML = '<div class="cell-empty">Click any cell in the main heatmap or in a decomposition tile to inspect its probes.</div>';
      return;
    }
    var cell = CELLS[selCell];
    if (!cell){
      panel.innerHTML = '<div class="cell-empty">No data for cell ' + esc(selCell) + '.</div>';
      return;
    }

    var parts = selCell.split("_");
    var si = parseInt(parts[0], 10);
    var li = parseInt(parts[1], 10);
    var subj = SUBJ[si] || ("subject " + si);
    var lvl = LEVELS[li] || ("level " + li);

    // When viewing a single prompt, override per-probe responses with
    // that prompt's per_prompt_response[probe_idx] so the table shows
    // *this prompt's* probe responses rather than the session means.
    // The cell value displayed also switches to the per-prompt cell.
    var probes = (cell.probes || []).map(function(p){ return Object.assign({}, p); });
    var displayedCellValue = cell.cell_value || 0;
    var scopeLabel = "session aggregate";
    if (selPrompt !== "all"){
      var promptIdx = parseInt(selPrompt);
      var ppr = (DECOMP[PRIMARY] && DECOMP[PRIMARY].per_prompt_response) || null;
      if (ppr && ppr[promptIdx]){
        var row = ppr[promptIdx];
        var thresh = 0.05;
        var nE = 0, nO = 0, nN = 0, vmin = Infinity, vmax = -Infinity, vals = [];
        probes = probes.map(function(p){
          var v = row[p.probe_idx] || 0;
          var dir = (v > thresh) ? "excited"
                  : (v < -thresh) ? "opposed" : "orthogonal";
          if (v > thresh) nE++;
          else if (v < -thresh) nO++;
          else nN++;
          if (v < vmin) vmin = v;
          if (v > vmax) vmax = v;
          vals.push(v);
          return Object.assign({}, p, { response: v, direction: dir });
        });
        // Recompute the cell value for this prompt.
        var grid = gridForPrompt(view, PRIMARY, promptIdx);
        displayedCellValue = (grid[si] && grid[si][li] != null) ? grid[si][li] : 0;
        var pInfo = PROMPTS[promptIdx];
        scopeLabel = "prompt #" + (promptIdx + 1) +
          (pInfo ? " [" + (CAT_NAMES[pInfo.category] || pInfo.category) + "]" : "");
        // Override aggregate stats with per-prompt counts
        cell = Object.assign({}, cell, {
          n_excited: nE, n_opposed: nO, n_neutral: nN,
          probe_response_min: (probes.length ? vmin : 0),
          probe_response_max: (probes.length ? vmax : 0),
          probe_response_median: (function(){
            if (!vals.length) return 0;
            var s = vals.slice().sort(function(a,b){return a-b;});
            var m = Math.floor(s.length/2);
            return (s.length % 2) ? s[m] : 0.5*(s[m-1]+s[m]);
          })(),
        });
      }
    }
    sortProbes(probes);

    var v = displayedCellValue;
    var html = '<div class="cell-info">';
    html += '<div style="margin-bottom:8px"><b>' + esc(subj.replace(/_/g, " ")) +
            '</b> / <b>' + esc(lvl) + '</b> · ';
    html += 'cell value <span style="color:' +
            (v > 0 ? 'var(--excited)' : v < 0 ? 'var(--opposed)' : 'var(--text2)') +
            ';font-weight:600">' + (v >= 0 ? '+' : '') + v.toFixed(4) + '</span>';
    html += ' <span style="color:var(--text3)">(' + esc(scopeLabel) + ')</span>';
    html += '</div>';

    html += 'Probes: <b>' + (cell.n_probes || 0) + '</b> active';
    if (cell.n_probes_degenerate){
      html += ' <span style="color:var(--text3)">(' + cell.n_probes_degenerate +
              ' degenerate filtered)</span>';
    }
    html += ' · <span style="color:var(--excited)">' + (cell.n_excited || 0) + ' excited</span>';
    html += ' · <span style="color:var(--opposed)">' + (cell.n_opposed || 0) + ' opposed</span>';
    html += ' · <span style="color:var(--text3)">' + (cell.n_neutral || 0) + ' neutral</span>';
    html += '<br>response range [' + (cell.probe_response_min || 0).toFixed(4) +
            ', ' + (cell.probe_response_max || 0).toFixed(4) + ']';
    html += ' · median ' + (cell.probe_response_median || 0).toFixed(4);
    if (selPrompt === "all"){
      html += ' · variance ' + (cell.cell_variance || 0).toFixed(6);
    }
    html += '</div>';

    function arrow(k){
      if (sortKey !== k) return '';
      return '<span class="sort-arrow">' + (sortDir < 0 ? '▼' : '▲') + '</span>';
    }
    html += '<table class="tok">';
    html += '<thead><tr>';
    html += '<th class="sortable" data-sort="name">Probe' + arrow("name") + '</th>';
    html += '<th class="sortable" data-sort="signed">Response' + arrow("signed") + '</th>';
    html += '<th class="sortable" data-sort="abs">|Response|' + arrow("abs") + '</th>';
    html += '<th>Direction</th>';
    html += '</tr></thead><tbody>';

    for (var pi=0; pi<probes.length; pi++){
      var p = probes[pi];
      var resp = p.response || 0;
      var dir = p.direction || "—";
      var c = (dir === "excited") ? "var(--excited)"
            : (dir === "opposed") ? "var(--opposed)"
            : "var(--text3)";
      html += '<tr>';
      html += '<td style="color:var(--text)">' + esc(p.text || ("#" + p.probe_idx)) + '</td>';
      html += '<td style="color:' + c + ';font-variant-numeric:tabular-nums">' +
              (resp >= 0 ? '+' : '') + resp.toFixed(4) + '</td>';
      html += '<td style="color:var(--text2);font-variant-numeric:tabular-nums">' +
              Math.abs(resp).toFixed(4) + '</td>';
      html += '<td style="color:' + c + '">' + esc(dir) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';

    panel.innerHTML = html;

    // Wire sort headers
    var headers = panel.querySelectorAll("th.sortable");
    for (var i=0; i<headers.length; i++){
      headers[i].addEventListener("click", function(e){
        var k = e.currentTarget.getAttribute("data-sort");
        if (sortKey === k){
          sortDir = -sortDir;
        } else {
          sortKey = k;
          sortDir = (k === "name") ? 1 : -1;
        }
        renderCellPanel();
      });
    }
  }

  function sortProbes(arr){
    arr.sort(function(a, b){
      var av, bv;
      if (sortKey === "abs"){
        av = Math.abs(a.response || 0); bv = Math.abs(b.response || 0);
      } else if (sortKey === "signed"){
        av = a.response || 0; bv = b.response || 0;
      } else {
        av = (a.text || "").toLowerCase(); bv = (b.text || "").toLowerCase();
        if (av < bv) return -1 * sortDir;
        if (av > bv) return  1 * sortDir;
        return 0;
      }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return  1 * sortDir;
      return 0;
    });
  }

  // ── Glossary tab ───────────────────────────────────────────
  function renderGlossary(){
    var panel = document.getElementById("tab-glossary");
    if (panel.dataset.rendered) return;
    panel.dataset.rendered = "1";
    panel.innerHTML =
      '<dl class="glossary">' +

      '<div><dt>Prism</dt>' +
      '<dd>The probe lattice acts as a structured basis for decomposing the prompt\'s ' +
      'correction-induced field. Each probe contributes one direction to the basis: ' +
      '<code>Δp_i = p_i^{L_high} − p_i^{L_low}</code>, the L2-normalized difference between the probe\'s ' +
      'embeddings at two depths. The cell value at <i>(subject, level)</i> is the aggregated ' +
      'response of the probes assigned there, so the heatmap reads as "which subject-matter ' +
      'regions of the lattice does the prompt\'s correction-field excite or oppose?"</dd></div>' +

      '<div><dt>Beam</dt>' +
      '<dd>The prompt\'s contextualized field, captured by re-forwarding the prompt through ' +
      'the instruct model up to the probe\'s lower depth (<code>L_low</code>) and reducing the ' +
      'resulting <code>T × d_model</code> residual to a single vector. Default reduction is ' +
      '<code>mean</code> across token positions; <code>last</code> takes the final token; ' +
      '<code>rowspace</code> keeps the full subspace (richer for context-mixed prompts).</dd></div>' +

      '<div><dt>Circuit</dt>' +
      '<dd>Which sub-component of the model-side weight delta <code>ΔW</code> the beam is projected ' +
      'through. <code>full</code> is the sum across Q+K+V+O; <code>q/k/v/o</code> isolate a single ' +
      'projection; <code>qk</code> and <code>vo</code> are first-order operators for the routing ' +
      'and content-flow circuits respectively (computed as ' +
      '<code>ΔW_Q · W_K^{instr,T} + W_Q^{base} · ΔW_K^T</code> for QK, and analogously for VO).</dd></div>' +

      '<div><dt>Signed cosine</dt>' +
      '<dd>The default prism metric. For each probe, the signed cosine of the angle between ' +
      'its prism direction <code>Δp_i</code> and the beam-through-circuit <code>b · ΔW</code>. ' +
      'Range <code>[−1, +1]</code>. ' +
      '<span style="color:var(--excited)">Positive</span> = the correction pushed the prompt\'s ' +
      'field along this concept\'s natural depth-trajectory. ' +
      '<span style="color:var(--opposed)">Negative</span> = the correction pushed against it. ' +
      'Zero = orthogonal.</dd></div>' +

      '<div><dt>Cell aggregation</dt>' +
      '<dd>How the per-probe responses within a cell collapse to one cell value. ' +
      '<code>sum</code> (default) treats each probe as an independent detector — cells with more ' +
      'probes firing read brighter. <code>mean</code> normalizes by cell size; useful when the lattice ' +
      'has uneven cell counts. <code>median</code> is robust to outlier probes within a cell.</dd></div>' +

      '<div><dt>Baseline (ΔW = I)</dt>' +
      '<dd>Same prompt, same lattice, but with the correction lens replaced by the identity. ' +
      'This shows what the prompt\'s field already looked like in concept-space before fine-tuning ' +
      'had any say. Subtracting <code>baseline</code> from <code>correction</code> isolates the ' +
      'cell-by-cell signal that is uniquely attributable to fine-tuning, with the prompt\'s ' +
      'pre-existing geometry removed.</dd></div>' +

      '<div><dt>Excited / opposed / neutral</dt>' +
      '<dd>Directional labels for individual probes, applied at threshold <code>±0.05</code>. ' +
      'Excited = the correction nudges the prompt\'s field along this probe\'s depth-trajectory. ' +
      'Opposed = it nudges against it. Neutral = the probe is orthogonal to the field within noise. ' +
      'A cell with mixed signs has internal disagreement that the cell value averages over.</dd></div>' +

      '<div><dt>Degenerate probes</dt>' +
      '<dd>Probes whose <code>Δp_i = p_i^{L_high} − p_i^{L_low}</code> has near-zero norm — ' +
      'i.e. the model\'s representation of that concept barely changed between the two cached depths. ' +
      'These probes can\'t serve as a basis direction, so they\'re excluded from the prism. The ' +
      'count is reported per-cell.</dd></div>' +

      '<div><dt>L_low / L_high</dt>' +
      '<dd>The two layer fractions at which the probe lattice was embedded (default 0.50 and 0.75). ' +
      'L_low is where the prompt\'s beam is captured (concept-space, before output-prediction). ' +
      'L_high is the further depth used to form the probe-side delta. The pair is recorded in ' +
      '<code>probe_config.json</code> at apply time.</dd></div>' +

      '</dl>';
  }
})();
</script>
</body>
</html>
