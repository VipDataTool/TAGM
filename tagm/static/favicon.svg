<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Stress map grid cells with varying heat intensity -->
  <!-- Row 1 -->
  <rect x="4" y="4" width="5" height="5" rx="1" fill="#22c55e" opacity="0.9"/>
  <rect x="10" y="4" width="5" height="5" rx="1" fill="#86efac" opacity="0.7"/>
  <rect x="16" y="4" width="5" height="5" rx="1" fill="#facc15" opacity="0.85"/>
  <rect x="22" y="4" width="5" height="5" rx="1" fill="#f97316" opacity="0.9"/>
  <!-- Row 2 -->
  <rect x="4" y="10" width="5" height="5" rx="1" fill="#86efac" opacity="0.6"/>
  <rect x="10" y="10" width="5" height="5" rx="1" fill="#22c55e" opacity="0.85"/>
  <rect x="16" y="10" width="5" height="5" rx="1" fill="#ef4444" opacity="0.95"/>
  <rect x="22" y="10" width="5" height="5" rx="1" fill="#facc15" opacity="0.8"/>
  <!-- Row 3 -->
  <rect x="4" y="16" width="5" height="5" rx="1" fill="#facc15" opacity="0.75"/>
  <rect x="10" y="16" width="5" height="5" rx="1" fill="#ef4444" opacity="0.9"/>
  <rect x="16" y="16" width="5" height="5" rx="1" fill="#f97316" opacity="0.85"/>
  <rect x="22" y="16" width="5" height="5" rx="1" fill="#22c55e" opacity="0.8"/>
  <!-- Row 4 -->
  <rect x="4" y="22" width="5" height="5" rx="1" fill="#f97316" opacity="0.85"/>
  <rect x="10" y="22" width="5" height="5" rx="1" fill="#facc15" opacity="0.7"/>
  <rect x="16" y="22" width="5" height="5" rx="1" fill="#22c55e" opacity="0.9"/>
  <rect x="22" y="22" width="5" height="5" rx="1" fill="#86efac" opacity="0.65"/>
</svg>
