<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAGM Roundtable</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#121212;--bg-1:#1E1E1E;--bg-2:#252525;--bg-3:#2d2d2d;--border:#333;--text-0:#DEE2E6;--text-1:#9CA3AF;--text-2:#6B7280;--text-3:#4B5563;--blue:#58a6ff;--green:#009E73;--orange:#E69F00;--red:#D55E00;--cyan:#56B4E9;--purple:#bc8cff;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-0);color:var(--text-0);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:500}
header a{color:var(--text-2);font-size:12px;text-decoration:none}
header a:hover{color:var(--text-0)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:8px;font-weight:500}
.pill-panel{background:#58a6ff20;color:var(--blue);border:1px solid #58a6ff40}
.pill-analysis{background:#bc8cff20;color:var(--purple);border:1px solid #bc8cff40}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;flex-wrap:wrap}
select{background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-family:var(--sans);font-size:12px;outline:none}
.btn{padding:4px 12px;border-radius:4px;font-family:var(--sans);font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--bg-3);color:var(--text-0)}
.btn:hover{background:#363636}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#000;border-color:var(--blue)}
.btn-primary:hover{background:#79bbff}
.sep{width:1px;height:18px;background:var(--border)}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 14px;border-radius:8px;line-height:1.5;font-size:13px;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--bg-3);border:1px solid var(--border)}
.msg.persona{align-self:flex-start;background:var(--bg-2)}
.msg.method{align-self:center;background:var(--bg-2);border:1px solid #bc8cff30;max-width:90%;font-size:12px}
.msg.system{align-self:center;color:var(--text-2);font-size:11px;font-style:italic;padding:4px}
.msg.error{align-self:center;color:var(--red);font-size:12px}
.msg-tag{font-family:var(--mono);font-size:10px;font-weight:600;margin-bottom:3px;letter-spacing:.3px}
.tag-persona{color:var(--blue)}.tag-method{color:var(--purple)}.tag-user{color:var(--text-2)}
.divider{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--text-3);font-size:10px;font-family:var(--mono)}
.divider::before,.divider::after{content:'';flex:1;border-top:1px dashed var(--border)}
.input-row{padding:10px 16px;background:var(--bg-1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.input-row textarea{flex:1;background:var(--bg-2);color:var(--text-0);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--sans);font-size:13px;resize:none;min-height:42px;max-height:100px;outline:none}
.input-row textarea:focus{border-color:var(--cyan)}
.status{font-size:10px;color:var(--text-3);padding:4px 16px;font-family:var(--mono);flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>TAGM Roundtable</h1>
  <a href="/">← Analyzer</a>
  <span class="pill pill-panel" id="stagePill">PANEL 1</span>
  <div class="controls">
    <select id="personaSelect"><option value="">Persona…</option></select>
    <button class="btn btn-primary" id="applyBtn" onclick="applyPersona()">Apply</button>
    <span class="sep"></span>
    <select id="methodSelect"><option value="">Method…</option></select>
    <button class="btn" onclick="applyMethod()">Run</button>
    <span class="sep"></span>
    <select id="stageType"><option>PANEL</option><option>ANALYSIS</option></select>
    <button class="btn" onclick="newStage()">New Stage</button>
    <span class="sep"></span>
    <button class="btn" onclick="exportSession()">Export</button>
    <button class="btn" style="color:var(--red)" onclick="resetSession()">Reset</button>
    <span class="sep"></span>
    <label class="btn" style="cursor:pointer">📄 CSV
      <input type="file" accept=".csv" onchange="loadTemplate(this)" style="display:none">
    </label>
  </div>
</header>
<div class="messages" id="messages"></div>
<div class="status" id="status">Type your inquiry to begin</div>
<div class="input-row">
  <textarea id="input" rows="1" placeholder="Type your inquiry…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button class="btn btn-primary" onclick="send()">Send</button>
</div>
<script>
var busy=false, sessionActive=false;

async function init(){
  try{
    var r=await(await fetch('/api/roundtable/participants')).json();
    if(r.ok) r.participants.forEach(function(p){
      if(!p.active) return;
      var o=document.createElement('option'); o.value=p.id;
      o.textContent=p.name+(p.role?' ('+p.role+')':'');
      document.getElementById('personaSelect').appendChild(o);
    });
  }catch(e){}
  try{
    var r2=await(await fetch('/api/roundtable/methods')).json();
    if(r2.ok&&r2.methods) r2.methods.forEach(function(m){
      var o=document.createElement('option'); o.value=m.name; o.textContent=m.name;
      document.getElementById('methodSelect').appendChild(o);
    });
  }catch(e){}
}
init();

async function ensureSession(topic){
  if(sessionActive) return true;
  try{
    var r=await(await fetch('/api/roundtable/interactive/start',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic})})).json();
    if(r.ok){sessionActive=true; return true}
    addMsg('error',r.error); return false;
  }catch(e){addMsg('error',e.message); return false}
}

async function send(){
  if(busy)return;
  var t=document.getElementById('input').value.trim(); if(!t)return;
  document.getElementById('input').value='';
  if(!sessionActive){
    if(!await ensureSession(t)) return;
    addMsg('user',t,'User'); setStatus('Session started — select a persona and click Apply'); return;
  }
  busy=true; addMsg('user',t,'User');
  await fetch('/api/roundtable/interactive/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
  busy=false; setStatus('Message added');
}

async function applyPersona(){
  var pid=document.getElementById('personaSelect').value;
  if(!pid||!sessionActive||busy) return;
  busy=true; document.getElementById('applyBtn').disabled=true;
  var th=addMsg('system','generating…'); setStatus('Generating…');
  try{
    var r=await(await fetch('/api/roundtable/interactive/apply_persona',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id:pid})})).json();
    th.remove();
    if(r.ok){addMsg('persona',r.response,r.name,r.role); setStatus(r.name+' responded');}
    else addMsg('error',r.error);
  }catch(e){th.remove();addMsg('error',e.message)}
  busy=false; document.getElementById('applyBtn').disabled=false;
}

async function applyMethod(){
  var m=document.getElementById('methodSelect').value;
  if(!m||!sessionActive||busy) return;
  busy=true; var th=addMsg('system','running '+m+'…');
  try{
    var r=await(await fetch('/api/roundtable/interactive/apply_method',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({method:m})})).json();
    th.remove();
    if(r.ok){addMsg('method',r.output,m); setStatus(m+' complete');}
    else addMsg('error',r.error);
  }catch(e){th.remove();addMsg('error',e.message)}
  busy=false;
}

async function newStage(){
  if(!sessionActive) return;
  var t=document.getElementById('stageType').value;
  var r=await(await fetch('/api/roundtable/interactive/new_stage',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({stage_type:t})})).json();
  if(r.ok){addDivider(r.label); updatePill(t,r.label); setStatus('New stage: '+r.label);}
}

async function exportSession(){
  if(!sessionActive) return;
  var r=await(await fetch('/api/roundtable/interactive/export')).json();
  if(r.ok&&r.export){
    var b=new Blob([JSON.stringify(r.export,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='roundtable_'+r.export.session_id+'.json'; a.click();
  }
}

async function resetSession(){
  await fetch('/api/roundtable/interactive/reset',{method:'POST'});
  sessionActive=false; document.getElementById('messages').innerHTML='';
  updatePill('PANEL','Panel 1'); setStatus('Reset');
}

async function loadTemplate(input){
  var file=input.files[0]; if(!file)return;
  var text=await file.text();
  var topic=prompt('Discussion topic for batch run:','Roundtable discussion');
  if(!topic) return;
  addMsg('system','Running template: '+file.name);
  setStatus('Running batch…'); busy=true;
  try{
    var r=await(await fetch('/api/roundtable/batch',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({template_csv:text,topic:topic,temperature:0.7,max_tokens:256})})).json();
    if(r.ok&&r.result){
      var res=r.result;
      addMsg('system','Batch complete: '+res.n_stages+' stages, '+res.n_total_generations+' generations, '+res.elapsed_seconds+'s');
      if(res.final_output) addMsg('method',res.final_output.substring(0,3000),'Final Output');
    } else addMsg('error',r.error||'Batch failed');
  }catch(e){addMsg('error',e.message)}
  busy=false; input.value='';
}

function addMsg(type,text,name,role){
  var d=document.createElement('div'); d.className='msg '+type;
  if(name&&type!=='system'&&type!=='error'){
    var tag=document.createElement('div');
    tag.className='msg-tag '+(type==='persona'?'tag-persona':type==='method'?'tag-method':'tag-user');
    tag.textContent=name+(role?' — '+role:''); d.appendChild(tag);
  }
  var s=document.createElement('span'); s.textContent=text; d.appendChild(s);
  document.getElementById('messages').appendChild(d);
  document.getElementById('messages').scrollTop=9999999; return d;
}
function addDivider(label){
  var d=document.createElement('div'); d.className='divider'; d.textContent=label;
  document.getElementById('messages').appendChild(d);
}
function updatePill(type,label){
  var p=document.getElementById('stagePill'); p.textContent=label;
  p.className='pill '+(type==='ANALYSIS'?'pill-analysis':'pill-panel');
}
function setStatus(m){document.getElementById('status').textContent=m}

document.getElementById('input').addEventListener('input',function(){
  this.style.height='42px'; this.style.height=Math.min(this.scrollHeight,100)+'px';
});
</script>
</body>
</html>
